</helmet>
<div data-screen-label="100 Milhas Light" style="min-height:100vh; background:#030504; color:#f7faf6;">

  <header style="{{ headerStyle }}">

    </sc-for>

  <main id="conteudo">
  <!-- HERO -->
  <section style="position:relative; min-height:82svh; display:flex; align-items:flex-end; overflow:hidden; padding-top:90px; background:#020302;">
    <video autoplay loop muted playsinline preload="auto" poster="assets/posters/home-karting.jpg" aria-hidden="true" tabindex="-1" style="position:absolute; inset:0; z-index:0; width:100%; height:100%; object-fit:cover; object-position:center 50%; filter:saturate(.75) contrast(1.14) brightness(.46); pointer-events:none;">
      <source src="assets/videos/home-karting.mp4" type="video/mp4">
    </video>
    <div aria-hidden="true" style="position:absolute; inset:0; z-index:1; background:linear-gradient(90deg, rgba(2,4,3,.98) 0%, rgba(2,4,3,.82) 34%, rgba(2,4,3,.22) 66%, rgba(2,4,3,.78) 100%);"></div>
    <div aria-hidden="true" style="position:absolute; inset:0; z-index:2; background:linear-gradient(0deg, #030504 0%, transparent 33%, rgba(2,4,3,.14) 70%, rgba(2,4,3,.66) 100%);"></div>
    <div style="position:relative; z-index:5; width:min(1480px,calc(100% - 48px)); margin:0 auto; display:grid; grid-template-columns:1fr minmax(300px,.52fr); gap:50px; align-items:end; padding:clamp(150px,19vh,220px) 0 65px;">
      <div style="min-width:0;">
        <p style="margin:0 0 18px; color:#00e676; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.17em; text-transform:uppercase;">Endurance · Kart Light</p>
        <h1 style="margin:0; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; line-height:0.78; letter-spacing:-0.01em; font-size:clamp(64px,10.5vw,160px);">100 <span style="color:#00e676;">Milhas</span><br><span style="color:transparent; -webkit-text-stroke:1px rgba(255,255,255,.7);">Light</span></h1>
        <p style="max-width:46ch; margin:28px 0 0; font-size:clamp(18px,1.5vw,22px); line-height:1.5; color:#d7ded8;">2,5 horas de corrida em equipe com os karts light de locação do kartódromo. Domingo, 25 de outubro de 2026, a partir das 08:30.</p>
        <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:30px;">
          <sc-if value="{{ registrationOpen }}">
            <button type="button" onClick="{{ openModal }}" aria-haspopup="dialog" aria-controls="ml-dialog" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:56px; padding:0 26px; clip-path:polygon(7% 0,100% 0,93% 100%,0 100%); background:linear-gradient(135deg,#00e676,#00c853); color:#041301; font-family:'Anton',sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:0.04em; border:0; cursor:pointer;">Inscrever equipe <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>

          <sc-if value="{{ registrationClosed }}">

        </div>
      </div>

        <p style="margin:20px 0 0; font-family:'Anton',sans-serif; font-size:clamp(40px,7vw,80px); line-height:0.82; color:#f7faf6;">25 <span style="color:#00e676;">OUT</span></p>
        <p style="margin:10px 0 0; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; letter-spacing:0.14em; color:#d7ded8; text-transform:uppercase;">Domingo · edição 2026</p>
      </div>
    </div>
  </section>

  <div style="position:relative; z-index:20; margin-top:-1px;">
    <div style="width:min(1480px,calc(100% - 48px)); margin:0 auto;">
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); background:rgba(10,14,11,.96); border:1px solid rgba(255,255,255,.12); box-shadow:0 22px 60px rgba(0,0,0,.3);">

          <div style="padding:26px; border-right:1px solid rgba(255,255,255,.12); display:grid; grid-template-columns:auto 1fr; gap:15px; align-items:center;">

            <div><strong style="display:block; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; color:#00e676; font-size:16px;">{{ t.title }}</strong><span style="display:block; color:#a8b2aa; font-size:14px; margin-top:3px;">{{ t.text }}</span></div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- INSCRIÇÃO E VALORES -->
  <section id="inscricao" style="padding:clamp(88px,9vw,140px) 0;">
    <div style="width:min(1480px,calc(100% - 48px)); margin:0 auto; display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(28px,5vw,80px); align-items:center;">
      <div style="min-width:0;">
        <p style="margin:0 0 18px; color:#00e676; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.17em; text-transform:uppercase;">Inscrição e valores</p>
        <h2 style="margin:0; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(40px,5vw,64px); line-height:0.85;">Monte a equipe<br><span style="color:#00e676;">e garanta o kart</span></h2>
        <p style="max-width:46ch; margin:24px 0 0; color:#a8b2aa; font-size:clamp(16px,1.2vw,19px); line-height:1.6;">A inscrição é feita em quatro passos. O formulário registra a equipe no sistema do kartódromo e prepara a mensagem que conclui a inscrição no WhatsApp.</p>
        <ol style="list-style:none; display:grid; gap:14px; margin:28px 0 0; padding:0; max-width:46ch;">
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
            <li style="display:grid; grid-template-columns:34px 1fr; gap:14px; align-items:start; color:#a8b2aa; font-size:15px; line-height:1.45;"><span aria-hidden="true" style="display:grid; place-items:center; width:34px; height:34px; border:1px solid rgba(0,230,118,.45); color:#00e676; font-family:'Anton',sans-serif; font-size:15px; transform:skewX(-7deg);">{{ s.n }}</span><span><strong style="display:block; color:#f7faf6; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:14px; letter-spacing:0.02em;">{{ s.title }}</strong>{{ s.text }}</span></li>
          </sc-for>
        </ol>

        <div style="padding:18px 0; border-block:1px solid rgba(255,255,255,.12);"><strong style="display:block; font-family:'Anton',sans-serif; font-weight:400; font-size:56px; line-height:1; color:#00e676;">R$ 900 <span style="font-size:20px; color:#d7ded8;">por kart</span></strong><span style="display:block; margin-top:8px; color:#a8b2aa; font-size:15px;">Mesmo valor com 1, 2 ou 3 pilotos no kart.</span></div>
        <ul style="list-style:none; display:grid; gap:10px; margin:22px 0; padding:0;">

        </sc-if>

  <!-- A CORRIDA: TRAÇADO E JANELA DE BOXES -->
  <section aria-labelledby="corrida-title" style="background:#070b08; padding:clamp(88px,9vw,140px) 0; border-block:1px solid rgba(255,255,255,.08);">
    <div style="width:min(1480px,calc(100% - 48px)); margin:0 auto; display:grid; grid-template-columns:.95fr 1.05fr; gap:clamp(28px,5vw,80px); align-items:center;">

        <figcaption style="padding:14px 18px; background:#0b100c; color:#d7ded8; font-size:15px; border-top:1px solid rgba(255,255,255,.12);">Traçado oficial da prova: <strong style="color:#f7faf6;">11 invertido chicane, 961 m</strong>.</figcaption>

      <div style="min-width:0;">
        <p style="margin:0 0 18px; color:#00e676; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.17em; text-transform:uppercase;">A corrida</p>
        <h2 id="corrida-title" style="margin:0; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(40px,5vw,64px); line-height:0.85;">2h30 de prova,<br><span style="color:#00e676;">3 paradas no box</span></h2>
        <p style="max-width:46ch; margin:24px 0 0; color:#a8b2aa; font-size:clamp(16px,1.2vw,19px); line-height:1.6;">Cada equipe faz 3 paradas obrigatórias de no mínimo 7 minutos, com troca de kart e de piloto, dentro da janela em que o box fica aberto. Quando parar é estratégia da equipe.</p>

        <div style="margin-top:36px; max-width:640px;">
          <div aria-hidden="true" style="position:relative; height:22px; font-family:'Anton',sans-serif; font-size:13px; color:#00e676;">
            <span style="position:absolute; left:3.33%; bottom:0; transform:translateX(-10%); white-space:nowrap;">0:05&nbsp;box&nbsp;abre</span>
            <span style="position:absolute; right:13.33%; bottom:0; transform:translateX(50%); white-space:nowrap;">2:10&nbsp;fecha</span>

    if (location.hash === '#formulario' && Date.now() <= REGISTRATION_DEADLINE.getTime()) setTimeout(() => this.openModal(), 60);
    import('./motion.js').then((m) => { this._cleanup = m.initPageMotion({ progressBarSelector: '#progress' }); });
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('keydown', this._onKeydown);
    if (this._mq) { if (this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMqChange); else this._mq.removeListener(this._onMqChange); }
    if (this._cleanup) this._cleanup();
  }

  toggleMobileNav = () => this.setState((s) => ({ mobileNavOpen: !s.mobileNavOpen }));
  closeMobileNav = () => this.setState({ mobileNavOpen: false });
  stopPropagation = (e) => e.stopPropagation();
  onOverlayClick = () => this.closeModal();

  // ---------- Janela modal: foco, fundo inerte e rolagem ----------
  setBackgroundInert(inert) {
    const dialog = document.getElementById('ml-dialog');
    if (!dialog || !dialog.parentElement) return;
    Array.from(dialog.parentElement.children).forEach((el) => {
      if (el === dialog) return;
      if (inert) el.setAttribute('inert', ''); else el.removeAttribute('inert');
    });
    document.documentElement.style.overflow = inert ? 'hidden' : '';
  }

  later(fn, ms = 40) { setTimeout(() => requestAnimationFrame(fn), ms); }

  openModal = () => {
    this._trigger = document.activeElement;
    this.setState({ modalOpen: true });
    this.setBackgroundInert(true);
    if (!this._draftChecked) {
      this._draftChecked = true;
      this.restoreDraft();
    }
    this.later(() => {
      const target = this.state.result ? document.getElementById('ml-result-title') : document.getElementById('f-equipe');
      if (target) target.focus();
    }, 120);
  };

  closeModal = () => {
    const saved = this.state.result === 'saved';
    this.setState({ modalOpen: false });
    this.setBackgroundInert(false);
    if (saved) this.resetAll();
    // Aberto pelo link #formulario: limpa o hash para recarregar a página não reabrir a janela.
    if (location.hash === '#formulario') history.replaceState(null, '', location.pathname + location.search);
    const trigger = this._trigger && this._trigger !== document.body && document.contains(this._trigger)
      ? this._trigger
      : document.querySelector('[aria-controls="ml-dialog"]');
    if (trigger && trigger.focus) trigger.focus();
  };

  onDialogKeyDown = (e) => {
    if (e.key !== 'Tab') return;
    const panel = document.getElementById('ml-panel');
    if (!panel) return;
    const focusables = Array.from(panel.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'))
      .filter((el) => el.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };

  // ---------- Valores do formulário (campos não controlados) ----------
  form() { return document.getElementById('ml-form'); }

  snapshot() {
    const form = this.form();
    const values = {};
    if (!form) return values;
    Array.from(form.elements).forEach((el) => {
      if (!el.name) return;
      values[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return values;
  }

  restoreValues(values) {
    this.later(() => {
      const form = this.form();
      if (!form) return;
      Array.from(form.elements).forEach((el) => {
        if (!el.name || !(el.name in values)) return;
        if (el.type === 'checkbox') el.checked = Boolean(values[el.name]);
        else el.value = values[el.name];
      });
    });
  }

  // Muda a estrutura de karts/pilotos preservando o que já foi digitado.
  changeStructure(updater, overrides = {}) {
    const values = { ...this.snapshot(), ...overrides };
    this.setState(updater);
    this.restoreValues(values);
    this.scheduleDraftSave();
  }

  // Confirmação dentro do formulário (no visual do site) antes de apagar dados já digitados.
  requestConfirm(pending) {
    this.setState({ pendingConfirm: pending });
    this.later(() => {
      const cancel = document.getElementById(pending.type === 'karts' ? 'ml-confirm-cancel-karts' : 'ml-confirm-cancel-' + pending.id);
      if (cancel) cancel.focus();
    }, 40);
  }

  cancelConfirm = () => {
    const pending = this.state.pendingConfirm;
    this.setState({ pendingConfirm: null });
    this.later(() => {
      const el = pending && document.getElementById(pending.type === 'karts' ? 'f-karts' : 'ml-remove-' + pending.id);
      if (el) el.focus();
    }, 40);
  };

  acceptConfirm = () => {
    const pending = this.state.pendingConfirm;
    if (!pending) return;
    this.setState({ pendingConfirm: null });
    if (pending.type === 'karts') {
      this.applyKartCount(pending.count);
      this.later(() => { const el = document.getElementById('f-karts'); if (el) el.focus(); }, 90);
    } else {
      this.applyRemovePilot(pending.kartIndex, pending.id);
    }
  };

  onKartsChange = (e) => {
    const select = e.target;
    const count = Math.min(MAX_KARTS, Math.max(1, Number(select.value) || 1));
    const current = this.state.kartPilots.length;
    if (count === current) return;
    if (count < current) {
      // Confirma antes de descartar karts que já têm pilotos preenchidos.
      const values = this.snapshot();
      const removed = this.state.kartPilots.slice(count);
      const filled = removed.flat().filter((id) => ['nome', 'idade', 'altura', 'peso'].some((f) => String(values['p' + id + '_' + f] || '').trim()));
      if (filled.length) {
        select.value = String(current);
        const kartsLabel = removed.length === 1 ? 'o kart ' + (count + 1) : 'os karts ' + (count + 1) + ' a ' + current;
        const pilotsLabel = filled.length === 1 ? '1 piloto já preenchido' : filled.length + ' pilotos já preenchidos';
        this.requestConfirm({ type: 'karts', count, message: 'Remover ' + kartsLabel + ' e ' + pilotsLabel + '? Os dados desses pilotos serão apagados.' });
        return;
      }
    }
    this.applyKartCount(count);
  };

  applyKartCount(count) {
    this.changeStructure((s) => {
      const kartPilots = s.kartPilots.slice(0, count).map((list) => list.slice());
      let nextId = s.nextId;
      while (kartPilots.length < count) { kartPilots.push([nextId]); nextId += 1; }
      return { kartPilots, nextId };
    }, { qtd_karts: String(count) });
  }

  addPilot(kartIndex) {
    this.changeStructure((s) => {
      if (s.kartPilots[kartIndex].length >= PILOTS_PER_KART) return null;
      const kartPilots = s.kartPilots.map((list, i) => (i === kartIndex ? list.concat(s.nextId) : list.slice()));
      return { kartPilots, nextId: s.nextId + 1 };
    });
  }

  removePilot(kartIndex, id) {
    const values = this.snapshot();
    const filled = ['nome', 'idade', 'altura', 'peso'].some((f) => String(values['p' + id + '_' + f] || '').trim());
    if (filled) {
      const name = String(values['p' + id + '_nome'] || '').trim();
      const position = this.state.kartPilots[kartIndex].indexOf(id) + 1;
      this.requestConfirm({ type: 'pilot', kartIndex, id, message: 'Remover ' + (name || 'o piloto ' + position) + ' do kart ' + (kartIndex + 1) + '? Os dados digitados serão apagados.' });
      return;
    }
    this.applyRemovePilot(kartIndex, id);
  }

  applyRemovePilot(kartIndex, id) {
    const list = this.state.kartPilots[kartIndex] || [];
    const index = list.indexOf(id);
    // Foco vai para o piloto vizinho ou para o botão de adicionar, nunca para o topo da página.
    const neighbor = index > 0 ? list[index - 1] : list[index + 1];
    const focusId = neighbor ? 'f-p' + neighbor + '-nome' : 'ml-add-' + kartIndex;
    this.changeStructure((s) => {
      if (s.kartPilots[kartIndex].length <= 1) return null;
      const kartPilots = s.kartPilots.map((l, i) => (i === kartIndex ? l.filter((pid) => pid !== id) : l.slice()));
      const errors = { ...s.errors };
      ['nome', 'idade', 'altura', 'peso'].forEach((f) => { delete errors['p' + id + '_' + f]; });
      return { kartPilots, errors, errorOrder: s.errorOrder.filter((n) => n in errors) };
    });
    this.later(() => {
      const el = document.getElementById(focusId) || document.getElementById('ml-add-' + kartIndex);
      if (el) el.focus();
    }, 90);
  }

  focusField(name) {
    const form = this.form();
    const el = form ? form.querySelector('[name="' + name + '"]') : null;
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.focus({ preventScroll: true });
  }

  onFormInput = (e) => {
    const el = e.target;
    if (!el || !el.name) return;
    if (el.name === 'cpf') el.value = formatCpf(el.value);
    if (el.name === 'whatsapp') el.value = formatPhone(el.value);
    // Campo com erro é revalidado a cada alteração: a mensagem só some quando o valor fica válido.
    if (this.state.errors[el.name]) this.revalidateField(el.name);
    this.scheduleDraftSave();
  };

  // Ao sair de um campo preenchido (ou que já tinha erro), confere o valor na hora.
  onFormBlur = (e) => {
    const el = e.target;
    if (!el || !el.name || el.type === 'checkbox' || el.name === 'qtd_karts') return;
    const filled = String(el.value || '').trim() !== '';
    if (filled || this.state.errors[el.name]) this.revalidateField(el.name);
  };

  revalidateField(name) {
    const next = this.validate(this.collect()).errors[name];
    if (this.state.errors[name] === next) return;
    this.setState((s) => {
      const errors = { ...s.errors };
      let errorOrder = s.errorOrder;
      if (next) {
        errors[name] = next;
        if (!errorOrder.includes(name)) errorOrder = errorOrder.concat(name);
      } else {
        delete errors[name];
        errorOrder = errorOrder.filter((n) => n !== name);
      }
      return { errors, errorOrder };
    });
  }

  // ---------- Rascunho local (sem CPF) ----------
  scheduleDraftSave() {
    clearTimeout(this._draftTimer);
    this._draftTimer = setTimeout(() => {
      try {
        const values = this.snapshot();
        delete values.cpf;
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ kartPilots: this.state.kartPilots, nextId: this.state.nextId, values, savedAt: Date.now() }));
      } catch (error) { /* armazenamento indisponível: segue sem rascunho */ }
    }, 400);
  }

  restoreDraft() {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      const draft = JSON.parse(raw);
      const hasContent = draft && draft.values && Object.keys(draft.values).some((k) => draft.values[k] && k !== 'qtd_karts');
      if (!hasContent || !Array.isArray(draft.kartPilots) || !draft.kartPilots.length) return;
      this.setState({ kartPilots: draft.kartPilots.slice(0, MAX_KARTS), nextId: draft.nextId || 50, draftRestored: true });
      this.restoreValues(draft.values);
    } catch (error) { /* rascunho inválido: ignora */ }
  }

  clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (error) { /* ignora */ } }

  resetAll() {
    const form = this.form();
    if (form) form.reset();
    this.clearDraft();
    this.setState({ kartPilots: [[1]], nextId: 2, errors: {}, errorOrder: [], result: null, protocol: '', whatsappHref: '', copied: false, draftRestored: false, submitAttempted: false, pendingConfirm: null });
  }

  clearForm = () => {
    this.resetAll();
    this.later(() => { const el = document.getElementById('f-equipe'); if (el) el.focus(); });
  };

  // ---------- Validação ----------
  collect() {
    const v = this.snapshot();
    const pilots = [];
    this.state.kartPilots.forEach((list, kartIndex) => {
      list.forEach((id) => {
        pilots.push({
          id, kart: kartIndex + 1,
          nome: String(v['p' + id + '_nome'] || '').trim(),
          idadeRaw: v['p' + id + '_idade'], alturaRaw: v['p' + id + '_altura'], pesoRaw: v['p' + id + '_peso'],
          idade: Number(digits(v['p' + id + '_idade'])),
          altura: parseHeight(v['p' + id + '_altura']),
          peso: parseDecimal(v['p' + id + '_peso']),
        });
      });
    });
    return { v, pilots };
  }

  validate({ v, pilots }) {
    const errors = {};
    const need = (name, message) => { if (!String(v[name] || '').trim()) errors[name] = message; };
    need('nome_equipe', 'Informe o nome da equipe.');
    need('nome_chefe', 'Informe o nome completo do chefe de equipe.');
    if (!isValidCpf(v.cpf)) errors.cpf = digits(v.cpf).length ? 'CPF inválido. Confira os 11 dígitos.' : 'Informe o CPF do chefe de equipe.';
    const phone = digits(v.whatsapp);
    if (phone.length < 10 || phone.length > 11) errors.whatsapp = 'Informe o WhatsApp com DDD, por exemplo (31) 99999-9999.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v.email || '').trim())) errors.email = 'Informe um e-mail válido, por exemplo voce@email.com.';
    need('cidade', 'Informe a cidade da equipe.');

    const seen = new Map();
    pilots.forEach((p) => {
      const key = 'p' + p.id + '_';
      if (!p.nome) errors[key + 'nome'] = 'Informe o nome do piloto.';
      else if (seen.has(p.nome.toLowerCase())) errors[key + 'nome'] = 'Este piloto já está na inscrição. Cada piloto corre por um único kart.';
      if (p.nome) seen.set(p.nome.toLowerCase(), p.id);
      // Mensagens distintas para vazio, formato, limite mínimo do regulamento e valor improvável.
      if (!String(p.idadeRaw || '').trim()) errors[key + 'idade'] = 'Informe a idade.';
      else if (p.idade < 14) errors[key + 'idade'] = 'Idade mínima de 14 anos.';
      else if (p.idade > 90) errors[key + 'idade'] = 'Confira a idade: o limite é 90 anos.';
      if (!String(p.alturaRaw || '').trim()) errors[key + 'altura'] = 'Informe a altura.';
      else if (!Number.isFinite(p.altura)) errors[key + 'altura'] = 'Use metros, por exemplo 1,75.';
      else if (p.altura <= 1.5) errors[key + 'altura'] = 'Precisa ser acima de 1,50 m.';
      else if (p.altura > 2.3) errors[key + 'altura'] = 'Confira a altura: use metros, por exemplo 1,75.';
      if (!String(p.pesoRaw || '').trim()) errors[key + 'peso'] = 'Informe o peso.';
      else if (!Number.isFinite(p.peso)) errors[key + 'peso'] = 'Use só números, por exemplo 80.';
      else if (p.peso <= 50) errors[key + 'peso'] = 'Precisa ser acima de 50 kg.';
      else if (p.peso > 180) errors[key + 'peso'] = 'Confira o peso: o limite é 180 kg.';
    });

    need('pagamento', 'Escolha a forma de pagamento.');
    ['aceite_regulamento', 'aceite_requisitos', 'aceite_responsabilidade'].forEach((name) => {
      if (!v[name]) errors[name] = 'Marque esta confirmação para continuar.';
    });

    // Ordem igual à do formulário, para o resumo e para o foco.
    const form = this.form();
    const order = form ? Array.from(form.elements).map((el) => el.name).filter((n, i, arr) => n && errors[n] && arr.indexOf(n) === i) : Object.keys(errors);
    return { errors, order };
  }

  focusFirstError(order) {
    this.later(() => {
      const form = this.form();
      const el = form && order.length ? form.querySelector('[name="' + order[0] + '"]') : null;
      if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.focus({ preventScroll: true });
    }, 60);
  }

  // ---------- Envio ----------
  buildWhatsappMessage(v, pilots, protocol) {
    const karts = this.state.kartPilots.length;
    const lines = ['Olá! Quero concluir a inscrição da minha equipe nas *' + EVENT_NAME + '* (25/10/2026).', ''];
    if (protocol) lines.push('*Protocolo:* ' + protocol);
    lines.push('*Equipe:* ' + v.nome_equipe);
    lines.push('*Chefe de equipe:* ' + v.nome_chefe);
    lines.push('*CPF:* ' + v.cpf);
    lines.push('*WhatsApp:* ' + v.whatsapp);
    lines.push('*E-mail:* ' + v.email);
    lines.push('*Cidade:* ' + v.cidade);
    for (let k = 1; k <= karts; k += 1) {
      lines.push('', '*Kart ' + k + ':*');
      pilots.filter((p) => p.kart === k).forEach((p, i) => {
        lines.push((i + 1) + '. ' + p.nome + ' — ' + p.idade + ' anos, ' + formatNumberBR(p.altura.toFixed(2)) + ' m, ' + formatNumberBR(p.peso) + ' kg');
      });
    }
    lines.push('', '*Pagamento:* ' + v.pagamento);
    lines.push('*Total:* ' + formatBRL(karts * PRICE_PER_KART) + ' (' + karts + ' × ' + formatBRL(PRICE_PER_KART) + ')');
    const obs = String(v.observacoes || '').trim();
    if (obs) lines.push('*Observações:* ' + obs);
    lines.push('', 'Aceito o regulamento e confirmo os requisitos dos pilotos.');
    if (!protocol) lines.push('(Não consegui registrar pelo site — favor cadastrar manualmente.)');
    lines.push('Aguardo os dados para pagamento.');
    return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
  }

  buildPayload(v, pilots) {
    const karts = this.state.kartPilots.length;
    return {
      campeonato_id: '100-milhas-light',
      evento: EVENT_NAME,
      modalidade: 'equipe',
      nomeEquipe: String(v.nome_equipe).trim(),
      nomeChefe: String(v.nome_chefe).trim(),
      cpf: v.cpf,
      whatsapp: v.whatsapp,
      email: String(v.email).trim(),
      cidade: String(v.cidade).trim(),
      quantidadeKarts: karts,
      pilotos: pilots.map((p) => ({ nome: p.nome, peso_kg: p.peso })),
      pagamento: v.pagamento + ' — total ' + formatBRL(karts * PRICE_PER_KART),
      observacoes: [
        pilots.map((p) => p.nome + ' (kart ' + p.kart + ', ' + p.idade + ' anos, ' + formatNumberBR(p.altura.toFixed(2)) + ' m, ' + formatNumberBR(p.peso) + ' kg)').join('; '),
        String(v.observacoes || '').trim(),
      ].filter(Boolean).join(' | '),
      acceptedRules: Boolean(v.aceite_regulamento),
      acceptedResponsibility: Boolean(v.aceite_responsabilidade),
      acceptedImage: Boolean(v.aceite_imagem),
      acceptedContact: true,
    };
  }

  async send(collected) {
    const { v, pilots } = collected;
    this.setState({ submitting: true });
    let protocol = '';
    try {
      const response = await fetch('/api/inscricao', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.buildPayload(v, pilots)) });
      const body = await response.json().catch(() => ({}));
      if (response.ok && body.protocol) protocol = body.protocol;
    } catch (error) {
      protocol = '';
    }
    const whatsappHref = this.buildWhatsappMessage(v, pilots, protocol);
    this.setState({ submitting: false, result: protocol ? 'saved' : 'failed', protocol, whatsappHref, copied: false });
    if (protocol) this.clearDraft();
    this.later(() => {
      const panel = document.getElementById('ml-panel');
      if (panel) panel.scrollTop = 0;
      const title = document.getElementById('ml-result-title');
      if (title) title.focus();
    }, 60);
  }

  onSubmit = (e) => {
    e.preventDefault();
    if (this.state.submitting) return;
    const collected = this.collect();
    const { errors, order } = this.validate(collected);
    this.setState({ errors, errorOrder: order, submitAttempted: true, pendingConfirm: null });
    if (order.length) { this.focusFirstError(order); return; }
    this._lastCollected = collected;
    this.send(collected);
  };

  retrySubmit = () => {
    if (this.state.submitting) return;
    this.send(this._lastCollected || this.collect());
  };

  backToForm = () => {
    this.setState({ result: null });
    this.later(() => { const el = document.getElementById('f-equipe'); if (el) el.focus(); });
  };

  copyProtocol = () => {
    const text = this.state.protocol;
    const done = () => this.setState({ copied: true });
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => undefined);
  };

  renderVals() {
    const { headerScrolled, mobileNavOpen, isMobile, modalOpen, kartPilots, errors, submitting, result, protocol, whatsappHref, copied, draftRestored, submitAttempted, pendingConfirm } = this.state;
    const navBase = { fontFamily: "'Anton',sans-serif", textTransform: 'uppercase', fontSize: '11px', letterSpacing: '0.04em', padding: '10px 0', borderBottom: '2px solid transparent', textDecoration: 'none', transition: 'color .25s, border-color .25s' };
    const pages = [
      { label: 'Home', href: '/', id: 'home' },
      { label: 'A Pista', href: '/pista', id: 'pista' },
      { label: 'Locação', href: '/kart-locacao', id: 'locacao' },
      { label: 'Campeonatos', href: '/campeonatos', id: 'campeonatos' },
      { label: 'Eventos', href: '/eventos', id: 'eventos' },
      { label: 'BENEFÍCIOS', href: '/clube-vantagens', id: 'clube' },
      { label: 'Dúvidas', href: '/duvidas', id: 'duvidas' },
    ];
    const navLinks = pages.map((p) => ({ label: p.label, href: p.href, current: p.id === 'campeonatos' ? 'page' : undefined, style: { ...navBase, color: p.id === 'campeonatos' ? '#fff' : '#e1e6e1' } }));
    const registrationOpen = Date.now() <= REGISTRATION_DEADLINE.getTime();
    const karts = kartPilots.length;
    const totalPilots = kartPilots.reduce((sum, list) => sum + list.length, 0);

    const inv = {};
    Object.keys(errors).forEach((k) => { inv[k] = true; });

    let pilotNumber = 0;
    const kartBlocks = kartPilots.map((list, kartIndex) => ({
      title: 'Kart ' + (kartIndex + 1),
      groupLabel: 'Kart ' + (kartIndex + 1) + ', ' + list.length + (list.length === 1 ? ' piloto' : ' pilotos'),
      countLabel: list.length + ' de ' + PILOTS_PER_KART + ' pilotos',
      canAdd: list.length < PILOTS_PER_KART,
      addLabel: '+ Adicionar piloto ao kart ' + (kartIndex + 1),
      addId: 'ml-add-' + kartIndex,
      onAdd: () => this.addPilot(kartIndex),
      pilots: list.map((id, i) => {
        pilotNumber += 1;
        const base = 'p' + id + '_';
        const field = (f) => ({
          [f + 'Id']: 'f-p' + id + '-' + f,
          [f + 'Name']: base + f,
          [f + 'ErrId']: 'err-' + base + f,
          [f + 'Error']: errors[base + f] || '',
          [f + 'Invalid']: Boolean(errors[base + f]),
        });
        return {
          label: 'Piloto ' + (i + 1),
          canRemove: list.length > 1,
          removeAria: 'Remover piloto ' + (i + 1) + ' do kart ' + (kartIndex + 1),
          onRemove: () => this.removePilot(kartIndex, id),
          removeId: 'ml-remove-' + id,
          cancelId: 'ml-confirm-cancel-' + id,
          confirming: Boolean(pendingConfirm && pendingConfirm.type === 'pilot' && pendingConfirm.id === id),
