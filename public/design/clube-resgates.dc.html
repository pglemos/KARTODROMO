<!DOCTYPE html>
<html>
<head>
<base href="/">
<title>Histórico de Resgates | Clube de Vantagens</title>
<meta name="description" content="O histórico autenticado de resgates do Clube de Vantagens está em implantação.">
<meta name="robots" content="noindex, follow, noarchive">

<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Kartódromo Internacional de Betim">
<meta property="og:title" content="Histórico de Resgates | Clube de Vantagens">
<meta property="og:description" content="O histórico autenticado de resgates do Clube de Vantagens está em implantação.">
<meta property="og:url" content="https://kartodromodebetim.com.br/clube-resgates">
<meta property="og:image" content="https://kartodromodebetim.com.br/posters/home-karting.jpg">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<style data-generated="mobile-fit">

  [style*="grid-auto-flow:column"], [style*="grid-auto-flow: column"] { grid-auto-flow: row !important; }
  [style*="display:flex"]:not([style*="flex-wrap:nowrap"]) { flex-wrap: wrap; }
  img, video, iframe, canvas, svg, table { max-width: 100%; }
  [style*="white-space:nowrap"] { white-space: normal; }

  /* Alvo de toque mínimo de 44px nos links e botões de navegação. */
  header a, header button, nav a, nav button, footer a {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }
  [style*="min-height:32px"], [style*="min-height: 32px"],
  [style*="min-height:34px"], [style*="min-height: 34px"],
  [style*="min-height:38px"], [style*="min-height: 38px"],
  [style*="min-height:40px"], [style*="min-height: 40px"] { min-height: 44px !important; }
  header a:not([style*="width"]), header button { padding-inline: 12px; }

  :is(div, section, article, main, aside) > a[style*="font-weight: 700"]:not([style*="min-height"]) {

  }
  input[type="checkbox"], input[type="radio"] {
    width: 24px !important;

    flex: none;
  }

  /* Legibilidade: nada abaixo de 11px no celular. */

  [style*="font-size:9px"], [style*="font-size: 9px"],
  [style*="font-size:9.5px"], [style*="font-size: 9.5px"],

  /* Evita o zoom automático do iOS ao focar um campo. */

  /* Faixas que rolam na horizontal ganham rolagem suave por toque. */

    scroll-behavior: smooth;
  }

</style>
</head>
<body>
<x-dc>

<helmet>
  <link rel="icon" type="image/png" href="assets/brand/kib-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #030504; color: #f7faf6; font-family: 'Rajdhani', sans-serif; font-size: 17px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: #00e676; }
    a:hover { color: #3ce396; }
    a:focus-visible { outline: 2px solid #00e676; outline-offset: 2px; }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 260ms cubic-bezier(.16,1,.3,1) both kib-page-out; }
    ::view-transition-new(root) { animation: 320ms cubic-bezier(.16,1,.3,1) both kib-page-in; }
    @keyframes kib-page-out { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes kib-page-in { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
  </style>
</helmet>
<div data-screen-label="Clube — Histórico de Resgates" style="min-height:100vh; background:#030504; color:#f7faf6;">

  <header style="position:sticky; top:0; z-index:100; background:rgba(3,5,4,.92); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,.12);">
    <div style="width:min(1200px,calc(100% - 40px)); margin:0 auto; min-height:74px; display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <a href="/clube-vantagens" style="width:150px; flex:none;"><img src="assets/brand/kib-logo.png" alt="Kartódromo Internacional de Betim" style="width:100%;"></a>
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="{{ styles.pointsChip }}">{{ pontos }} pts</span>
        <a href="/clube-vantagens" style="font-size:12.5px; font-weight:700; color:#a8b2aa; text-decoration:none;">Sair</a>
      </div>
    </div>
    <nav aria-label="Menu do portal" style="width:min(1200px,calc(100% - 40px)); margin:0 auto; display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="8"><a href="{{ t.href }}" style="{{ t.style }}">{{ t.label }}</a></sc-for>
    </nav>
  </header>

  <main style="width:min(1200px,calc(100% - 40px)); margin:0 auto; padding:36px 0 80px; display:grid; gap:22px;">
    <div>
      <p style="margin:0 0 4px; color:#00e676; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;">Histórico</p>
      <h1 style="margin:0; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(30px,4vw,44px); line-height:0.9;">Resgates realizados</h1>
    </div>
    <section style="{{ styles.card }}">
      <sc-if value="{{ hasRedemptions }}">
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse;">
            <thead><tr><th style="{{ styles.th }}">Data</th><th style="{{ styles.th }}">Descrição</th><th style="{{ styles.th }}">Pontos</th></tr></thead>
            <tbody>
              <sc-for list="{{ redemptions }}" as="r" hint-placeholder-count="4">
                <tr>
                  <td style="{{ styles.td }}">{{ r.dataLabel }}</td>
                  <td style="{{ styles.td }}">{{ r.descricao }}</td>
                  <td style="{{ styles.td }}"><strong style="color:#ff6b6b;">{{ r.pontos }}</strong></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </sc-if>
      <sc-if value="{{ noRedemptions }}"><p style="margin:0; color:#a8b2aa; font-size:14px;">Você ainda não resgatou nenhuma recompensa.</p></sc-if>
      <a href="/clube-catalogo" style="{{ styles.primaryBtn }}">Ver catálogo de recompensas</a>
    </section>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  currentTab = 'resgates';
  state = { customer: null, redemptions: [] };

  componentDidMount() {
    import('./clube-shared.js').then((m) => {
      this.setState({ customer: m.CUSTOMER, redemptions: m.REDEMPTION_HISTORY, formatDateBR: m.formatDateBR });
    });
  }

  tabDefs() {
    return [
      { key: 'painel', label: 'Meu Painel', href: '/clube-painel' },
      { key: 'pontuacao', label: 'Minha Pontuação', href: '/clube-pontuacao' },
      { key: 'corridas', label: 'Histórico de Corridas', href: '/clube-corridas' },
      { key: 'resgates', label: 'Histórico de Resgates', href: '/clube-resgates' },
      { key: 'catalogo', label: 'Catálogo', href: '/clube-catalogo' },
      { key: 'campanhas', label: 'Campanhas', href: '/clube-campanhas' },
      { key: 'perfil', label: 'Meu Perfil', href: '/clube-perfil' },
      { key: 'regulamento', label: 'Regulamento', href: '/clube-regulamento' },
    ];
  }

  styles() {
    return {
      pointsChip: { fontSize: '12px', fontWeight: 700, padding: '7px 13px', borderRadius: '999px', background: 'rgba(0,230,118,.14)', color: '#00e676' },
      card: { background: '#0b100c', border: '1px solid rgba(255,255,255,.12)', padding: '24px' },
      th: { textAlign: 'left', padding: '9px 12px', fontSize: '11px', fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: '#8b948c', borderBottom: '1px solid rgba(255,255,255,.12)' },
      td: { padding: '12px', fontSize: '13.5px', color: '#d7ddd8', borderBottom: '1px solid rgba(255,255,255,.08)' },
      primaryBtn: { display: 'inline-block', marginTop: '18px', textAlign: 'center', minHeight: '46px', lineHeight: '46px', padding: '0 22px', clipPath: 'polygon(7% 0,100% 0,93% 100%,0 100%)', background: 'linear-gradient(135deg,#00e676,#00c853)', color: '#041301', fontFamily: "'Anton',sans-serif", textTransform: 'uppercase', fontSize: '12px', textDecoration: 'none' },
    };
  }

  renderVals() {
    const { customer, redemptions } = this.state;
    const s = this.styles();
    const tabs = this.tabDefs().map((t) => ({
      label: t.label, href: t.href,
      style: { flex: 'none', padding: '10px 14px', fontSize: '12.5px', fontWeight: 700, textDecoration: 'none', borderBottom: '2px solid ' + (t.key === this.currentTab ? '#00e676' : 'transparent'), color: t.key === this.currentTab ? '#fff' : '#a8b2aa', whiteSpace: 'nowrap' },
    }));
    if (!customer) return { styles: s, tabs, pontos: 0, redemptions: [], hasRedemptions: false, noRedemptions: true };

    const redemptions2 = redemptions.map((r) => ({ dataLabel: this.state.formatDateBR(r.data), descricao: r.descricao, pontos: r.pontos }));
    return { styles: s, tabs, pontos: customer.pontos, redemptions: redemptions2, hasRedemptions: redemptions2.length > 0, noRedemptions: redemptions2.length === 0 };
  }
}

</script>
<script>(function(){var n=location.pathname.split("/").pop();n=n.endsWith(".html")?n.slice(0,-5):n;n=n.endsWith(".dc")?n.slice(0,-3):n;var m={"home":"/","pista":"/pista","kart-locacao":"/kart-locacao","campeonatos":"/campeonatos","eventos":"/eventos","duvidas":"/duvidas","kac":"/kac","kac-super":"/kac-super","200-milhas":"/200-milhas","500-milhas":"/500-milhas","clube-vantagens":"/clube-vantagens","clube-cadastro":"/clube-cadastro","clube-consulta":"/clube-consulta","clube-painel":"/clube-painel","clube-corridas":"/clube-corridas","clube-pontuacao":"/clube-pontuacao","clube-catalogo":"/clube-catalogo","clube-resgates":"/clube-resgates","clube-perfil":"/clube-perfil","clube-regulamento":"/clube-regulamento","clube-campanhas":"/clube-campanhas"};if(m[n]&&location.pathname!==m[n])history.replaceState(null,"",m[n]+location.hash)})();</script>
<script data-generated="club-tab-focus">(function(){function focusTab(){var nav=document.querySelector('nav[aria-label="Menu do portal"]');if(!nav)return false;var current=nav.querySelector('a[href="'+location.pathname+'"]');if(!current)return false;if(nav.scrollWidth>nav.clientWidth+1){var offset=current.offsetLeft-(nav.clientWidth-current.offsetWidth)/2;nav.scrollTo({left:Math.max(0,offset),behavior:'auto'})}current.setAttribute('aria-current','page');return true}if(!focusTab()){var tries=0;var timer=setInterval(function(){if(focusTab()||++tries>40)clearInterval(timer)},100)}})();</script>
</body>
</html>
