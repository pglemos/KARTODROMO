<!DOCTYPE html>
<html>
<head>
<base href="/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <meta name="description" content="Histórico de Corridas — Clube de Vantagens Kartódromo de Betim">
  <link rel="icon" type="image/png" href="assets/brand/kib-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="./clube-portal.css" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #030504; color: #f7faf6; font-family: 'Rajdhani', sans-serif; font-size: 17px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: #00e676; }
    a:hover { color: #3ce396; }
    a:focus-visible { outline: 2px solid #00e676; outline-offset: 2px; }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 260ms cubic-bezier(.16,1,.3,1) both kib-page-out; }
    ::view-transition-new(root) { animation: 320ms cubic-bezier(.16,1,.3,1) both kib-page-in; }
    @keyframes kib-page-out { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes kib-page-in { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
  </style>
</helmet>
<div data-screen-label="Clube — Histórico de Corridas" style="min-height:100vh; background:#030504; color:#f7faf6;">

  <header class="club-shell-header" style="position:sticky; top:0; z-index:100; background:rgba(3,5,4,.92); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,.12);">
    <div class="club-shell-topbar" style="width:min(1200px,calc(100% - 40px)); margin:0 auto; min-height:74px; display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <a class="club-shell-brand" href="/clube-vantagens" style="width:150px; flex:none;"><img src="assets/brand/kib-logo.png" alt="Kartódromo Internacional de Betim" style="width:100%;"></a>
      <div class="club-shell-actions" style="display:flex; align-items:center; gap:14px;">
        <span class="club-points-chip" style="{{ styles.pointsChip }}">{{ pontos }} pts</span>
        <a class="club-exit-link" href="/clube-vantagens" style="font-size:12.5px; font-weight:700; color:#a8b2aa; text-decoration:none;">Sair</a>
      </div>
    </div>
    <div class="club-nav-wrap"><nav class="club-portal-nav" aria-label="Menu do portal" style="width:min(1200px,calc(100% - 40px)); margin:0 auto; display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="8"><a class="club-tab" href="{{ t.href }}" aria-current="{{ t.current }}" style="{{ t.style }}">{{ t.label }}</a></sc-for>
    </nav></div>
  </header>

  <main style="width:min(1200px,calc(100% - 40px)); margin:0 auto; padding:36px 0 80px; display:grid; gap:22px;">
    <div>
      <p style="margin:0 0 4px; color:#00e676; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;">Histórico</p>
      <h1 style="margin:0; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(30px,4vw,44px); line-height:0.9;">Corridas pontuadas</h1>
    </div>
    <section style="{{ styles.card }}">
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse;">
          <thead><tr><th style="{{ styles.th }}">Data</th><th style="{{ styles.th }}">Descrição</th><th style="{{ styles.th }}">Pontos</th></tr></thead>
          <tbody>
            <sc-for list="{{ races }}" as="r" hint-placeholder-count="8">
              <tr>
                <td style="{{ styles.td }}">{{ r.dataLabel }}</td>
                <td style="{{ styles.td }}">{{ r.descricao }}</td>
                <td style="{{ styles.td }}"><strong style="color:#00e676;">+{{ r.pontos }}</strong></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <p style="margin:18px 0 0; color:#a8b2aa; font-size:12.5px;">Total de {{ raceCount }} corridas pontuadas · {{ totalEarned }} pontos acumulados.</p>
    </section>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  currentTab = 'corridas';
  state = { customer: null, races: [] };

  componentDidMount() {
    import('./clube-shared.js').then((m) => {
      this.setState({ customer: m.CUSTOMER, races: m.RACE_HISTORY, formatDateBR: m.formatDateBR });
    });
  }

  tabDefs() {
    return [
      { key: 'painel', label: 'Meu Painel', href: '/clube-painel' },
      { key: 'pontuacao', label: 'Minha Pontuação', href: '/clube-pontuacao' },
      { key: 'corridas', label: 'Histórico de Corridas', href: '/clube-corridas' },
      { key: 'resgates', label: 'Histórico de Resgates', href: '/clube-resgates' },
      { key: 'catalogo', label: 'Catálogo', href: '/clube-catalogo' },
      { key: 'campanhas', label: 'Campanhas', href: '/clube-campanhas' },
      { key: 'perfil', label: 'Meu Perfil', href: '/clube-perfil' },
      { key: 'regulamento', label: 'Regulamento', href: '/clube-regulamento' },
    ];
  }

  styles() {
    return {
      pointsChip: { fontSize: '12px', fontWeight: 700, padding: '7px 13px', borderRadius: '999px', background: 'rgba(0,230,118,.14)', color: '#00e676' },
      card: { background: '#0b100c', border: '1px solid rgba(255,255,255,.12)', padding: '24px' },
      th: { textAlign: 'left', padding: '9px 12px', fontSize: '11px', fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: '#8b948c', borderBottom: '1px solid rgba(255,255,255,.12)' },
      td: { padding: '12px', fontSize: '13.5px', color: '#d7ddd8', borderBottom: '1px solid rgba(255,255,255,.08)' },
    };
  }

  renderVals() {
    const { customer, races } = this.state;
    const s = this.styles();
    const tabs = this.tabDefs().map((t) => ({
      label: t.label, href: t.href, current: t.key === this.currentTab ? 'page' : undefined,
      style: { flex: 'none', padding: '10px 14px', fontSize: '12.5px', fontWeight: 700, textDecoration: 'none', borderBottom: '2px solid ' + (t.key === this.currentTab ? '#00e676' : 'transparent'), color: t.key === this.currentTab ? '#fff' : '#a8b2aa', whiteSpace: 'nowrap' },
    }));
    if (!customer) return { styles: s, tabs, pontos: 0, races: [], raceCount: 0, totalEarned: 0 };

    const races2 = races.map((r) => ({ dataLabel: this.state.formatDateBR(r.data), descricao: r.descricao, pontos: r.pontos }));
    return { styles: s, tabs, pontos: customer.pontos, races: races2, raceCount: races.length, totalEarned: races.reduce((a, r) => a + r.pontos, 0) };
  }
}

</script>
<script>(function(){var n=location.pathname.split("/").pop();n=n.endsWith(".html")?n.slice(0,-5):n;n=n.endsWith(".dc")?n.slice(0,-3):n;var m={home:"/",pista:"/pista","kart-locacao":"/kart-locacao",campeonatos:"/campeonatos",eventos:"/eventos",duvidas:"/duvidas",kac:"/kac","kac-super":"/kac-super","200-milhas":"/200-milhas","500-milhas":"/500-milhas","clube-vantagens":"/clube-vantagens","clube-cadastro":"/clube-cadastro","clube-consulta":"/clube-consulta","clube-painel":"/clube-painel","clube-corridas":"/clube-corridas","clube-pontuacao":"/clube-pontuacao","clube-catalogo":"/clube-catalogo","clube-resgates":"/clube-resgates","clube-perfil":"/clube-perfil","clube-regulamento":"/clube-regulamento","clube-campanhas":"/clube-campanhas"};if(m[n]&&location.pathname!==m[n])history.replaceState(null,"",m[n]+location.hash)})();</script>
<script src="./clube-portal.js"></script>
</body>
</html>
