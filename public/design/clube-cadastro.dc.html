  /* Alvo de toque mínimo de 44px nos links e botões de navegação. */

    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }
  [style*="min-height:32px"], [style*="min-height: 32px"],
  [style*="min-height:34px"], [style*="min-height: 34px"],
  [style*="min-height:38px"], [style*="min-height: 38px"],

  header a:not([style*="width"]), header button { padding-inline: 12px; }

  /* Faixas que rolam na horizontal ganham rolagem suave por toque. */
  [style*="overflow-x:auto"], [style*="overflow-x: auto"] {
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;

<body>
<x-dc>

<helmet>
  <link rel="icon" type="image/png" href="assets/brand/kib-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #030504; color: #f7faf6; font-family: 'Rajdhani', sans-serif; font-size: 17px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: #00e676; }
    a:hover { color: #3ce396; }
    button, input, select { font: inherit; }
    input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid #00e676; outline-offset: 2px; }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 320ms cubic-bezier(.16,1,.3,1) both kib-page-out; }
    ::view-transition-new(root) { animation: 420ms cubic-bezier(.16,1,.3,1) both kib-page-in; }
    @keyframes kib-page-out { to { opacity: 0; transform: translateX(-24px); filter: blur(3px); } }
    @keyframes kib-page-in { from { opacity: 0; transform: translateX(24px); filter: blur(3px); } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
  </style>
</helmet>
<div data-screen-label="Cadastro Clube" style="min-height:100vh; background:#030504; color:#f7faf6;">

  <header style="position:fixed; inset:0 0 auto; z-index:300; background:rgba(3,5,4,.9); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,.12);">
    <div style="width:min(900px,calc(100% - 48px)); margin:0 auto; min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:24px;">
      <a href="/" style="width:160px; flex:none;"><img src="assets/brand/kib-logo.png" alt="Kartódromo Internacional de Betim" style="width:100%;"></a>
      <a href="/clube-vantagens" style="font-family:'Anton',sans-serif; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; color:#e1e6e1; text-decoration:none;">← Clube de Vantagens</a>
    </div>
  </header>

  <main style="padding:150px 24px 90px; display:grid; justify-items:center;">
    <sc-if value="{{ submitted }}">
      <div style="width:min(520px,100%); text-align:center;">
        <span style="display:inline-grid; place-items:center; width:64px; height:64px; border-radius:50%; background:rgba(0,230,118,.14); color:#00e676; font-size:30px; margin-bottom:20px;">✓</span>
        <h1 style="margin:0; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(32px,5vw,44px); line-height:0.9;">Cadastro realizado!</h1>
        <p style="margin:16px 0 0; color:#a8b2aa; font-size:15px; line-height:1.55;">Bem-vindo(a) ao Clube de Vantagens, {{ firstName }}. Suas próximas corridas já começam a gerar pontos.</p>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:28px; flex-wrap:wrap;">
          <a href="/clube-painel" style="min-height:52px; padding:0 24px; display:inline-flex; align-items:center; clip-path:polygon(7% 0,100% 0,93% 100%,0 100%); background:linear-gradient(135deg,#00e676,#00c853); color:#041301; font-family:'Anton',sans-serif; text-transform:uppercase; font-size:12.5px; text-decoration:none;">Ir para meu painel</a>
          <a href="/clube-catalogo" style="min-height:52px; padding:0 24px; display:inline-flex; align-items:center; clip-path:polygon(7% 0,100% 0,93% 100%,0 100%); background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.22); color:#fff; font-family:'Anton',sans-serif; text-transform:uppercase; font-size:12.5px; text-decoration:none;">Ver catálogo</a>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ showForm }}">
      <div style="width:min(600px,100%);">
        <p style="margin:0 0 12px; color:#00e676; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.17em; text-transform:uppercase; text-align:center;">Clube de Vantagens</p>
        <h1 style="margin:0; text-align:center; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(32px,5vw,46px); line-height:0.9;">Fazer meu cadastro</h1>
        <p style="margin:14px 0 0; text-align:center; color:#a8b2aa; font-size:15px;">Adesão gratuita. Leva menos de um minuto.</p>

        <form onSubmit="{{ onSubmit }}" style="margin-top:30px; display:grid; gap:14px; grid-template-columns:1fr 1fr; background:#0b100c; border:1px solid rgba(255,255,255,.18); padding:28px;">
          <div style="grid-column:1/-1; display:grid; gap:6px;"><label style="{{ styles.label }}">Nome completo</label><input required="" name="nome" placeholder="Seu nome completo" style="{{ styles.input }}"></div>
          <div style="display:grid; gap:6px;"><label style="{{ styles.label }}">CPF</label><input required="" name="cpf" inputmode="numeric" placeholder="000.000.000-00" style="{{ styles.input }}"></div>
          <div style="display:grid; gap:6px;"><label style="{{ styles.label }}">Data de nascimento</label><input required="" name="nascimento" type="date" style="{{ styles.input }}"></div>
          <div style="display:grid; gap:6px;"><label style="{{ styles.label }}">Telefone</label><input required="" name="telefone" type="tel" placeholder="(31) 90000-0000" style="{{ styles.input }}"></div>
          <div style="display:grid; gap:6px;"><label style="{{ styles.label }}">E-mail</label><input required="" name="email" type="email" placeholder="voce@email.com" style="{{ styles.input }}"></div>
          <div style="grid-column:1/-1; display:grid; gap:6px;"><label style="{{ styles.label }}">Cidade</label><input required="" name="cidade" placeholder="Sua cidade" style="{{ styles.input }}"></div>
          <label style="grid-column:1/-1; display:flex; align-items:flex-start; gap:10px; font-size:13.5px; color:#c8d0c9; cursor:pointer;">
            <input required="" type="checkbox" name="aceite" style="width:17px; height:17px; margin-top:2px; accent-color:#00e676;">
            Li e aceito o <a href="/clube-regulamento" target="_blank" style="color:#00e676;">regulamento do Clube de Vantagens</a>.
          </label>
          <button type="submit" style="grid-column:1/-1; margin-top:8px; min-height:54px; border:0; cursor:pointer; clip-path:polygon(7% 0,100% 0,93% 100%,0 100%); background:linear-gradient(135deg,#00e676,#00c853); color:#041301; font-family:'Anton',sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:0.04em;">Confirmar cadastro</button>
        </form>
      </div>
    </sc-if>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { submitted: false, firstName: '' };

  onSubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const nome = (f.get('nome') || '').toString().trim();
    this.setState({ submitted: true, firstName: nome.split(' ')[0] || 'piloto' });
  };

  renderVals() {
    const { submitted, firstName } = this.state;
    return {
      submitted, showForm: !submitted, firstName, onSubmit: this.onSubmit,
      styles: {
        label: { fontSize: '11px', fontWeight: 700, letterSpacing: '.03em', textTransform: 'uppercase', color: '#a8b2aa' },
        input: { width: '100%', height: '46px', border: '1px solid rgba(255,255,255,.18)', background: '#070b08', color: '#fff', padding: '0 14px', outline: 'none' },
      },
    };
  }
}

</script>

</body>
