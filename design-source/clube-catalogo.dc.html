<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <meta name="description" content="Catálogo de Recompensas — Clube de Vantagens Kartódromo de Betim">
  <link rel="icon" type="image/png" href="assets/brand/kib-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #030504; color: #f7faf6; font-family: 'Rajdhani', sans-serif; font-size: 17px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: #00e676; }
    a:hover { color: #3ce396; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid #00e676; outline-offset: 2px; }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 260ms cubic-bezier(.16,1,.3,1) both kib-page-out; }
    ::view-transition-new(root) { animation: 320ms cubic-bezier(.16,1,.3,1) both kib-page-in; }
    @keyframes kib-page-out { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes kib-page-in { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
  </style>
</helmet>
<div data-screen-label="Clube — Catálogo" style="min-height:100vh; background:#030504; color:#f7faf6;">

  <header style="position:sticky; top:0; z-index:100; background:rgba(3,5,4,.92); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,.12);">
    <div style="width:min(1200px,calc(100% - 40px)); margin:0 auto; min-height:74px; display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <a href="clube-vantagens.dc.html" style="width:150px; flex:none;"><img src="assets/brand/kib-logo.png" alt="Kartódromo Internacional de Betim" style="width:100%;"></a>
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="{{ styles.pointsChip }}">{{ pontos }} pts</span>
        <a href="clube-vantagens.dc.html" style="font-size:12.5px; font-weight:700; color:#a8b2aa; text-decoration:none;">Sair</a>
      </div>
    </div>
    <nav aria-label="Menu do portal" style="width:min(1200px,calc(100% - 40px)); margin:0 auto; display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="8"><a href="{{ t.href }}" style="{{ t.style }}">{{ t.label }}</a></sc-for>
    </nav>
  </header>

  <main style="width:min(1200px,calc(100% - 40px)); margin:0 auto; padding:36px 0 80px; display:grid; gap:22px;">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div>
        <p style="margin:0 0 4px; color:#00e676; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;">Catálogo</p>
        <h1 style="margin:0; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(30px,4vw,44px); line-height:0.9;">Recompensas disponíveis</h1>
      </div>
      <sc-if value="{{ toastMessage }}"><span style="{{ styles.toast }}">{{ toastMessage }}</span></sc-if>
    </div>

    <div style="{{ styles.grid }}">
      <sc-for list="{{ rewards }}" as="r" hint-placeholder-count="5">
        <article style="{{ styles.card }}">
          <span style="{{ styles.categoryTag }}">{{ r.categoria }}</span>
          <strong style="{{ styles.rewardName }}">{{ r.nome }}</strong>
          <strong style="{{ styles.rewardPoints }}">{{ r.pontos }} pts</strong>
          <button type="button" onClick="{{ r.onRedeem }}" disabled="{{ r.disabled }}" style="{{ r.btnStyle }}">{{ r.btnLabel }}</button>
        </article>
      </sc-for>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  currentTab = 'catalogo';
  state = { customer: null, rewards: [], toastMessage: null };

  componentDidMount() {
    import('./clube-shared.js').then((m) => {
      this.setState({ customer: Object.assign({}, m.CUSTOMER), rewards: m.REWARDS.slice() });
    });
  }

  redeem = (reward) => {
    const { customer } = this.state;
    if (!customer || customer.pontos < reward.pontos) return;
    this.setState((s) => ({
      customer: Object.assign({}, s.customer, { pontos: s.customer.pontos - reward.pontos }),
      toastMessage: 'Resgate de "' + reward.nome + '" confirmado!',
    }));
    window.clearTimeout(this._toastTimer);
    this._toastTimer = window.setTimeout(() => this.setState({ toastMessage: null }), 3200);
  };

  tabDefs() {
    return [
      { key: 'painel', label: 'Meu Painel', href: 'clube-painel.dc.html' },
      { key: 'pontuacao', label: 'Minha Pontuação', href: 'clube-pontuacao.dc.html' },
      { key: 'corridas', label: 'Histórico de Corridas', href: 'clube-corridas.dc.html' },
      { key: 'resgates', label: 'Histórico de Resgates', href: 'clube-resgates.dc.html' },
      { key: 'catalogo', label: 'Catálogo', href: 'clube-catalogo.dc.html' },
      { key: 'campanhas', label: 'Campanhas', href: 'clube-campanhas.dc.html' },
      { key: 'perfil', label: 'Meu Perfil', href: 'clube-perfil.dc.html' },
      { key: 'regulamento', label: 'Regulamento', href: 'clube-regulamento.dc.html' },
    ];
  }

  styles() {
    return {
      pointsChip: { fontSize: '12px', fontWeight: 700, padding: '7px 13px', borderRadius: '999px', background: 'rgba(0,230,118,.14)', color: '#00e676' },
      toast: { fontSize: '12.5px', fontWeight: 700, padding: '8px 14px', borderRadius: '999px', background: 'rgba(0,230,118,.14)', color: '#00e676' },
      grid: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '14px' },
      card: { display: 'grid', gap: '8px', background: '#0b100c', border: '1px solid rgba(255,255,255,.12)', padding: '20px' },
      categoryTag: { fontSize: '10.5px', fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: '#a8b2aa' },
      rewardName: { fontSize: '17px', fontWeight: 700, color: '#fff' },
      rewardPoints: { fontFamily: "'Anton',sans-serif", fontWeight: 400, fontSize: '26px', color: '#00e676' },
    };
  }

  renderVals() {
    const { customer, rewards, toastMessage } = this.state;
    const s = this.styles();
    const tabs = this.tabDefs().map((t) => ({
      label: t.label, href: t.href,
      style: { flex: 'none', padding: '10px 14px', fontSize: '12.5px', fontWeight: 700, textDecoration: 'none', borderBottom: '2px solid ' + (t.key === this.currentTab ? '#00e676' : 'transparent'), color: t.key === this.currentTab ? '#fff' : '#a8b2aa', whiteSpace: 'nowrap' },
    }));
    if (!customer) return { styles: s, tabs, pontos: 0, rewards: [], toastMessage: null };

    const rewardsOut = rewards.map((r) => {
      const canRedeem = customer.pontos >= r.pontos;
      return {
        nome: r.nome, categoria: r.categoria, pontos: r.pontos,
        onRedeem: () => this.redeem(r), disabled: !canRedeem,
        btnLabel: canRedeem ? 'Resgatar' : 'Pontos insuficientes',
        btnStyle: { marginTop: '8px', minHeight: '42px', border: 0, cursor: canRedeem ? 'pointer' : 'not-allowed', clipPath: 'polygon(7% 0,100% 0,93% 100%,0 100%)', background: canRedeem ? 'linear-gradient(135deg,#00e676,#00c853)' : 'rgba(255,255,255,.08)', color: canRedeem ? '#041301' : '#6b756c', fontFamily: "'Anton',sans-serif", textTransform: 'uppercase', fontSize: '11.5px' },
      };
    });

    return { styles: s, tabs, pontos: customer.pontos, rewards: rewardsOut, toastMessage };
  }
}

</script>
</body>
</html>
