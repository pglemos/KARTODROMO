openapi: 3.1.0
info:
  title: Kartódromo Internacional de Betim - Servidor de Operação (SRVKART)
  version: 1.0.0
  description: Especificação OpenAPI 3.1.0 completa da API operacional do
    Kartódromo Internacional de Betim (SRVKART :4060). Atende os programas
    nativos Windows de Recepção, Totens de Autoatendimento, Cronometragem
    (ORBITS/TranX), Painel Web de Gestão e integrações com o site.
  license:
    name: Proprietary
    url: https://www.kartodromodebetim.com.br
  contact:
    name: Operação de TI - Kartódromo de Betim
    email: contato@kartodromodebetim.com.br
servers:
  - url: http://192.168.20.13:4060
    description: Servidor de Produção SRVKART (Rede Local)
  - url: https://ssh.kartodromodebetim.com.br:4060
    description: Túnel Cloudflare (Auditoria Externa)
tags:
  - name: Sistema & Diagnóstico
    description: Monitoramento de integridade e heartbeat
  - name: Autenticação
    description: Emissão e renovação de tokens de operadores
  - name: Totem - Autoatendimento
    description: Fluxo público dos totens de pilotos e cadastro
  - name: Recepção - Clientes
    description: Gestão completa do catálogo de clientes e dependentes
  - name: Recepção - Baterias & Grid
    description: Gestão das baterias, horários, tipos e vagas
  - name: Recepção - Reservas
    description: Inscrições, confirmações e aprovação de reservas
  - name: Recepção - Agenda
    description: Visualização da ocupação diária da pista
  - name: Recepção - Caixa & Vendas
    description: Operações de caixa, sangrias, suprimentos e checkout
  - name: Recepção - Oficina & Karts
    description: Controle de horas de uso e manutenção preventiva de karts
  - name: Recepção - Vouchers & Convênios
    description: Emissão e validação de vouchers promocionais
  - name: Recepção - Fidelidade
    description: Programa de pontos e pontuação de pilotos
  - name: Recepção - Parceiros & Comissões
    description: Gestão de parceiros, comissionamento e acertos
  - name: Recepção - Apoio & Configurações
    description: Tabelas auxiliares, permissões e parâmetros do sistema
  - name: Recepção - Impressão Térmica
    description: Fila de impressão assíncrona para a impressora TM-T20
  - name: Recepção - Grupos & Reservas Web
    description: Gestão de baterias fechadas e grupos com pagamento online
  - name: Recepção - Campeonatos & Etapas
    description: Pontuação, etapas e regras de campeonatos
  - name: Recepção - Inscrições 200 Milhas
    description: Equipes, pilotos e faturamento do campeonato
  - name: Recepção - Endurance
    description: Regras, paradas, pesagens e telemetria de corridas longas
  - name: Recepção - Pilotos & Ranking
    description: Histórico, carreira e tempos por traçado
  - name: Recepção - Cronometragem & Resultados
    description: Consulta de sessões e dados de volta da cronometragem
  - name: Cronometragem (Integrado)
    description: Ponte de comunicação segura com o decoder MYLAPS/ORBITS
  - name: Campeonato Site (Integração)
    description: Endpoints chamados pelo site institucional para inscrições
  - name: Público - Endurance
    description: Página pública do chefe de equipe para acompanhamento de voltas
  - name: Termos & Relatórios
    description: Visualização e impressão de termos assinados e relatórios
  - name: Atualizações Desktop
    description: Distribuição automática de binários para os programas Windows
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token de sessão HMAC-SHA256 emitido no login da Recepção (/api/login)
    OpsKeyAuth:
      type: apiKey
      in: header
      name: x-ops-key
      description: Chave pré-compartilhada para comunicação da Cronometragem e do Site
        com o SRVKART
    TotemClientSignature:
      type: apiKey
      in: header
      name: token
      description: Assinatura HMAC sha256("cli:" + id) emitida na identificação do totem
    TermoSignature:
      type: apiKey
      in: query
      name: s
      description: Assinatura HMAC sha256("termo:" + ids) para validação do termo impresso
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Mensagem explicativa do erro ocorrido.
      required:
        - error
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        sqlAgora:
          type: string
          example: 2026-11-07T02:49:10
      required:
        - ok
        - sqlAgora
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          example: admin
        senha:
          type: string
          example: senha123
        termos:
          type: boolean
          example: true
      required:
        - login
        - senha
        - termos
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJ1aWQiOjEsIm5vbWUiOiJBZG1pbiIsImFkbWluIjp0cnVlfQ.signature
        usuario:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nome:
              type: string
              example: Administrador
            admin:
              type: boolean
              example: true
          required:
            - id
            - nome
            - admin
      required:
        - token
        - usuario
    TotemConfigResponse:
      type: object
      properties:
        empresa:
          type: string
          example: KARTODROMO INTERNACIONAL DE BETIM
        mensagem:
          type: string
          example: Seja bem-vindo(a) ao Kartódromo!
        imprimirTermo:
          type: boolean
          example: true
        consultarCep:
          type: boolean
          example: true
        tecladoVirtual:
          type: boolean
          example: false
        permitirMenorSemResponsavel:
          type: boolean
          example: true
      required:
        - empresa
        - mensagem
        - imprimirTermo
    TotemIdentificarRequest:
      type: object
      properties:
        identificador:
          type: string
          description: CPF, RG, Passaporte ou E-mail
          example: "12345678900"
      required:
        - identificador
    TotemIdentificarResponse:
      type: object
      properties:
        cliente:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
              example: 1042
            nome:
              type: string
              example: PILOTO TESTE
            tipoDocumento:
              type: string
              example: CPF
            documento:
              type: string
              example: 123.456.789-00
            email:
              type: string
              example: piloto@exemplo.com
            instagram:
              type: string
              example: "@piloto"
            telefone:
              type: string
              example: (31) 99999-8888
            nascimento:
              type:
                - string
                - "null"
              example: 1995-05-12
            temNascimento:
              type: boolean
              example: true
            peso:
              type: string
              example: "78"
            cep:
              type: string
              example: 32600-000
            endereco:
              type: string
              example: Rua Principal, 100, Apto 201
            numero:
              type: string
              example: "100"
            complemento:
              type: string
              example: Apto 201
            bairro:
              type: string
              example: Centro
            cidade:
              type: string
              example: Betim
            estado:
              type: string
              example: MG
            lgpd:
              type: boolean
              example: true
            bloqueado:
              type: boolean
              example: false
        dependentes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 2050
              nome:
                type: string
                example: PILOTO JUNIOR
              nascimento:
                type: string
                example: 2015-08-10
              token:
                type: string
                example: signature-cli-2050
        token:
          type: string
          example: signature-cli-1042
    TotemCadastroRequest:
      type: object
      properties:
        id:
          type:
            - integer
            - "null"
          description: Id do cliente existente para atualização
        token:
          type:
            - string
            - "null"
          description: Assinatura cli:{id} caso id seja informado
        responsavelId:
          type:
            - integer
            - "null"
          description: Id do responsável caso seja menor
        responsavelToken:
          type:
            - string
            - "null"
          description: Assinatura cli:{responsavelId}
        lgpd:
          type: boolean
          example: true
        dados:
          type: object
          properties:
            nome:
              type: string
              example: NOVO PILOTO
            tipoDocumento:
              type: string
              enum:
                - CPF
                - RG
                - PASSAPORTE
                - OUTRO
              example: CPF
            documento:
              type: string
              example: "12345678900"
            nascimento:
              type: string
              format: date
              example: 1990-01-15
            email:
              type: string
              format: email
              example: piloto@novo.com
            telefone:
              type: string
              example: "31988887777"
            instagram:
              type: string
              example: "@pilotonovo"
            peso:
              type:
                - number
                - string
              example: 75
            cep:
              type: string
              example: "32600000"
            endereco:
              type: string
              example: Av das Américas
            numero:
              type: string
              example: "500"
            complemento:
              type: string
              example: Bloco B
            bairro:
              type: string
              example: Filadélfia
            cidade:
              type: string
              example: Betim
            estado:
              type: string
              example: MG
          required:
            - nome
            - nascimento
      required:
        - dados
    TotemBateriaItem:
      type: object
      properties:
        id:
          type: integer
          example: 532
        nome:
          type: string
          example: BATERIA 9:15
        inicio:
          type: string
          format: date-time
          example: 2026-11-07T09:15:00-03:00
        vagas:
          type: integer
          example: 30
        tipoKart:
          type: string
          example: light
        ocupadas:
          type: integer
          example: 27
        livres:
          type: integer
          example: 3
        endurance:
          type:
            - object
            - "null"
      required:
        - id
        - nome
        - inicio
        - vagas
        - ocupadas
        - livres
    TotemInscreverRequest:
      type: object
      properties:
        bateriaId:
          type: integer
          example: 532
        bateriaIds:
          type: array
          items:
            type: integer
          example:
            - 532
        participantes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1042
              token:
                type: string
                example: signature-cli-1042
            required:
              - id
              - token
        endurance:
          type: object
          properties:
            eventoId:
              type: integer
              example: 3
            equipeId:
              type: integer
              example: 12
            equipeIds:
              type: array
              items:
                type: integer
      required:
        - participantes
    TotemInscreverResponse:
      type: object
      properties:
        inscricoes:
          type: array
          items:
            type: integer
          example:
            - 89421
        inicio:
          type: string
          example: 2026-11-07T09:15
        termoUrl:
          type:
            - string
            - "null"
          example: /termo?ids=89421&s=abcd1234
        termoNaRecepcao:
          type: boolean
          example: true
        pulseiras:
          type: array
          items:
            type: object
            properties:
              nome:
                type: string
              pulseira:
                type: integer
              equipe:
                type: string
      required:
        - inscricoes
        - termoNaRecepcao
    ClienteOutput:
      type: object
      properties:
        id:
          type: integer
          example: 1042
        nome:
          type: string
          example: MARCELO SILVA
        documento:
          type:
            - string
            - "null"
          example: 123.456.789-00
        documentoNum:
          type:
            - string
            - "null"
          example: "12345678900"
        tipoDocumento:
          type:
            - string
            - "null"
          example: CPF
        nascimento:
          type:
            - string
            - "null"
          example: 1990-05-20
        email:
          type:
            - string
            - "null"
          example: marcelo@teste.com
        telefone:
          type:
            - string
            - "null"
          example: "31999998888"
        instagram:
          type:
            - string
            - "null"
          example: "@marcelo"
        peso:
          type:
            - number
            - "null"
          example: 78.5
        cidade:
          type:
            - string
            - "null"
          example: Betim
        estado:
          type:
            - string
            - "null"
          example: MG
        bloqueado:
          type: boolean
          example: false
        motivoBloqueio:
          type:
            - string
            - "null"
        responsavelId:
          type:
            - integer
            - "null"
        responsavelNome:
          type:
            - string
            - "null"
      required:
        - id
        - nome
    ClienteInput:
      type: object
      properties:
        nome:
          type: string
          example: PILOTO COMPLETO
        tipoDocumento:
          type: string
          example: CPF
        documento:
          type: string
          example: "12345678900"
        nascimento:
          type: string
          format: date
          example: 1988-10-10
        email:
          type: string
          example: piloto@betim.com
        telefone:
          type: string
          example: "31988887777"
        instagram:
          type: string
          example: "@piloto"
        peso:
          type:
            - number
            - string
          example: 80
        cep:
          type: string
          example: "32600000"
        endereco:
          type: string
          example: Rua das Flores
        numero:
          type: string
          example: "123"
        complemento:
          type: string
          example: ""
        bairro:
          type: string
          example: Centro
        cidade:
          type: string
          example: Betim
        estado:
          type: string
          example: MG
        bloqueado:
          type: boolean
          example: false
        motivoBloqueio:
          type: string
          example: ""
        responsavelId:
          type:
            - integer
            - "null"
      required:
        - nome
    BateriaOutput:
      type: object
      properties:
        id:
          type: integer
          example: 532
        nome:
          type: string
          example: BATERIA 9:15
        inicio:
          type: string
          format: date-time
          example: 2026-11-07T09:15:00-03:00
        tipoKart:
          type: string
          example: light
        vagas:
          type: integer
          example: 30
        status:
          type: string
          example: aberta
        produtoId:
          type: integer
          example: 1
        produtoNome:
          type: string
          example: BATERIA 20 MIN
        precoCentavos:
          type: integer
          example: 12000
        inscritos:
          type: integer
          example: 27
        pagos:
          type: integer
          example: 25
      required:
        - id
        - nome
        - inicio
        - vagas
        - status
    BateriaCreateInput:
      type: object
      properties:
        nome:
          type: string
          example: BATERIA EXTRA 20:00
        inicio:
          type: string
          format: date-time
          example: 2026-11-07T20:00:00-03:00
        vagas:
          type: integer
          example: 30
        produtoId:
          type: integer
          example: 1
        tracadoId:
          type:
            - integer
            - "null"
          example: 2
        tipoKart:
          type: string
          example: light
        voltaMinimaSeg:
          type: number
          example: 50.5
      required:
        - nome
        - inicio
        - vagas
        - produtoId
    GerarBateriasInput:
      type: object
      properties:
        data:
          type: string
          format: date
          example: 2026-11-08
        primeira:
          type: string
          example: 09:15
        intervaloMin:
          type: integer
          example: 35
        quantidade:
          type: integer
          example: 15
        vagas:
          type: integer
          example: 30
        produtoId:
          type: integer
          example: 1
        tracadoId:
          type:
            - integer
            - "null"
          example: 1
      required:
        - data
        - primeira
        - intervaloMin
        - quantidade
        - produtoId
    ReservaOutput:
      type: object
      properties:
        id:
          type: integer
          example: 9812
        bateriaId:
          type: integer
          example: 532
        bateriaNome:
          type: string
          example: BATERIA 9:15
        bateriaInicio:
          type: string
          example: 2026-11-07T09:15:00
        clienteId:
          type: integer
          example: 1042
        clienteNome:
          type: string
          example: MARCELO SILVA
        kart:
          type:
            - string
            - "null"
          example: "14"
        pago:
          type: boolean
          example: true
        aprovada:
          type: boolean
          example: true
        origem:
          type: string
          example: totem
        status:
          type: string
          example: ativa
        criadoEm:
          type: string
          example: 2026-11-07T02:40:00
      required:
        - id
        - bateriaId
        - clienteId
        - pago
        - aprovada
    VendaCreateInput:
      type: object
      properties:
        clienteId:
          type: integer
          example: 1042
        itens:
          type: array
          items:
            type: object
            properties:
              produtoId:
                type: integer
                example: 1
              quantidade:
                type: integer
                example: 1
              unitarioCentavos:
                type: integer
                example: 12000
              totalCentavos:
                type: integer
                example: 12000
              inscricaoId:
                type:
                  - integer
                  - "null"
                example: 9812
            required:
              - produtoId
              - quantidade
              - unitarioCentavos
        pagamentos:
          type: array
          items:
            type: object
            properties:
              formaId:
                type: integer
                example: 2
              valorCentavos:
                type: integer
                example: 12000
              parcelas:
                type: integer
                example: 1
            required:
              - formaId
              - valorCentavos
        descontoCentavos:
          type: integer
          example: 0
        observacao:
          type: string
          example: Venda de balcão
      required:
        - clienteId
        - itens
        - pagamentos
    CaixaStatusOutput:
      type: object
      properties:
        aberto:
          type: boolean
          example: true
        caixa:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
              example: 450
            terminalId:
              type: integer
              example: 1
            usuarioId:
              type: integer
              example: 1
            abertoEm:
              type: string
              example: 2026-11-07T08:00:00
            saldoInicialCentavos:
              type: integer
              example: 20000
            totalEntradasCentavos:
