          type: integer
          example: 4
        nome:
          type: string
          example: HOTEL BETIM
        tipo:
          type: string
          example: hotel
        comissaoPct:
          type: number
          example: 10
        chavePix:
          type:
            - string
            - "null"
          example: "12345678000199"
        ativo:
          type: boolean
          example: true
    VoucherOutput:
      type: object
      properties:
        id:
          type: integer
          example: 89
        codigo:
          type: string
          example: PROMO20
        descontoCentavos:
          type: integer
          example: 2000
        percentual:
          type: number
          example: 0
        validade:
          type: string
          format: date
          example: 2026-12-31
        ativo:
          type: boolean
          example: true
        utilizado:
          type: boolean
          example: false
    GrupoOutput:
      type: object
      properties:
        id:
          type: integer
          example: 34
        codigo:
          type: string
          example: GRP-2026-11-07-01
        bateriaId:
          type: integer
          example: 532
        responsavelId:
          type: integer
          example: 1042
        responsavelNome:
          type: string
          example: MARCELO SILVA
        modo:
          type: string
          enum:
            - individual
            - centralizado
          example: individual
        status:
          type: string
          example: ativa
        totalVagas:
          type: integer
          example: 15
        vagasPagas:
          type: integer
          example: 12
    EnduranceEventoOutput:
      type: object
      properties:
        id:
          type: integer
          example: 2
        nome:
          type: string
          example: 100 MILHAS DE BETIM
        data:
          type: string
          format: date
          example: 2026-11-15
        bateriaId:
          type:
            - integer
            - "null"
          example: 540
        sessaoCrono:
          type:
            - string
            - "null"
          example: session-endurance-100
        ativo:
          type: boolean
          example: true
        equipes:
          type: integer
          example: 18
        pilotos:
