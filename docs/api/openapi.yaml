          type: array
          items:
            type: object
            properties:
              kart:
                type: string
                example: "14"
              minutos:
                type: number
                example: 22
            required:
              - kart
              - minutos
      required:
        - karts
    FidelidadeContaOutput:
      type: object
      properties:
        id:
          type: integer
          example: 15
        clienteId:
          type: integer
          example: 1042
        clienteNome:
          type: string
          example: MARCELO SILVA
        saldoPontos:
          type: integer
          example: 450
        atualizadoEm:
          type: string
          example: 2026-11-05T14:30:00
    FidelidadeAjusteInput:
      type: object
      properties:
        pontos:
          type: integer
          description: Quantidade de pontos (+ ou -)
          example: 50
        motivo:
          type: string
          example: Bônus de corrida de aniversário
      required:
        - pontos
        - motivo
    ParceiroOutput:
      type: object
      properties:
