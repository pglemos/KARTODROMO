name: Deploy reserva online (worker kartodromo-cadastro)

# Servidor da reserva online e do pré-cadastro (workers/pre-cadastro): pedidos, Asaas, política de cancelamento.
# Desde 12/11/2026 o worker no ar é igual ao fonte (bundle conferido byte a byte); os remendos de docs/operacao/patches-producao são só histórico.
# Continua manual: várias sessões publicam este worker; publique só a partir do main atualizado.
# tests/grupo-link.test.ts trava o link do grupo e o painel do organizador (sumiram em deploys de 05/11 e 08/11).
on:
  workflow_dispatch:

concurrency:
  group: deploy-reservas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Testes da reserva e da política
        run: npx vitest run tests/reserva-online.test.ts tests/politica-cancelamento.test.ts tests/pre-cadastro-validar.test.ts tests/grupo-link.test.ts

      - name: Publicar worker
        working-directory: workers/pre-cadastro
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
