name: Premium reference preview

on:
  push:
    branches:
      - fix/premium-static-recovery-2026-07-20
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: premium-reference-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/fix/premium-static-recovery-2026-07-20' ||
      github.head_ref == 'fix/premium-static-recovery-2026-07-20'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate reference-copy contract
        run: npx vitest run tests/premium-static-recovery.test.ts

      - name: Build exact premium references
        run: node scripts/build-premium-reference.mjs premium-dist

      - name: Check Worker and runtime syntax
        run: |
          node --check workers/premium-preview-worker.mjs
          node --check premium-dist/support.js

      - name: Deploy isolated reference Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.premium-preview.jsonc 2>&1 | tee /tmp/premium-preview-deploy.log
          preview_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/premium-preview-deploy.log | tail -1)
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "$preview_url" > /tmp/premium-preview-url.txt

      - name: Smoke test clean routes and runtime assets
        shell: bash
        env:
          PREMIUM_PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/premium-smoke
          routes=('' 'pista' 'kart-locacao' 'campeonatos' 'eventos' 'duvidas' 'kac' 'kac-super' '200-milhas' '500-milhas')
          for path in "${routes[@]}"; do
            key="${path:-home}"
            curl -sS -L --max-redirs 4 \
              -D "/tmp/premium-smoke/${key}.headers" \
              -o "/tmp/premium-smoke/${key}.html" \
              -w '%{http_code} %{url_effective}\n' \
              "${PREMIUM_PREVIEW_URL}/${path}" > "/tmp/premium-smoke/${key}.meta"
            read -r status effective < "/tmp/premium-smoke/${key}.meta"
            test "$status" = '200'
            [[ "$effective" != *'/design/'* ]]
            grep -Fqi '<h1' "/tmp/premium-smoke/${key}.html"
            grep -Fqi 'x-premium-site: reference-source-v1' "/tmp/premium-smoke/${key}.headers"
          done
          curl -fsS "${PREMIUM_PREVIEW_URL}/support.js" -o /tmp/premium-smoke/support.js
          curl -fsS "${PREMIUM_PREVIEW_URL}/beneficios-nav.css" -o /tmp/premium-smoke/beneficios-nav.css
          test -s /tmp/premium-smoke/support.js
          test -s /tmp/premium-smoke/beneficios-nav.css

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare clean routes with original references
        env:
          PREMIUM_PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test tests/premium-static-preview.spec.ts --reporter=html,line

      - name: Publish verified preview URL on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- premium-static-preview -->';
            const body = `${marker}\n## Preview idêntico às referências originais\n\n${process.env.PREVIEW_URL}\n\nAs 10 rotas limpas foram comparadas com os arquivos \`/design/*.dc.html\` originais em mobile, tablet e desktop. A execução só fica verde quando as capturas são byte a byte idênticas e o runtime resolve todos os placeholders.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-reference-preview-evidence
          path: |
            /tmp/premium-preview-deploy.log
            /tmp/premium-preview-url.txt
            /tmp/premium-smoke
            playwright-report
            test-results/premium-reference-comparison
          if-no-files-found: ignore
