name: Emergency restore Worker version 83

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-restore-worker-version-83
  cancel-in-progress: false

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'incident/restore-worker-version-83-2026-07-20'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    steps:
      - name: Restore pre-incident deployment and domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/restore/public
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          target='32632ea1-6f92-4d5e-84e4-ccaedc1ab1fc'
          zone='b10bc7d100cd6e531702df35f1028361'

          curl -fsS -X POST "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/kartodromo/deployments" \
            -H "$auth" -H 'Content-Type: application/json' \
            --data "{\"strategy\":\"percentage\",\"versions\":[{\"version_id\":\"${target}\",\"percentage\":100}]}" \
            > /tmp/restore/deployment.json
          jq -e '.success == true' /tmp/restore/deployment.json > /dev/null

          for host in kartodromodebetim.com.br www.kartodromodebetim.com.br; do
            curl -fsS -X PUT "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "$auth" -H 'Content-Type: application/json' \
              --data "{\"hostname\":\"${host}\",\"service\":\"kartodromo\",\"environment\":\"production\",\"zone_id\":\"${zone}\"}" \
              > "/tmp/restore/domain-${host}.json"
            jq -e '.success == true' "/tmp/restore/domain-${host}.json" > /dev/null
          done

          curl -fsS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/kartodromo/deployments" -H "$auth" > /tmp/restore/deployments-after.json
          curl -fsS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "$auth" > /tmp/restore/domains-after.json

          active=$(jq -r '.result.deployments[0].versions[0].version_id // empty' /tmp/restore/deployments-after.json)
          domains=$(jq '[.result[] | select((.hostname == "kartodromodebetim.com.br" or .hostname == "www.kartodromodebetim.com.br") and .service == "kartodromo")] | length' /tmp/restore/domains-after.json)
          test "$active" = "$target"
          test "$domains" -eq 2

          curl -fsS -X POST "${api}/zones/${zone}/purge_cache" -H "$auth" -H 'Content-Type: application/json' --data '{"purge_everything":true}' > /tmp/restore/purge.json
          jq -e '.success == true' /tmp/restore/purge.json > /dev/null

      - name: Verify premium pages on root and www
        shell: bash
        run: |
          set -euo pipefail
          hosts=('kartodromodebetim.com.br' 'www.kartodromodebetim.com.br')
          paths=('' 'pista' 'kart-locacao' 'eventos' 'campeonatos')
          restored=false

          for attempt in $(seq 1 72); do
            all_ok=true
            for host in "${hosts[@]}"; do
              for path in "${paths[@]}"; do
                key="${host//./-}-${path:-home}"
                curl --max-time 30 -sS -L --max-redirs 5 \
                  -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                  -D "/tmp/restore/public/${key}.headers" \
                  -o "/tmp/restore/public/${key}.html" \
                  -w '%{http_code} %{url_effective}\n' \
                  "https://${host}/${path}" > "/tmp/restore/public/${key}.meta" || true

                read -r status effective < "/tmp/restore/public/${key}.meta" || true
                if [[ "${status:-}" != '200' ]] \
                  || [[ "${effective:-}" != *'/design/'* ]] \
                  || ! grep -Fq '<x-dc>' "/tmp/restore/public/${key}.html" \
                  || grep -Eqi '^x-opennext:[[:space:]]*1' "/tmp/restore/public/${key}.headers"; then
                  all_ok=false
                fi
              done
            done

            if [[ "$all_ok" == true ]]; then restored=true; break; fi
            sleep 5
          done

          for meta in /tmp/restore/public/*.meta; do echo "--- $meta"; cat "$meta"; done
          test "$restored" = true

      - name: Upload restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-version-83-restoration-evidence
          path: /tmp/restore
          if-no-files-found: error
