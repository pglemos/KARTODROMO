name: Mobile app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "app/privacidade/**"
      - "workers/pre-cadastro/**"
      - "migrations/ops/**"
      - "lib/timing/mobile-results.ts"
      - "lib/ops/**"
      - "services/ops-server.ts"
      - "services/timing-server.ts"
      - "desktop/src/Kartodromo.Cronometragem/**"
      - "desktop/src/Kartodromo.Recepcao/**"
      - "tests/**"
  pull_request:
    paths:
      - "mobile/**"
      - "app/privacidade/**"
      - "workers/pre-cadastro/**"
      - "migrations/ops/**"
      - "lib/timing/mobile-results.ts"
      - "lib/ops/**"
      - "services/ops-server.ts"
      - "services/timing-server.ts"
      - "desktop/src/Kartodromo.Cronometragem/**"
      - "desktop/src/Kartodromo.Recepcao/**"
      - "tests/**"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify mobile app and APIs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Root tests
        run: npm test -- --maxWorkers=1

      - name: Root typecheck
        run: npm run typecheck

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Mobile tests
        run: npm --prefix mobile test -- --runInBand

      - name: Mobile typecheck
        run: npm --prefix mobile run typecheck

      - name: Mobile lint
        run: npm --prefix mobile run lint -- --no-cache

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Export iOS and Android bundles
        working-directory: mobile
        run: npm run export

  eas-preview:
    name: Build internal iOS and Android candidates
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Build internal preview
        working-directory: mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          set -o pipefail
          if [ -z "${EXPO_TOKEN:-}" ] || [ -z "${EAS_PROJECT_ID:-}" ]; then
            echo "::error::Configure the GitHub EXPO_TOKEN secret and EAS_PROJECT_ID variable before running internal builds."
            exit 1
          fi
          npx eas-cli@24.13.0 build --platform all --profile preview --non-interactive 2>&1 | tee "$RUNNER_TEMP/eas-builds.log"

      - name: Save EAS build links and IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-preview-builds
          path: ${{ runner.temp }}/eas-builds.log
          if-no-files-found: ignore
