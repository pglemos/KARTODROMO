name: Public UI Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/public-ui-*'
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/design/**'
      - 'tests/capture-public-ui.spec.ts'
      - '.github/workflows/public-ui-baseline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/design/**'
      - 'tests/capture-public-ui.spec.ts'
      - '.github/workflows/public-ui-baseline.yml'

concurrency:
  group: public-ui-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Capture public UI references
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        shell: bash
        run: |
          npm start -- -p 4174 > /tmp/kartodromo-baseline-next.log 2>&1 &
          echo $! > /tmp/kartodromo-baseline-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kartodromo-baseline-next.log
          exit 1

      - name: Capture Next and design-reference screenshots
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174
        run: npx playwright test tests/capture-public-ui.spec.ts --workers=1 --reporter=line

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-baseline-${{ github.sha }}
          path: |
            artifacts/public-ui-baseline
            /tmp/kartodromo-baseline-next.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
