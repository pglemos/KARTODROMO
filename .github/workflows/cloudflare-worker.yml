name: Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify public site
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/npm-lock.log
          git diff --exit-code -- package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm start -- -p 4174 > /tmp/kartodromo-next.log 2>&1 &
          echo $! > /tmp/kartodromo-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kartodromo-next.log
          exit 1

      - name: Responsive and accessibility audit
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174
        run: |
          set -o pipefail
          npm run test:pre-delivery 2>&1 | tee /tmp/playwright.log

      - name: Build Cloudflare Worker
        run: npm run build:worker

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            /tmp/npm-lock.log
            /tmp/npm-ci.log
            /tmp/kartodromo-next.log
            /tmp/playwright.log
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      needs.verify.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'deploy/production-')
        )
      )
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy OpenNext Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://kartodromodebetim.com.br
        run: |
          set -o pipefail
          npm run deploy:worker 2>&1 | tee /tmp/cloudflare-deploy.log

      - name: Smoke test production domain
        id: smoke
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base='https://kartodromodebetim.com.br'
          mkdir -p /tmp/production-smoke

          root_ok=false
          for attempt in $(seq 1 30); do
            root_url="${base}/?release=${RELEASE_SHA}&attempt=${attempt}"
            curl -sS -L --max-redirs 5 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -D /tmp/production-smoke/root.headers \
              -o /tmp/production-smoke/root.html \
              -w '%{http_code} %{url_effective}\n' \
              "$root_url" > /tmp/production-smoke/root.meta

            read -r root_status root_effective < /tmp/production-smoke/root.meta
            if [[ "$root_status" == '200' ]] \
              && [[ "$root_effective" != *'/design/'* ]] \
              && ! grep -Fq '{{' /tmp/production-smoke/root.html \
              && grep -Fq 'rel="canonical"' /tmp/production-smoke/root.html \
              && grep -Fq 'https://kartodromodebetim.com.br' /tmp/production-smoke/root.html; then
              root_ok=true
              break
            fi
            sleep 5
          done

          cat /tmp/production-smoke/root.meta
          test "$root_ok" = true

          curl -sS -L \
            -H 'Cache-Control: no-cache' \
            -D /tmp/production-smoke/club.headers \
            -o /tmp/production-smoke/club.html \
            -w '%{http_code} %{url_effective}\n' \
            "${base}/clube-cadastro?release=${RELEASE_SHA}" > /tmp/production-smoke/club.meta
          read -r club_status club_effective < /tmp/production-smoke/club.meta
          test "$club_status" = '200'
          [[ "$club_effective" != *'/design/'* ]]
          grep -Fqi 'Portal em implantação' /tmp/production-smoke/club.html
          ! grep -Fq 'Rafael Nogueira' /tmp/production-smoke/club.html

          curl -sS --max-redirs 0 \
            -H 'Cache-Control: no-cache' \
            -D /tmp/production-smoke/values.headers \
            -o /tmp/production-smoke/values.body \
            "${base}/valores"
          values_status=$(awk 'NR==1 {print $2}' /tmp/production-smoke/values.headers)
          values_location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $2); print $2}' /tmp/production-smoke/values.headers | tail -1)
          [[ "$values_status" == '301' || "$values_status" == '308' ]]
          [[ "$values_location" == /kart-locacao* ]]

          curl -sS -f -H 'Cache-Control: no-cache' \
            "${base}/sitemap.xml?release=${RELEASE_SHA}" \
            -o /tmp/production-smoke/sitemap.xml
          grep -Fq 'https://kartodromodebetim.com.br/kart-locacao' /tmp/production-smoke/sitemap.xml

          curl -sS -f -H 'Cache-Control: no-cache' \
            "${base}/robots.txt?release=${RELEASE_SHA}" \
            -o /tmp/production-smoke/robots.txt
          grep -Fq 'Sitemap: https://kartodromodebetim.com.br/sitemap.xml' /tmp/production-smoke/robots.txt

      - name: Upload Cloudflare deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-evidence
          path: |
            /tmp/cloudflare-deploy.log
            /tmp/production-smoke
          if-no-files-found: ignore

      - name: Publish Cloudflare deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const succeeded = process.env.DEPLOY_OUTCOME === 'success'
              && process.env.SMOKE_OUTCOME === 'success';
            const deployOutcome = process.env.DEPLOY_OUTCOME || 'not-run';
            const smokeOutcome = process.env.SMOKE_OUTCOME || 'not-run';
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: succeeded ? 'success' : 'failure',
              context: 'cloudflare/deploy',
              description: succeeded
                ? 'Worker published and production smoke tests passed'
                : `Deploy ${deployOutcome}; smoke ${smokeOutcome}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
