name: Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify public site
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/npm-lock.log
          git diff --exit-code -- package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm start -- -p 4174 > /tmp/kartodromo-next.log 2>&1 &
          echo $! > /tmp/kartodromo-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kartodromo-next.log
          exit 1

      - name: Responsive and accessibility audit
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174
        run: |
          set -o pipefail
          npm run test:pre-delivery 2>&1 | tee /tmp/playwright.log

      - name: Build Cloudflare Worker
        run: npm run build:worker

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            /tmp/npm-lock.log
            /tmp/npm-ci.log
            /tmp/kartodromo-next.log
            /tmp/playwright.log
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      needs.verify.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'deploy/production-')
        )
      )
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy OpenNext Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://kartodromodebetim.com.br
        run: npm run deploy:worker

      - name: Publish Cloudflare deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const succeeded = process.env.DEPLOY_OUTCOME === 'success';
            const outcome = process.env.DEPLOY_OUTCOME || 'not-run';
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: succeeded ? 'success' : 'failure',
              context: 'cloudflare/deploy',
              description: succeeded
                ? 'Cloudflare Worker published successfully'
                : `Cloudflare Worker deployment failed (${outcome})`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
