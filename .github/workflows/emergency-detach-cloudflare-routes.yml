name: Recover previous Cloudflare DNS configuration

on:
  push:
    branches:
      - deploy/production-rollback-worker-routes-2026-07-20
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-kartodromo-dns-history
  cancel-in-progress: true

jobs:
  audit:
    name: Collect Cloudflare audit evidence
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'deploy/production-rollback-worker-routes-2026-07-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Collect zone and audit logs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cloudflare-audit
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          since='2026-07-20T15:00:00Z'
          before='2026-07-20T19:00:00Z'

          curl -sS -G "${api}/zones" \
            -H "$auth" -H 'Content-Type: application/json' \
            --data-urlencode 'name=kartodromodebetim.com.br' \
            --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -o /tmp/cloudflare-audit/zones.json \
            -w '%{http_code}\n' > /tmp/cloudflare-audit/zones.status

          zone_id=$(jq -r '.result[0].id // empty' /tmp/cloudflare-audit/zones.json 2>/dev/null || true)
          echo "$zone_id" > /tmp/cloudflare-audit/zone-id.txt

          curl -sS -G "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/audit_logs" \
            -H "$auth" -H 'Content-Type: application/json' \
            --data-urlencode "since=${since}" \
            --data-urlencode "before=${before}" \
            --data-urlencode 'per_page=1000' \
            --data-urlencode 'direction=desc' \
            -o /tmp/cloudflare-audit/audit-v1-all.json \
            -w '%{http_code}\n' > /tmp/cloudflare-audit/audit-v1-all.status

          if [[ -n "$zone_id" ]]; then
            curl -sS -G "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/audit_logs" \
              -H "$auth" -H 'Content-Type: application/json' \
              --data-urlencode "since=${since}" \
              --data-urlencode "before=${before}" \
              --data-urlencode "zone_id=${zone_id}" \
              --data-urlencode 'per_page=1000' \
              --data-urlencode 'direction=desc' \
              -o /tmp/cloudflare-audit/audit-v1-zone.json \
              -w '%{http_code}\n' > /tmp/cloudflare-audit/audit-v1-zone.status
          fi

          curl -sS -G "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/logs/audit" \
            -H "$auth" -H 'Content-Type: application/json' \
            --data-urlencode "since=${since}" \
            --data-urlencode "before=${before}" \
            --data-urlencode 'limit=1000' \
            -o /tmp/cloudflare-audit/audit-v2-all.json \
            -w '%{http_code}\n' > /tmp/cloudflare-audit/audit-v2-all.status

          if [[ -n "$zone_id" ]]; then
            curl -sS -G "${api}/zones/${zone_id}/dns_records" \
              -H "$auth" -H 'Content-Type: application/json' \
              --data-urlencode 'per_page=100' \
              -o /tmp/cloudflare-audit/dns-current.json \
              -w '%{http_code}\n' > /tmp/cloudflare-audit/dns-current.status

            curl -sS "${api}/zones/${zone_id}/workers/routes" \
              -H "$auth" -H 'Content-Type: application/json' \
              -o /tmp/cloudflare-audit/routes-current.json \
              -w '%{http_code}\n' > /tmp/cloudflare-audit/routes-current.status
          fi

          curl -sS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "$auth" -H 'Content-Type: application/json' \
            -o /tmp/cloudflare-audit/worker-domains-current.json \
            -w '%{http_code}\n' > /tmp/cloudflare-audit/worker-domains-current.status

          for file in /tmp/cloudflare-audit/audit-v1-all.json /tmp/cloudflare-audit/audit-v1-zone.json /tmp/cloudflare-audit/audit-v2-all.json; do
            [[ -f "$file" ]] || continue
            jq '.. | objects | select((.action.type? // .action? // .type? // "") | tostring | test("dns|record|worker|domain|route"; "i"))' "$file" > "${file%.json}-filtered.json" 2>/dev/null || true
          done

          echo 'HTTP statuses:'
          for status in /tmp/cloudflare-audit/*.status; do printf '%s: ' "$(basename "$status")"; cat "$status"; done

      - name: Upload Cloudflare audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dns-history-audit
          path: /tmp/cloudflare-audit
          if-no-files-found: error
