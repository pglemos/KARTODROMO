name: Recover previous Worker deployment

on:
  push:
    branches:
      - deploy/production-rollback-worker-routes-2026-07-20
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-kartodromo-worker-deployment
  cancel-in-progress: true

jobs:
  inspect:
    name: Collect Worker versions and deployments
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'deploy/production-rollback-worker-routes-2026-07-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Collect Worker deployment history
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/worker-history
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          script='kartodromo'

          curl -sS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/deployments" \
            -H "$auth" -H 'Content-Type: application/json' \
            -o /tmp/worker-history/deployments.json \
            -w '%{http_code}\n' > /tmp/worker-history/deployments.status

          curl -sS -G "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${script}/versions" \
            -H "$auth" -H 'Content-Type: application/json' \
            --data-urlencode 'per_page=100' \
            -o /tmp/worker-history/versions.json \
            -w '%{http_code}\n' > /tmp/worker-history/versions.status

          curl -sS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/settings" \
            -H "$auth" -H 'Content-Type: application/json' \
            -o /tmp/worker-history/settings.json \
            -w '%{http_code}\n' > /tmp/worker-history/settings.status

          curl -sS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "$auth" -H 'Content-Type: application/json' \
            -o /tmp/worker-history/domains.json \
            -w '%{http_code}\n' > /tmp/worker-history/domains.status

          curl -sS -G "${api}/zones" \
            -H "$auth" -H 'Content-Type: application/json' \
            --data-urlencode 'name=kartodromodebetim.com.br' \
            --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -o /tmp/worker-history/zones.json \
            -w '%{http_code}\n' > /tmp/worker-history/zones.status

          zone_id=$(jq -r '.result[0].id // empty' /tmp/worker-history/zones.json 2>/dev/null || true)
          if [[ -n "$zone_id" ]]; then
            curl -sS "${api}/zones/${zone_id}/workers/routes" \
              -H "$auth" -H 'Content-Type: application/json' \
              -o /tmp/worker-history/routes.json \
              -w '%{http_code}\n' > /tmp/worker-history/routes.status
            curl -sS -G "${api}/zones/${zone_id}/dns_records" \
              -H "$auth" -H 'Content-Type: application/json' \
              --data-urlencode 'per_page=100' \
              -o /tmp/worker-history/dns.json \
              -w '%{http_code}\n' > /tmp/worker-history/dns.status
          fi

          jq -r '.result[]? | [
            .created_on,
            .id,
            .source,
            ((.versions // []) | map(.version_id + ":" + (.percentage|tostring)) | join(",")),
            (.annotations["workers/message"] // ""),
            (.annotations["workers/triggered_by"] // "")
          ] | @tsv' /tmp/worker-history/deployments.json > /tmp/worker-history/deployments.tsv 2>/dev/null || true

          jq -r '.result[]? | [
            .created_on,
            .id,
            (.number|tostring),
            (.annotations["workers/message"] // ""),
            (.annotations["workers/triggered_by"] // "")
          ] | @tsv' /tmp/worker-history/versions.json > /tmp/worker-history/versions.tsv 2>/dev/null || true

          echo 'HTTP statuses:'
          for status in /tmp/worker-history/*.status; do printf '%s: ' "$(basename "$status")"; cat "$status"; done
          echo 'Deployments:'
          cat /tmp/worker-history/deployments.tsv || true

      - name: Upload Worker deployment history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-deployment-history
          path: /tmp/worker-history
          if-no-files-found: error
