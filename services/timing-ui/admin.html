<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastros e ferramentas · Cronometragem</title>
<style>
:root{--bg:#0e1210;--panel:#161c19;--line:#26302b;--text:#e9efe9;--muted:#8b978f;--green:#1db954;--blue:#4c9aff;--red:#e5484d;--yellow:#f5c518}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Segoe UI",sans-serif}header{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:#0b0f0d;position:sticky;top:0;z-index:5}header strong{font-size:16px}header a{color:var(--blue);text-decoration:none;font-weight:700}.spacer{flex:1}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 58px)}aside{padding:14px 10px;border-right:1px solid var(--line);background:#101512}.nav-group{margin:10px 8px 5px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.nav{display:block;width:100%;border:0;border-radius:7px;background:transparent;color:#cbd4ce;padding:8px 10px;text-align:left;font:600 13px system-ui;cursor:pointer}.nav:hover{background:#1a231e}.nav.active{background:#183022;color:#80e3a2;box-shadow:inset 3px 0 var(--green)}main{padding:24px;max-width:1500px;width:100%;margin:0 auto}.crumb{color:var(--muted);font-size:12px;margin-bottom:6px}h1{font-size:25px;line-height:1.2;margin:0 0 6px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}.intro{color:#aab5ae;max-width:850px;margin:0 0 20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea,.search{width:100%;background:#0e1411;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:14px system-ui;min-height:38px}.field input[type=checkbox]{width:18px;min-height:18px;accent-color:var(--green)}.check{display:flex;align-items:center;gap:8px;min-height:38px;color:#cbd4ce}.field small{display:block;color:var(--muted);margin-top:4px}.btn{border:0;border-radius:7px;padding:9px 13px;background:#29352f;color:var(--text);font:700 13px system-ui;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn.primary{background:var(--green);color:#04160a}.btn.blue{background:var(--blue);color:#021024}.btn.danger{background:#6c292d;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;padding:9px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid #202923;vertical-align:middle}td.actions{white-space:nowrap;text-align:right}.actions .btn{margin-left:5px;padding:6px 9px;font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.status{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:12px 0;color:#bfcac2}.status.ok{border-color:#225b37;background:#11251a;color:#82e0a0}.status.error{border-color:#663034;background:#2b1719;color:#ff9a9d}.status.warn{border-color:#685a1d;background:#28230e;color:#ffdc68}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.small{font-size:12px;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(680px,94vw);padding:20px}dialog::backdrop{background:#000a}dialog h2{color:var(--text);font-size:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.permission-row{display:grid;grid-template-columns:minmax(150px,1fr) repeat(4,82px);gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}.permission-row input{accent-color:var(--green)}.permission-head{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.hide{display:none!important}
@media(max-width:850px){.app{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:8px;position:sticky;top:58px;z-index:4}.nav-group{display:none}.nav{white-space:nowrap;width:auto;flex:0 0 auto}.nav.active{box-shadow:inset 0 -2px var(--green)}main{padding:18px 12px}.split{grid-template-columns:1fr}.permission-row{grid-template-columns:minmax(100px,1fr) repeat(4,52px);font-size:12px}}
</style>
</head>
<body>
<header><strong>Configuração da cronometragem</strong><span class="spacer"></span><a href="/">Voltar ao operador</a></header>
<div class="app"><aside id="navigation" aria-label="Módulos"></aside><main><div id="crumb" class="crumb"></div><h1 id="title"></h1><p id="intro" class="intro"></p><div id="content"></div></main></div>
<dialog id="recordDialog"><form id="recordForm" method="dialog"><h2 id="dialogTitle"></h2><div id="dialogFields" class="grid"></div><div class="dialog-actions"><button class="btn" type="button" onclick="recordDialog.close()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></dialog>
<dialog id="accessDialog"><form id="accessForm" method="dialog"><h2 id="accessTitle"></h2><div id="accessFields" class="grid"></div><div class="dialog-actions"><button class="btn" type="button" onclick="accessDialog.close()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></dialog>
<input id="importFile" type="file" accept="application/json,.json" class="hide">
<script>
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='categories', catalog={events:[],groups:[],provas:[],categories:[],tracks:[],competitors:[]}, settings={}, editing=null, editingCollection='';
const navGroups=[['Cronometragem',[['live','Cronometragem ao vivo']]],['Cadastros',[['events','Evento'],['categories','Categoria'],['competitors','Competidor'],['provas','Corridas (prova)'],['decoder','Decoder'],['company','Empresa'],['groups','Grupo'],['scoreboard','Placar'],['tracks','Traçado'],['transponders','Transponder (De/Para)'],['competitor-transponders','Transponder × Competidor']]],['Ferramentas',[['backups','Backup de eventos'],['timing-settings','Parâmetros da cronometragem'],['system-settings','Parâmetros do sistema']]],['Início',[['initial','Configurações iniciais'],['profiles','Perfil de acesso'],['permissions','Permissões de acesso'],['users','Usuário']]]];
const titles={live:'Cronometragem ao vivo',events:'Evento',categories:'Categoria',competitors:'Competidor',provas:'Corridas (prova)',decoder:'Decoder',company:'Empresa',groups:'Grupo',scoreboard:'Placar',tracks:'Traçado',transponders:'Transponder (De/Para)','competitor-transponders':'Transponder × Competidor',backups:'Backup de eventos','timing-settings':'Parâmetros da cronometragem','system-settings':'Parâmetros do sistema',initial:'Configurações iniciais',profiles:'Perfil de acesso',permissions:'Permissões de acesso',users:'Usuário'};
const descriptions={live:'Acompanhe a prova, altere seus parâmetros, registre passagem manual e consulte os resultados por visão.',events:'Cadastre eventos e associe o traçado. Depois, organize grupos e provas para montar baterias no operador.',categories:'Cadastre e mantenha as categorias usadas em grupos e competidores.',competitors:'Mantenha a base de competidores e seus vínculos com kart, categoria e transponder.',provas:'Defina provas, duração, limite de voltas e distribuição das baterias.',decoder:'Configure e teste a conexão com o decoder antes de aplicar uma alteração.',company:'Dados da empresa exibidos nos documentos e na identificação local.',groups:'Organize grupos por evento e categoria.',scoreboard:'Configure a saída e os dados enviados ao placar.',tracks:'Cadastre o traçado e sua extensão para calcular velocidade média.',transponders:'Vincule o código lido pelo decoder ao número do kart.', 'competitor-transponders':'Vincule diretamente cada transponder ao competidor e ao kart correspondente.',backups:'Crie cópias dos eventos, exporte para arquivo e restaure cópias anteriores.', 'timing-settings':'Configure a volta mínima e os valores iniciais das baterias.', 'system-settings':'Defina os parâmetros gerais usados pela cronometragem.',initial:'Configure a empresa, o traçado e os parâmetros essenciais para iniciar o sistema.',profiles:'Crie perfis locais de acesso para separar as funções de cada operador.',permissions:'Defina as ações permitidas em cada módulo por perfil.',users:'Mantenha os usuários locais e seus perfis de acesso.'};
const entityFields={
 categories:[{key:'name',label:'Nome',required:true},{key:'color',label:'Cor',type:'color',default:'#1db954'}],
 competitors:[{key:'name',label:'Nome do competidor',required:true},{key:'kart',label:'Número do kart',required:true},{key:'transponder',label:'Transponder',type:'number'},{key:'categoryId',label:'Categoria',type:'select',options:()=>catalog.categories.map(x=>[x.id,x.name])},{key:'weightKg',label:'Peso (kg)',type:'number',min:'1',step:'0.1'},{key:'active',label:'Ativo',type:'checkbox',default:true}],
 events:[{key:'name',label:'Nome do evento',required:true},{key:'date',label:'Data',type:'date'},{key:'venue',label:'Local'},{key:'trackId',label:'Traçado',type:'select',options:()=>[['','— selecione —'],...catalog.tracks.map(x=>[x.id,x.name])]},{key:'active',label:'Ativo',type:'checkbox',default:true}],
 groups:[{key:'name',label:'Nome do grupo',required:true},{key:'eventId',label:'Evento',type:'select',required:true,options:()=>catalog.events.map(x=>[x.id,x.name])},{key:'categoryId',label:'Categoria',type:'select',options:()=>[['','Todas'],...catalog.categories.map(x=>[x.id,x.name])]},{key:'order',label:'Ordem',type:'number',min:'1',step:'1'}],
 provas:[{key:'name',label:'Nome da prova',required:true},{key:'groupId',label:'Grupo',type:'select',required:true,options:()=>catalog.groups.map(x=>[x.id,`${catalog.events.find(e=>e.id===x.eventId)?.name||'Evento'} · ${x.name}`])},{key:'type',label:'Tipo',type:'select',options:()=>[['treino','Treino'],['classificacao','Tomada de tempo'],['corrida','Corrida']],default:'treino'},{key:'durationMin',label:'Duração (min)',type:'number',min:'0',step:'1',default:10},{key:'maxLaps',label:'Limite de voltas',type:'number',min:'0',step:'1'},{key:'heats',label:'Número de baterias',type:'number',min:'1',step:'1',default:1},{key:'startAt',label:'Horário inicial',type:'time'},{key:'intervalMin',label:'Intervalo (min)',type:'number',min:'0',step:'1',default:0}],
 tracks:[{key:'name',label:'Nome do traçado',required:true},{key:'lengthMeters',label:'Extensão (metros)',type:'number',min:'1',step:'0.1',required:true}]
};
const accessModules=['Cronometragem','Eventos','Cadastros','Ferramentas','Relatórios','Segurança','Placar'];
async function api(path,options={}){const response=await fetch(path,{headers:{'content-type':'application/json'},...options,body:options.body===undefined?undefined:JSON.stringify(options.body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Falha HTTP ${response.status}`);return data}
function notify(message,type='ok'){const area=$('notice');if(!area)return;area.className=`status ${type}`;area.textContent=message;area.classList.remove('hide');setTimeout(()=>area.classList.add('hide'),5000)}
function renderNav(){const root=$('navigation');root.innerHTML=navGroups.map(([group,items])=>`<div class="nav-group">${group}</div>${items.map(([id,label])=>`<button class="nav ${current===id?'active':''}" data-view="${id}">${label}</button>`).join('')}`).join('');root.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>go(button.dataset.view)))}
function go(id){current=id;history.replaceState(null,'',`#${id}`);renderNav();renderPage()}
async function refreshData(){[catalog,settings]=await Promise.all([api('/api/catalog'),api('/api/settings')]);catalog.competitors??=[]}
function renderPage(){ $('crumb').textContent=navGroups.find(([,items])=>items.some(([id])=>id===current))?.[0]||'';$('title').textContent=titles[current]||current;$('intro').textContent=descriptions[current]||'';const root=$('content');root.innerHTML='<div id="notice" class="status hide"></div>';if(entityFields[current])void renderEntity(current);else if(current==='decoder')renderSettingsForm('decoder');else if(current==='company')renderSettingsForm('company');else if(current==='scoreboard')renderSettingsForm('scoreboard');else if(current==='timing-settings')renderSettingsForm('timing');else if(current==='system-settings')renderSettingsForm('system');else if(current==='initial')renderInitial();else if(current==='backups')void renderBackups();else if(current==='transponders')void renderTransponders();else if(current==='competitor-transponders')void renderCompetitorTransponders();else if(current==='profiles'||current==='users')renderAccessList(current);else if(current==='permissions')renderPermissions();else if(current==='live')location.href='/';}
function fieldHtml(field,value){const type=field.type||'text';if(type==='checkbox')return `<div class="field"><label class="check"><input type="checkbox" data-key="${field.key}" ${(value??field.default)?'checked':''}> ${esc(field.label)}</label></div>`;if(type==='select'){const options=typeof field.options==='function'?field.options():field.options||[];return `<div class="field"><label>${esc(field.label)}${field.required?' *':''}</label><select data-key="${field.key}" ${field.required?'required':''}>${options.map(([id,label])=>`<option value="${esc(id)}" ${String(value??field.default??'')===String(id)?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`}return `<div class="field"><label>${esc(field.label)}${field.required?' *':''}</label><input data-key="${field.key}" type="${type}" value="${esc(value??field.default??'')}" ${field.required?'required':''} ${field.min?`min="${field.min}"`:''} ${field.step?`step="${field.step}"`:''}></div>`}
function collectFields(root,schema){const values={};for(const field of schema){const control=root.querySelector(`[data-key="${field.key}"]`);values[field.key]=field.type==='checkbox'?control.checked:field.type==='number'?(control.value===''?'':Number(control.value)):control.value}return values}
async function renderEntity(entity){await refreshData();const rows=catalog[entity]||[];const schema=entityFields[entity];$('content').insertAdjacentHTML('beforeend',`<div class="toolbar"><button class="btn primary" id="newRecord">＋ Novo cadastro</button><input class="search" id="search" placeholder="Buscar ${esc(titles[entity].toLowerCase())}" style="max-width:300px"></div><section class="panel"><div class="table-wrap"><table><thead><tr>${schema.map(field=>`<th>${esc(field.label)}</th>`).join('')}<th></th></tr></thead><tbody id="records"></tbody></table></div><div id="empty" class="empty hide">Nenhum cadastro encontrado.</div></section>`);const renderRows=()=>{const query=$('search').value.trim().toLowerCase();const shown=(catalog[entity]||[]).filter(item=>JSON.stringify(item).toLowerCase().includes(query));$('records').innerHTML=shown.map(item=>`<tr>${schema.map(field=>`<td>${field.type==='checkbox'?(item[field.key]===false?'Não':'Sim'):field.type==='select'?esc((field.options().find(([id])=>id===item[field.key])||[])[1]||'—'):field.type==='color'?`<span style="display:inline-block;width:18px;height:18px;border-radius:4px;background:${esc(item[field.key]||'#777')};vertical-align:middle"></span> ${esc(item[field.key]||'')}`:esc(item[field.key]??'—')}</td>`).join('')}<td class="actions">${entity==='events'?`<button class="btn" data-duplicate="${esc(item.id)}">Duplicar</button>`:''}<button class="btn" data-edit="${esc(item.id)}">Editar</button><button class="btn danger" data-delete="${esc(item.id)}">Excluir</button></td></tr>`).join('');$('empty').classList.toggle('hide',shown.length>0)};renderRows();$('search').addEventListener('input',renderRows);$('newRecord').onclick=()=>openRecord(entity,null);$('records').addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;const item=(catalog[entity]||[]).find(x=>x.id===button.dataset.edit||x.id===button.dataset.delete||x.id===button.dataset.duplicate);if(button.dataset.edit)openRecord(entity,item);if(button.dataset.delete&&confirm(`Excluir ${titles[entity].toLowerCase()}${item?.name?` “${item.name}”`:''}?`)){try{await api(`/api/catalog/${entity}/${encodeURIComponent(item.id)}`,{method:'DELETE'});await refreshData();renderPage()}catch(error){notify(error.message,'error')}}if(button.dataset.duplicate){try{await api(`/api/catalog/events/${encodeURIComponent(item.id)}/duplicate`,{method:'POST',body:{}});await refreshData();renderPage();notify('Evento duplicado com seus grupos e provas.')}catch(error){notify(error.message,'error')}}})}
function openRecord(entity,item){editing=item;editingCollection=entity;const schema=entityFields[entity];$('dialogTitle').textContent=`${item?'Editar':'Novo'} · ${titles[entity]}`;$('dialogFields').innerHTML=schema.map(field=>fieldHtml(field,item?.[field.key])).join('');$('recordDialog').showModal()}
$('recordForm').addEventListener('submit',async event=>{event.preventDefault();const values=collectFields($('dialogFields'),entityFields[editingCollection]);try{let saved;if(editing)saved=await api(`/api/catalog/${editingCollection}/${encodeURIComponent(editing.id)}`,{method:'PATCH',body:values});else saved=await api(`/api/catalog/${editingCollection}`,{method:'POST',body:values});if(editingCollection==='competitors'){const oldTransponder=editing?.transponder;if(oldTransponder&&oldTransponder!==saved.transponder)await api('/api/transponders',{method:'PUT',body:{raw:oldTransponder,kart:''}});if(saved.transponder)await api('/api/transponders',{method:'PUT',body:{raw:saved.transponder,kart:saved.kart}})}$('recordDialog').close();await refreshData();renderPage();notify('Cadastro salvo.')}catch(error){notify(error.message,'error')}});
const settingsSchemas={
 company:[{key:'name',label:'Razão social',required:true},{key:'document',label:'CNPJ'},{key:'phone',label:'Telefone'},{key:'email',label:'E-mail'},{key:'address',label:'Endereço'}],
 decoder:[{key:'name',label:'Nome',default:'Tranx3'},{key:'model',label:'Modelo',default:'TranX'},{key:'protocol',label:'Protocolo',type:'select',options:[['p3','P3 / Orbits (5403)'],['trx','TRX (5100)']]},{key:'host',label:'Endereço IP',required:true},{key:'port',label:'Porta',type:'number',min:'1',max:'65535',required:true}],
 scoreboard:[{key:'enabled',label:'Habilitar placar',type:'checkbox',default:false},{key:'mode',label:'Saída',type:'select',options:[['hdmi','Tela/HDMI'],['tcp','TCP'],['serial','Serial']]},{key:'host',label:'Endereço IP'},{key:'port',label:'Porta',type:'number',min:'1',max:'65535'},{key:'rows',label:'Linhas exibidas',type:'number',min:'1',max:'100',default:10}],
 timing:[{key:'minimumLapSeconds',label:'Volta mínima (segundos)',type:'number',min:'0.1',max:'60',step:'0.1',default:5},{key:'defaultDurationMin',label:'Duração padrão (minutos)',type:'number',min:'0',step:'1',default:10},{key:'defaultRaceDurationMin',label:'Duração padrão da corrida (minutos)',type:'number',min:'0',step:'1',default:20}],
 system:[{key:'defaultTrackLengthMeters',label:'Extensão padrão do traçado (m)',type:'number',min:'1',step:'0.1',default:1000},{key:'timezone',label:'Fuso horário',default:'America/Sao_Paulo'},{key:'language',label:'Idioma',type:'select',options:[['pt-BR','Português (Brasil)']],default:'pt-BR'}]
};
function renderSettingsForm(section){const schema=settingsSchemas[section],values=section==='decoder'?settings.decoder||{}:settings[section]||{};const root=$('content');root.insertAdjacentHTML('beforeend',`<section class="panel"><form id="settingsForm"><div class="grid">${schema.map(field=>fieldHtml(field,values[field.key])).join('')}</div><div class="toolbar">${section==='decoder'?'<button class="btn" type="button" id="testDecoder">Testar conexão</button>':''}<button class="btn primary" type="submit">Salvar configurações</button></div></form><div id="formStatus" class="status hide"></div></section>`);$('settingsForm').addEventListener('submit',async event=>{event.preventDefault();const value=collectFields($('settingsForm'),schema);try{if(section==='decoder'){await api('/api/settings/decoder',{method:'PATCH',body:value});settings.decoder=value}else{settings[section]=value;await api('/api/settings',{method:'PATCH',body:{[section]:value}})}$('formStatus').className='status ok';$('formStatus').textContent=section==='decoder'?'Configuração aplicada e decoder reconectando.':'Configurações salvas.';$('formStatus').classList.remove('hide')}catch(error){$('formStatus').className='status error';$('formStatus').textContent=error.message;$('formStatus').classList.remove('hide')}});if(section==='decoder')$('testDecoder').onclick=async()=>{const value=collectFields($('settingsForm'),schema);const status=$('formStatus');status.className='status';status.textContent='Testando conexão TCP...';status.classList.remove('hide');try{const result=await api('/api/settings/decoder/test',{method:'POST',body:value});status.className='status ok';status.textContent=`Conexão aberta em ${result.host}:${result.port} (${result.protocol.toUpperCase()}).`}catch(error){status.className='status error';status.textContent=error.message}}}
function renderInitial(){const company=settings.company||{},system=settings.system||{},timing=settings.timing||{};const decoder=settings.decoder||{name:'Tranx3',model:'TranX',protocol:'p3',host:'192.168.20.171',port:5403};$('content').insertAdjacentHTML('beforeend',`<section class="panel"><h2>1 · Empresa e pista</h2><form id="initialForm"><div class="grid"><div class="field"><label>Razão social</label><input name="companyName" required value="${esc(company.name||'')}"></div><div class="field"><label>CNPJ</label><input name="document" value="${esc(company.document||'')}"></div><div class="field"><label>Traçado</label><input name="trackName" value="${esc(catalog.tracks[0]?.name||'')}"></div><div class="field"><label>Extensão do traçado (m)</label><input name="trackLength" type="number" min="1" value="${esc(system.defaultTrackLengthMeters||catalog.tracks[0]?.lengthMeters||1110)}"></div><div class="field"><label>Volta mínima (s)</label><input name="minimumLapSeconds" type="number" min="0.1" max="60" step="0.1" value="${esc(timing.minimumLapSeconds||5)}"></div><div class="field"><label>Duração padrão (min)</label><input name="defaultDurationMin" type="number" min="0" value="${esc(timing.defaultDurationMin||10)}"></div><div class="field"><label>Decoder</label><input name="decoderName" value="${esc(decoder.name||'Tranx3')}"></div><div class="field"><label>Modelo</label><input name="decoderModel" value="${esc(decoder.model||'TranX')}"></div><div class="field"><label>Protocolo</label><select name="decoderProtocol"><option value="p3" ${decoder.protocol==='p3'?'selected':''}>P3 / Orbits</option><option value="trx" ${decoder.protocol==='trx'?'selected':''}>TRX</option></select></div><div class="field"><label>Endereço do decoder</label><input name="decoderHost" required value="${esc(decoder.host||'')}"></div><div class="field"><label>Porta</label><input name="decoderPort" type="number" min="1" max="65535" required value="${esc(decoder.port||5403)}"></div></div><div class="toolbar"><button class="btn primary" type="submit">Salvar configuração inicial</button></div></form><p class="small">A configuração do decoder só é aplicada quando a bateria está encerrada e a conexão responde ao teste TCP.</p></section>`);$('initialForm').onsubmit=async event=>{
  event.preventDefault();
  const f=new FormData(event.currentTarget),length=Number(f.get('trackLength')),name=String(f.get('trackName')||'Traçado principal').trim();
  const decoder={name:String(f.get('decoderName')||'').trim(),model:String(f.get('decoderModel')||'').trim(),protocol:String(f.get('decoderProtocol')),host:String(f.get('decoderHost')||'').trim(),port:Number(f.get('decoderPort'))};
  const currentDecoder=settings.decoder||{};
  const decoderChanged=['name','model','protocol','host','port'].some(key=>String(decoder[key]??'')!==String(currentDecoder[key]??''));
  try{
    if(decoderChanged){await api('/api/settings/decoder/test',{method:'POST',body:decoder});await api('/api/settings/decoder',{method:'PATCH',body:decoder});}
    await api('/api/settings',{method:'PATCH',body:{company:{name:String(f.get('companyName')).trim(),document:String(f.get('document')||'')},system:{...(settings.system||{}),defaultTrackLengthMeters:length,timezone:'America/Sao_Paulo',language:'pt-BR'},timing:{...(settings.timing||{}),minimumLapSeconds:Number(f.get('minimumLapSeconds')),defaultDurationMin:Number(f.get('defaultDurationMin'))}}});
    if(!catalog.tracks.length)await api('/api/catalog/tracks',{method:'POST',body:{name,lengthMeters:length}});else if(catalog.tracks[0].name!==name||catalog.tracks[0].lengthMeters!==length)await api('/api/catalog/tracks/'+catalog.tracks[0].id,{method:'PATCH',body:{name,lengthMeters:length}});
    await refreshData();notify('Configuração inicial salva.');
  }catch(error){notify(error.message,'error')}
}
}
async function renderBackups(){const root=$('content');root.insertAdjacentHTML('beforeend',`<section class="panel"><h2>Cópias de eventos</h2><div class="toolbar"><button class="btn primary" id="createBackup">Criar cópia</button><button class="btn" id="exportCatalog">Exportar JSON</button><button class="btn" id="chooseImport">Importar JSON</button><button class="btn" id="reloadBackups">Atualizar lista</button></div><div class="small">A cópia inclui eventos, grupos, provas, categorias, traçados e competidores. Restaurar substitui estes cadastros; não altera baterias em andamento.</div><div id="backupList" class="table-wrap" style="margin-top:12px"></div></section>`);const load=async()=>{const rows=await api('/api/catalog/backups');$('backupList').innerHTML=rows.length?`<table><thead><tr><th>Criada em</th><th>Identificador</th><th></th></tr></thead><tbody>${rows.map(row=>`<tr><td>${row.createdAt?new Date(row.createdAt).toLocaleString('pt-BR'):'—'}</td><td>${esc(row.id)}</td><td class="actions"><button class="btn blue" data-restore="${esc(row.id)}">Restaurar</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhuma cópia de eventos disponível.</div>'};await load();$('createBackup').onclick=async()=>{try{await api('/api/catalog/backups',{method:'POST',body:{}});await load();notify('Cópia de eventos criada.')}catch(error){notify(error.message,'error')}};$('exportCatalog').onclick=()=>location.href='/api/catalog/export';$('chooseImport').onclick=()=>$('importFile').click();$('reloadBackups').onclick=()=>void load();$('backupList').onclick=async event=>{const button=event.target.closest('[data-restore]');if(!button||!confirm('Restaurar esta cópia e substituir os cadastros atuais?'))return;try{await api(`/api/catalog/backups/${encodeURIComponent(button.dataset.restore)}/restore`,{method:'POST',body:{}});await refreshData();await load();notify('Cópia restaurada.')}catch(error){notify(error.message,'error')}}}
$('importFile').onchange=async()=>{const file=$('importFile').files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!confirm('Importar os cadastros deste arquivo? Esta ação substitui os cadastros atuais.'))return;await api('/api/catalog/import',{method:'POST',body:data});await refreshData();notify('Cadastros importados.')}catch(error){notify(`Arquivo não importado: ${error.message}`,'error')}finally{$('importFile').value=''}};
async function renderTransponders(){await refreshData();const mappings=await api('/api/transponders');$('content').insertAdjacentHTML('beforeend',`<section class="panel"><form id="mappingForm"><div class="grid"><div class="field"><label>Número do transponder</label><input name="raw" required inputmode="numeric"></div><div class="field"><label>Número do kart</label><input name="kart" required></div></div><div class="toolbar"><button class="btn primary">Salvar vínculo</button></div></form></section><section class="panel"><div class="table-wrap" id="mappingList"></div></section>`);const draw=()=>{$('mappingList').innerHTML=Object.entries(mappings).length?`<table><thead><tr><th>Transponder</th><th>Kart</th><th></th></tr></thead><tbody>${Object.entries(mappings).map(([raw,kart])=>`<tr><td>${esc(raw)}</td><td>${esc(kart)}</td><td class="actions"><button class="btn danger" data-remove="${esc(raw)}">Desvincular</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum vínculo manual cadastrado.</div>'};draw();$('mappingForm').onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));if(!/^\d+$/.test(data.raw)){notify('O transponder deve conter apenas números.','error');return}try{await api('/api/transponders',{method:'PUT',body:data});mappings[data.raw]=data.kart;draw();event.currentTarget.reset();notify('Vínculo de transponder salvo.')}catch(error){notify(error.message,'error')}};$('mappingList').onclick=async event=>{const button=event.target.closest('[data-remove]');if(!button||!confirm('Desvincular este transponder?'))return;const raw=button.dataset.remove;try{await api('/api/transponders',{method:'PUT',body:{raw,kart:''}});delete mappings[raw];draw();notify('Vínculo removido.')}catch(error){notify(error.message,'error')}}}
async function renderCompetitorTransponders(){await refreshData();const rows=catalog.competitors||[];$('content').insertAdjacentHTML('beforeend',`<section class="panel"><h2>Vínculo de transponder por competidor</h2><div class="grid"><div class="field"><label>Competidor</label><select id="mapCompetitor"><option value="">Selecione</option>${rows.map(item=>`<option value="${esc(item.id)}">${esc(item.name)} · Kart ${esc(item.kart)}</option>`).join('')}</select></div><div class="field"><label>Transponder</label><input id="competitorTransponder" inputmode="numeric"></div></div><div class="toolbar"><button class="btn primary" id="saveCompetitorMap">Salvar vínculo</button></div><p class="small">O vínculo também atualiza o mapa usado para associar a leitura do decoder ao kart.</p></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>Competidor</th><th>Kart</th><th>Categoria</th><th>Transponder</th><th></th></tr></thead><tbody>${rows.map(item=>`<tr><td>${esc(item.name)}</td><td>${esc(item.kart)}</td><td>${esc(catalog.categories.find(x=>x.id===item.categoryId)?.name||'—')}</td><td>${esc(item.transponder||'—')}</td><td class="actions"><button class="btn" data-map="${esc(item.id)}">Editar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Cadastre competidores primeiro.</td></tr>'}</tbody></table></div></section>`);$('content').onclick=event=>{const button=event.target.closest('[data-map]');if(!button)return;const item=rows.find(x=>x.id===button.dataset.map);$('mapCompetitor').value=item.id;$('competitorTransponder').value=item.transponder||''};$('saveCompetitorMap').onclick=async()=>{const item=rows.find(x=>x.id===$('mapCompetitor').value),transponder=$('competitorTransponder').value.trim();if(!item){notify('Selecione um competidor.','error');return}if(transponder&&!/^\d+$/.test(transponder)){notify('O transponder deve conter apenas números.','error');return}try{if(item.transponder&&item.transponder!==transponder)await api('/api/transponders',{method:'PUT',body:{raw:item.transponder,kart:''}});const saved=await api(`/api/catalog/competitors/${encodeURIComponent(item.id)}`,{method:'PATCH',body:{transponder}});if(saved.transponder)await api('/api/transponders',{method:'PUT',body:{raw:saved.transponder,kart:saved.kart}});await refreshData();renderPage();notify('Transponder associado ao competidor.')}catch(error){notify(error.message,'error')}}}
function renderAccessList(kind){const collection=kind==='profiles'?'accessProfiles':'accessUsers',rows=Array.isArray(settings[collection])?settings[collection]:[];const profiles=Array.isArray(settings.accessProfiles)?settings.accessProfiles:[];const schema=kind==='profiles'?[{key:'name',label:'Nome do perfil',required:true},{key:'description',label:'Descrição'}]:[{key:'name',label:'Nome do usuário',required:true},{key:'login',label:'Login',required:true},{key:'profileId',label:'Perfil',type:'select',required:true,options:()=>profiles.map(x=>[x.id,x.name])},{key:'active',label:'Ativo',type:'checkbox',default:true}];$('content').insertAdjacentHTML('beforeend',`<section class="panel"><div class="toolbar"><button class="btn primary" id="newAccess">＋ Novo ${kind==='profiles'?'perfil':'usuário'}</button></div><div class="table-wrap"><table><thead><tr>${schema.map(x=>`<th>${esc(x.label)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(item=>`<tr>${schema.map(field=>`<td>${field.type==='checkbox'?(item[field.key]===false?'Não':'Sim'):field.type==='select'?esc((profiles.find(x=>x.id===item[field.key])||{}).name||'—'):esc(item[field.key]||'—')}</td>`).join('')}<td class="actions"><button class="btn" data-edit-access="${esc(item.id)}">Editar</button><button class="btn danger" data-delete-access="${esc(item.id)}">Excluir</button></td></tr>`).join('')||`<tr><td class="empty" colspan="${schema.length+1}">Nenhum ${kind==='profiles'?'perfil':'usuário'} cadastrado.</td></tr>`}</tbody></table></div></section><div class="status warn">Os registros de usuário e perfil são locais ao serviço de cronometragem. A autenticação do operador precisa ser ativada no ambiente para que esta lista restrinja ações.</div>`);$('newAccess').onclick=()=>openAccess(kind,collection,schema,null);$('content').onclick=event=>{const button=event.target.closest('[data-edit-access],[data-delete-access]');if(!button)return;const item=rows.find(x=>x.id===button.dataset.editAccess||x.id===button.dataset.deleteAccess);if(button.dataset.editAccess)openAccess(kind,collection,schema,item);if(button.dataset.deleteAccess&&confirm(`Excluir ${kind==='profiles'?'perfil':'usuário'}?`)){settings[collection]=rows.filter(x=>x.id!==item.id);void saveSettings({[collection]:settings[collection]},'Registro excluído.')}}}
function openAccess(kind,collection,schema,item){editing={kind,collection,schema,item};$('accessTitle').textContent=`${item?'Editar':'Novo'} · ${kind==='profiles'?'Perfil':'Usuário'}`;$('accessFields').innerHTML=schema.map(field=>fieldHtml(field,item?.[field.key])).join('');$('accessDialog').showModal()}
$('accessForm').addEventListener('submit',async event=>{event.preventDefault();const {collection,schema,item}=editing;const value=collectFields($('accessFields'),schema);const rows=Array.isArray(settings[collection])?settings[collection]:[];if(item)settings[collection]=rows.map(row=>row.id===item.id?{...row,...value}:row);else settings[collection]=[...rows,{id:crypto.randomUUID(),...value}];try{await api('/api/settings',{method:'PATCH',body:{[collection]:settings[collection]}});$('accessDialog').close();renderPage();notify('Registro salvo.')}catch(error){notify(error.message,'error')}});
function renderPermissions(){const profiles=Array.isArray(settings.accessProfiles)?settings.accessProfiles:[];const rows=Array.isArray(settings.accessPermissions)?settings.accessPermissions:[];$('content').insertAdjacentHTML('beforeend',`<section class="panel"><div class="field" style="max-width:420px"><label>Perfil</label><select id="permissionProfile"><option value="">Selecione</option>${profiles.map(item=>`<option value="${esc(item.id)}">${esc(item.name)}</option>`).join('')}</select></div><div id="permissionMatrix" style="margin-top:14px"></div><div class="toolbar"><button class="btn primary" id="savePermissions">Salvar permissões</button></div></section>${profiles.length?'':'<div class="status warn">Cadastre um perfil antes de definir permissões.</div>'}`);const draw=()=>{const id=$('permissionProfile').value,items=rows.filter(row=>row.profileId===id);$('permissionMatrix').innerHTML=id?`<div class="permission-row permission-head"><span>Módulo</span><span>Visualizar</span><span>Criar</span><span>Editar</span><span>Excluir</span></div>${accessModules.map(module=>{const permission=items.find(row=>row.module===module)||{};return `<div class="permission-row"><strong>${esc(module)}</strong>${['view','create','edit','delete'].map(action=>`<label><input type="checkbox" data-module="${esc(module)}" data-action="${action}" ${permission[action]?'checked':''} aria-label="${esc(module)} ${action}"></label>`).join('')}</div>`}).join('')}`:'<div class="empty">Selecione um perfil.</div>'};$('permissionProfile').onchange=draw;draw();$('savePermissions').onclick=async()=>{const id=$('permissionProfile').value;if(!id){notify('Selecione um perfil.','error');return}const next=rows.filter(row=>row.profileId!==id);const controls=[...$('permissionMatrix').querySelectorAll('input[data-action]')];for(const module of accessModules){const entry={profileId:id,module};for(const action of ['view','create','edit','delete'])entry[action]=controls.some(control=>control.dataset.module===module&&control.dataset.action===action&&control.checked);next.push(entry)}settings.accessPermissions=next;await saveSettings({accessPermissions:next},'Permissões salvas.')}}
async function saveSettings(patch,message){try{await api('/api/settings',{method:'PATCH',body:patch});await refreshData();renderPage();notify(message)}catch(error){notify(error.message,'error')}}
async function boot(){try{await refreshData();current=location.hash.slice(1)||'categories';if(!titles[current])current='categories';renderNav();renderPage()}catch(error){$('content').innerHTML=`<div class="status error">Não foi possível carregar os dados: ${esc(error.message)}</div>`}}
boot();
</script>
