<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equalização dos karts</title>
<!-- cores dos tokens (tema claro); o valor depois da vírgula é a reserva se o tokens.css não carregar -->
<link rel="stylesheet" href="/tokens.css">
<style>
  :root {
    --page-bg: var(--kib-cor-fundo-app, #F5F5F7); --surface: var(--kib-cor-superficie-padrao, #FFFFFF); --ink: var(--kib-cor-texto-principal, #1D1D1F); --muted: var(--kib-cor-texto-secundario, #6E6E73); --line: var(--kib-cor-borda-forte, #C7C7CC); --line-strong: var(--kib-cor-texto-terciario, #76767B);
    --accent: var(--kib-cor-acao-principal, #0B7A53); --accent-strong: var(--kib-cor-acao-principal-pressionado, #0A5E40); --accent-soft: var(--kib-cor-estado-sucesso-fundo, #E8F5EE);
    --ok: var(--kib-cor-estado-sucesso-texto, #1C6B35); --ok-soft: var(--kib-cor-estado-sucesso-fundo, #E8F5EE); --warn: var(--kib-cor-estado-aviso-texto, #9A5B00); --warn-soft: var(--kib-cor-estado-aviso-fundo, #FFF4E0); --bad: var(--kib-cor-estado-perigo-texto, #C4281C); --bad-soft: var(--kib-cor-estado-perigo-fundo, #FDECEA); --ref: var(--kib-cor-estado-info-texto, #0A4FA0); --ref-soft: var(--kib-cor-estado-info-fundo, #E1EEFF);
  }
  * { box-sizing: border-box; }
  html { min-width: 320px; }
  body { margin: 0; background: var(--page-bg); color: var(--ink); font: 14px/1.45 var(--kib-fonte-familia-interface, "Segoe UI"), system-ui, sans-serif; }
  [hidden] { display: none !important; }
  .tools { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 58px; padding: 10px clamp(16px, 3vw, 32px); background: #070a08; border-bottom: 1px solid #27352c; color: #f3faf5; }
  .tools a, .tools button, .tools select { min-height: 38px; padding: 8px 13px; border: 1px solid #526157; border-radius: 8px; background: #1d2821; color: #f6fbf7; font: inherit; font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .tools button.primary { background: var(--accent); border-color: var(--accent); }
  .tools .right { margin-left: auto; color: #b6c5bb; font-size: 12px; font-weight: 650; }
  .sheet-page { width: min(calc(100% - 32px), 1380px); margin: 28px auto 48px; padding: clamp(20px, 3vw, 40px); border: 1px solid #d7e0d9; border-radius: 3px; background: var(--surface); box-shadow: 0 12px 28px rgba(28, 47, 34, .14); }
  .rep-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 24px; }
  .rep-logo { display: block; max-width: 160px; max-height: 64px; }
  .rep-kicker { color: var(--accent-strong); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 2px 0 4px; font-size: clamp(22px, 2.4vw, 30px); letter-spacing: -.02em; line-height: 1.08; }
  .sub2 { font-weight: 500; }
  .sub3 { margin-top: 2px; color: var(--muted); font-size: 13px; }
  .rep-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; gap: 4px; padding: 4px 10px; border: 1px solid #b9dcc6; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 12px; white-space: nowrap; }
  .divider { height: 2px; margin: 16px 0 16px; background: var(--accent); }
  .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 22px; margin-bottom: 18px; }
  .resumo div span { display: block; color: var(--accent-strong); font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
  .resumo div b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .resumo div small { display: block; color: var(--muted); font-size: 12px; }
  h2 { margin: 22px 0 8px; color: var(--accent-strong); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { background: #f1f5f2; border-bottom: 1.5px solid var(--ink); color: #33433a; font-size: 11px; font-weight: 750; letter-spacing: .03em; text-transform: uppercase; vertical-align: bottom; white-space: nowrap; }
  tbody tr:nth-child(even) td { background: #f7faf8; }
  .num { text-align: right; white-space: nowrap; }
  .c { text-align: center; }
  .kart { display: inline-block; min-width: 2.7em; padding: 0 4px; border: 1px solid var(--line-strong); border-radius: 4px; background: #fff; font-weight: 700; text-align: center; }
  .bloco { white-space: nowrap; }
  .bloco small { display: block; color: var(--muted); font-size: 10.5px; }
  .bloco.anterior { color: var(--muted); }
  .bloco.dentro { background: var(--ok-soft) !important; color: var(--accent-strong); font-weight: 700; }
  .st { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 750; white-space: nowrap; }
  .st-REF { background: var(--ref-soft); color: var(--ref); }
  .st-EQUALIZADO { background: var(--ok); color: #fff; }
  .st-AJUSTANDO { background: var(--warn-soft); color: var(--warn); }
  .st-REVISAR { background: var(--bad); color: #fff; }
  .st-SEM { background: #eef0ef; color: var(--muted); }
  .sis-ok { color: var(--ok); font-weight: 700; }
  .sis-atencao { color: var(--warn); font-weight: 750; }
  .sis-critico { color: var(--bad); font-weight: 750; }
  .sis small { display: block; color: var(--ink); font-weight: 400; }
  .nota { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .vazio { padding: 32px; border: 1px dashed var(--line-strong); border-radius: 10px; color: var(--muted); background: #f4f7f5; text-align: center; }
  .assin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 46px; }
  .assin div { padding-top: 6px; border-top: 1px solid var(--ink); font-size: 12px; font-weight: 650; text-align: center; }
  .lista a { color: var(--accent-strong); font-weight: 700; }
  .rodape-tela { margin-top: 24px; color: var(--muted); font-size: 12px; }
  @media screen and (max-width: 760px) { .rep-head { grid-template-columns: 1fr; gap: 12px; text-align: center; } .rep-logo { margin: 0 auto; } .rep-side { align-items: center; text-align: center; } .assin { grid-template-columns: 1fr; gap: 28px; } }

  @page { size: A4 landscape; margin: 10mm 12mm 14mm;
    @bottom-left { content: "Kartódromo Internacional de Betim · equalização dos karts"; font: 7pt system-ui, "Segoe UI", sans-serif; color: #555; }
    @bottom-right { content: "Página " counter(page) " de " counter(pages); font: 7pt system-ui, "Segoe UI", sans-serif; color: #555; } }
  @media print {
    html, body { background: #fff !important; }
    body { font-size: 8.5pt; line-height: 1.3; }
    .tools, .rodape-tela { display: none !important; }
    .sheet-page { width: 100% !important; margin: 0 !important; padding: 0 !important; border: 0 !important; box-shadow: none !important; }
    .rep-head { grid-template-columns: 36mm minmax(0, 1fr) auto; gap: 5mm; }
    .rep-logo { max-width: 36mm; max-height: 15mm; }
    .rep-kicker { font-size: 7.5pt; } h1 { font-size: 16pt; margin: .5mm 0 1mm; } .sub2 { font-size: 9pt; } .sub3 { font-size: 8pt; color: #333; }
    .rep-side, .pill { font-size: 7.5pt; } .divider { height: .6mm; margin: 3mm 0; }
    .resumo { gap: 2mm 6mm; margin-bottom: 3mm; } .resumo div span { font-size: 6.8pt; } .resumo div b { font-size: 10.5pt; } .resumo div small { font-size: 7.5pt; color: #333; }
    h2 { margin: 4mm 0 1.5mm; font-size: 7.5pt; break-after: avoid; }
    .wrap { overflow: visible; }
    table { font-size: 8pt; } th, td { padding: 1mm 1.4mm; } th { font-size: 6.6pt; background: #eef2ef; border-bottom: .4mm solid #000; } td { border-bottom: .2mm solid #d3dad5; }
    thead { display: table-header-group; } tr { break-inside: avoid; }
    .bloco small { font-size: 6.6pt; } .st { font-size: 7pt; }
    .nota { font-size: 7.5pt; color: #333; margin-top: 2mm; }
    .assin { margin-top: 14mm; gap: 14mm; break-inside: avoid; } .assin div { font-size: 8pt; }
  }
  table.oficina td.obs { min-width: 180px; height: 34px; background-image: repeating-linear-gradient(transparent, transparent 15px, #d9dde3 16px); }
</style>
</head>
<body>
<div class="tools" role="toolbar" aria-label="Ações">
  <a href="/equalizacao" id="lnkLista">← Histórico</a>
  <button type="button" class="primary" id="btnImprimir" onclick="window.print()">Imprimir / PDF</button>
  <select id="filtroTracado" aria-label="Traçado" hidden></select>
  <span class="right" id="estado" role="status" aria-live="polite">Carregando…</span>
</div>
<main class="sheet-page landscape" id="sheet">
  <div class="rep-head">
    <div><img class="rep-logo" src="/kib-logo.png" alt="Kartódromo Internacional de Betim" onerror="this.style.display='none'"></div>
    <div>
      <div class="rep-kicker" id="kicker">Equalização dos karts</div>
      <h1 id="titulo">Carregando…</h1>
      <div class="sub2" id="sub2"></div>
      <div class="sub3" id="sub3"></div>
    </div>
    <div class="rep-side"><span class="pill" id="pill" hidden></span><span id="emitido"></span></div>
  </div>
  <div class="divider"></div>
  <div id="conteudo" aria-live="polite"></div>
</main>
<script>
const id = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VAZIO = '–';
const tempo = (ms) => {
  if (ms == null || !(ms > 0)) return VAZIO;
  // MM:SS:mmm (01:14:000): há traçado de mais de um minuto
  const t = Math.round(ms); const p = (n, d) => String(n).padStart(d, '0');
  return `${p(Math.floor(t / 60000), 2)}:${p(Math.floor((t % 60000) / 1000), 2)}:${p(t % 1000, 3)}`;
};
const delta = (ms) => (ms == null ? '' : `${ms > 0 ? '+' : ms < 0 ? '−' : '±'}${(Math.abs(ms) / 1000).toFixed(3)}`);
const dataHora = (ms) => (ms ? new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(ms)).replace(',', ' ·') : VAZIO);
const dia = (ms) => (ms ? new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(ms)) : VAZIO);
// milímetros do redutor e segundos em texto corrido usam vírgula; os tempos de volta saem como MM:SS:mmm
const mm = (x) => Math.abs(x).toFixed(2).replace(/0$/, '').replace('.', ',');
const segs = (ms) => (ms / 1000).toFixed(3).replace('.', ',');
const ajuste = (x) => (x == null ? '' : x === 0 ? 'equalizado' : `${x > 0 ? 'abrir' : 'fechar'} ${mm(x)} mm`);
// 2ª faixa (acima do limite, ex.: mais de 2 s): outra conta, somada à da 1ª
const faixa2Texto = (g) => (g && g.limiteMs ? `; acima de ${segs(g.limiteMs)} s, a cada ${segs(g.faixa2Ms)} s, ${mm(g.passo2Mm)} mm` : '');
const regraTexto = (g) => `até ±${segs(g.toleranciaMs)} s equalizado; depois, a cada ${segs(g.faixaMs)} s, ${mm(g.passoMm)} mm${faixa2Texto(g)}`;
const ESTADOS = { preparando: 'Preparando', em_andamento: 'Em andamento', bandeira_final: 'Bandeira final', encerrada: 'Encerrada' };
const SISTEMAS = { chassi: 'Chassi / direção', pneu: 'Pneus / calibragem', motor: 'Motor / carburação', embreagem: 'Transmissão / embreagem', freio: 'Freios' };
const NOME_STATUS = { ok: 'OK', atencao: 'ATENÇÃO', critico: 'CRÍTICO' };
const el = (i) => document.getElementById(i);
const agora = () => { const d = new Date(); return `Emitido em ${dia(d.getTime())} às ${new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(d)}`; };

async function api(caminho) {
  const r = await fetch(caminho);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
  return r.json();
}

// dois relatórios ao finalizar (áudio de 06/10): ?tipo=oficina (padrão, com campo de observações) e ?tipo=controle
// (fica na cronometragem: quais são os karts mais rápidos). Os dois do mais rápido para o mais lento.
const TIPO = new URLSearchParams(location.search).get('tipo') === 'controle' ? 'controle' : 'oficina';
// como o kart está agora: a melhor volta do último bloco completo (o redutor que ficou no kart); referência = a melhor
function tempoAtual(k) {
  if (k.referencia) return k.melhorMs ?? null;
  const blocos = [...(k.blocos || [])].reverse();
  return (blocos.find((b) => b.completo && b.melhorMs) || blocos.find((b) => b.melhorMs))?.melhorMs ?? k.melhorMs ?? null;
}
const doMaisRapido = (karts) => [...karts].sort((a, b) => (tempoAtual(a) ?? Infinity) - (tempoAtual(b) ?? Infinity)
  || String(a.kart).localeCompare(String(b.kart), 'pt-BR', { numeric: true }));

function metaTexto(e) {
  if (!e.metaMs) return 'Meta ainda não definida';
  return `${tempo(e.metaMs)} ± ${(e.toleranciaMs / 1000).toFixed(3)} s`;
}

// ------------------------------------------------------------------ relatório de uma equalização (para a oficina)
function relatorio(e) {
  const r = e.resultado;
  document.title = `Equalização · ${e.name}`;
  const quando = e.startedAt || e.createdAt;
  window.nomeArquivoRelatorio = `Equalizacao - ${e.track.name} - ${new Date(quando).toLocaleDateString('sv-SE')}`.replace(/[\\/:*?"<>|·]+/g, ' ').replace(/\s+/g, ' ').trim();
  el('titulo').textContent = e.name;
  el('sub2').textContent = `${dataHora(quando)}${e.finishedAt ? ` às ${new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(new Date(e.finishedAt))}` : ''} · ${e.finalizadaEm ? 'finalizada' : (ESTADOS[e.state] || e.state).toLowerCase()}`;
  el('sub3').textContent = `${e.track.name} · ${Number(e.track.lengthMeters).toLocaleString('pt-BR')} m${e.mecanico ? ` · responsável: ${e.mecanico}` : ''}`;
  el('pill').hidden = false; el('pill').innerHTML = `Meta <strong>${esc(metaTexto(e))}</strong>`;
  el('emitido').textContent = agora();
  if (TIPO === 'controle') return controle(e);
  el('kicker').textContent = 'Equalização dos karts · relatório da oficina';

  const testados = r.karts.filter((k) => !k.referencia);
  const refs = r.referencias;
  const origem = r.metaOrigem === 'fixa' ? 'meta fixa do traçado' : r.metaOrigem === 'referencia' ? `melhor volta dos karts referência${refs.find((x) => x.melhorMs === r.metaMs) ? ` (kart #${esc(refs.find((x) => x.melhorMs === r.metaMs).kart)})` : ''}` : 'sem karts referência com volta';
  let h = `<div class="resumo">
    <div><span>Meta de tempo</span><b>${tempo(r.metaMs)}</b><small>${esc(origem)}</small></div>
    <div><span>Equalizado até</span><b>± ${(r.toleranciaMs / 1000).toFixed(3)} s</b><small>${r.metaMs ? `${tempo(r.metaMs - r.toleranciaMs)} a ${tempo(r.metaMs + r.toleranciaMs)}` : ''}</small></div>
    <div><span>Regra do redutor</span><b>${esc(r.regra.nome)}</b><small>a cada ${segs(r.regra.faixaMs)} s, ${mm(r.regra.passoMm)} mm${faixa2Texto(r.regra)}</small></div>
    ${refs.map((x, i) => `<div><span>Kart referência ${i + 1}</span><b>#${esc(x.kart)} · ${tempo(x.melhorMs)}</b><small>${x.voltas} volta(s) · média ${tempo(x.mediaMs)}</small></div>`).join('')}
    <div><span>Resultado</span><b>${testados.filter((k) => k.status === 'EQUALIZADO').length} de ${testados.length} equalizados</b><small>${testados.filter((k) => k.status === 'REVISAR').length} para a oficina · ${testados.filter((k) => k.status === 'AJUSTANDO').length} ajustando</small></div>
  </div>`;

  // matriz por bloco de 2 voltas (um redutor por bloco; a diferença para a meta diz quanto abrir ou fechar)
  // cabem 5 blocos na folha deitada: de quem andou mais, ficam os 5 últimos (o redutor que está no kart agora)
  const LIMITE_BLOCOS = 5;
  const maisBlocos = Math.max(0, ...testados.map((k) => k.blocos.length));
  const cortado = maisBlocos > LIMITE_BLOCOS;
  const maxBlocos = Math.min(LIMITE_BLOCOS, Math.max(4, maisBlocos));
  h += `<h2>Matriz de testes por bloco de 2 voltas · do kart mais rápido para o mais lento</h2><div class="wrap"><table><thead><tr>
    <th class="num">Pos</th><th>Kart</th><th>Mecânico / piloto</th>
    ${cortado ? `<th class="num" colspan="${maxBlocos}">Blocos de 2 voltas (os ${maxBlocos} últimos de cada kart)</th>`
      : Array.from({ length: maxBlocos }, (_, i) => `<th class="num">Bloco ${i + 1}<br>${i === 0 ? 'redutor inicial' : 'redutor trocado'}</th>`).join('')}
    <th>Redutor<br>sugerido</th><th>Status</th><th>Ação recomendada</th><th class="num">Voltas nas baterias<br>desde a última</th>
  </tr></thead><tbody>`;
  const ordem = doMaisRapido(r.karts);
  for (const [pos, k] of ordem.entries()) {
    const v = e.voltasDesdeUltima[k.kart] || { voltas: 0, baterias: 0, desde: null };
    const voltasTxt = `${v.voltas}<small style="display:block;color:var(--muted)">${v.baterias} bateria(s)</small><small style="display:block;color:var(--muted)">${v.desde ? `desde ${dia(v.desde)}` : '1ª equalização'}</small>`;
    h += `<tr><td class="num">${tempoAtual(k) ? `${pos + 1}º` : VAZIO}</td><td class="c"><span class="kart">${esc(k.kart)}</span></td><td>${esc(k.piloto)}</td>`;
    if (k.referencia) {
      h += `<td class="num bloco" colspan="${maxBlocos}" style="text-align:left">Melhor <strong>${tempo(k.melhorMs)}</strong> · média ${tempo(k.mediaMs)} · ${k.voltas} volta(s) — base de comparação</td>`;
    } else {
      const visiveis = k.blocos.slice(-maxBlocos);
      for (let i = 0; i < maxBlocos; i++) {
        const b = visiveis[i];
        if (!b) { h += `<td class="num">${VAZIO}</td>`; continue; }
        const media = !b.completo ? 'falta 1 volta' : b.deltaMs != null ? `melhor ${tempo(b.melhorMs)} (${delta(b.deltaMs)})` : `melhor ${tempo(b.melhorMs)}`;
        h += `<td class="num bloco${b.dentro && b.completo ? ' dentro' : ''}${b.anteriorEm ? ' anterior' : ''}">${b.anteriorEm ? `<small>equalização de ${dia(b.anteriorEm).slice(0, 5)}</small>` : ''}${cortado ? `<small>bloco ${b.bloco}</small>` : ''}${b.voltasMs.map(tempo).join(' / ')}${b.completo ? '' : ' / …'}<small>${media}</small><small>${esc(b.rotulo)}${b.ajusteMm != null ? ` → ${ajuste(b.ajusteMm)}` : ''}</small></td>`;
      }
    }
    const cls = k.status === 'SEM VOLTAS' ? 'SEM' : k.status;
    h += `<td>${k.redutorSugerido == null ? VAZIO : esc(k.redutorSugerido)}</td><td><span class="st st-${cls}">${k.confirmadoManualmente ? 'EQUALIZADO MANUAL' : esc(k.status)}</span></td><td>${esc(k.acao)}</td><td class="num">${voltasTxt}</td></tr>`;
  }
  if (!r.karts.length) h += `<tr><td colspan="${maxBlocos + 7}" class="c" style="padding:18px;color:var(--muted)">Nenhum kart nesta equalização ainda.</td></tr>`;
  h += `</tbody></table></div>`;

  // folha para a oficina: o que fazer em cada kart e um campo para anotar (do mais rápido para o mais lento)
  const paraOficina = ordem.filter((k) => !k.referencia);
  if (paraOficina.length) {
    h += `<h2>Para a oficina · do kart mais rápido para o mais lento</h2><div class="wrap"><table class="oficina"><thead><tr>
      <th class="num">Pos</th><th>Kart</th><th class="num">Tempo atual</th><th class="num">Dif. p/ meta</th><th>Redutor</th><th>Status</th><th>Ação recomendada</th><th style="width:30%">Observações da oficina</th>
    </tr></thead><tbody>`;
    for (const k of paraOficina) {
      const t = tempoAtual(k);
      const cls = k.status === 'SEM VOLTAS' ? 'SEM' : k.status;
      h += `<tr><td class="num">${t ? `${ordem.indexOf(k) + 1}º` : VAZIO}</td><td class="c"><span class="kart">${esc(k.kart)}</span></td><td class="num">${tempo(t)}</td>
        <td class="num">${t && r.metaMs ? delta(t - r.metaMs) : VAZIO}</td><td>${k.redutorSugerido == null ? VAZIO : esc(k.redutorSugerido)}</td>
        <td><span class="st st-${cls}">${k.confirmadoManualmente ? 'EQUALIZADO MANUAL' : esc(k.status)}</span></td><td>${esc(k.acao)}</td><td class="obs">${esc(k.checklist?.observacoes || '')}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }

  // apontamentos técnicos (checklist da oficina)
  const comApontamento = r.karts.filter((k) => k.checklist && (Object.keys(k.checklist.sistemas || {}).length || k.checklist.observacoes || k.checklist.acaoOficina));
  h += `<h2>Apontamentos técnicos · checklist da oficina</h2>`;
  if (!comApontamento.length) h += `<p class="nota">Nenhum apontamento registrado para os karts desta equalização.</p>`;
  else {
    h += `<div class="wrap"><table><thead><tr><th>Kart</th>${Object.values(SISTEMAS).map((n) => `<th>${n}</th>`).join('')}<th>Observações</th><th>Ação da oficina / peças</th></tr></thead><tbody>`;
    for (const k of comApontamento) {
      h += `<tr><td class="c"><span class="kart">${esc(k.kart)}</span></td>`;
      for (const s of Object.keys(SISTEMAS)) {
        const x = (k.checklist.sistemas || {})[s];
        h += x ? `<td class="sis sis-${x.status}">${NOME_STATUS[x.status]}${x.nota ? `<small>${esc(x.nota)}</small>` : ''}</td>` : `<td>${VAZIO}</td>`;
      }
      h += `<td>${esc(k.checklist.observacoes) || VAZIO}</td><td>${esc(k.checklist.acaoOficina) || VAZIO}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  const fx = e.regra.faixas || [];
  h += `<p class="nota"><strong>Regra do redutor (${esc(r.regra.nome)}):</strong> ${fx.filter((f) => !f.segunda).map((f, i) => (i === 0 ? `diferença até ${segs(f.ateMs)} s = equalizado` : `de ${segs(f.deMs)} a ${segs(f.ateMs)} s = ${mm(f.mm)} mm`)).join(' · ')} · e assim por diante (a cada ${segs(r.regra.faixaMs)} s, mais ${mm(r.regra.passoMm)} mm${r.regra.limiteMs ? `, até ${segs(r.regra.limiteMs)} s` : ''}).${r.regra.limiteMs ? ` <strong>Acima de ${segs(r.regra.limiteMs)} s</strong> (2ª faixa): ${fx.filter((f) => f.segunda).map((f) => `de ${segs(f.deMs)} a ${segs(f.ateMs)} s = ${mm(f.mm)} mm`).join(' · ')} · e assim por diante (a cada ${segs(r.regra.faixa2Ms)} s, mais ${mm(r.regra.passo2Mm)} mm).` : ''} Kart mais lento que a referência: <strong>abrir</strong>; mais rápido: <strong>fechar</strong>.</p>
    <p class="nota"><strong>Como ler:</strong> cada bloco são 2 voltas com um redutor. O bloco 1 é com o redutor que estava no kart (o inicial); a diferença da melhor volta do bloco para a meta diz quanto abrir ou fechar. Cada nova equalização começa sem blocos herdados: medições passadas ficam no histórico da respectiva sessão. Depois de aplicar o redutor sugerido, a oficina pode registrar EQUALIZADO MANUALMENTE sem criar voltas de confirmação; a próxima medição completa volta a definir a situação automaticamente. Os karts referência servem de comparação: a meta é a melhor volta entre eles. As voltas da equalização ficam separadas das baterias normais.</p>
    <div class="assin"><div>Cronometragem</div><div>Oficina · mecânico responsável</div><div>Data</div></div>`;
  el('conteudo').innerHTML = h;
  el('estado').textContent = `${ESTADOS[e.state] || e.state}${e.finalizadaEm ? ' · finalizada' : ''} · ${r.karts.length} karts`;
}

// ------------------------------------------------------------------ controle da cronometragem: do kart mais rápido para o mais lento
function controle(e) {
  const r = e.resultado;
  document.title = `Equalização · controle · ${e.name}`;
  window.nomeArquivoRelatorio = (window.nomeArquivoRelatorio || 'Equalizacao') + ' - controle';
  el('kicker').textContent = 'Equalização dos karts · controle da cronometragem';
  const ordem = doMaisRapido(r.karts);
  const comTempo = ordem.filter((k) => tempoAtual(k));
  const maisRapido = comTempo.length ? tempoAtual(comTempo[0]) : null;
  let h = `<div class="resumo">
    <div><span>Meta de tempo</span><b>${tempo(r.metaMs)}</b><small>equalizado até ± ${(r.toleranciaMs / 1000).toFixed(3)} s</small></div>
    <div><span>Kart mais rápido</span><b>${comTempo.length ? `#${esc(comTempo[0].kart)} · ${tempo(maisRapido)}` : VAZIO}</b><small>${comTempo.length ? esc(comTempo[0].piloto) : ''}</small></div>
    <div><span>Kart mais lento</span><b>${comTempo.length > 1 ? `#${esc(comTempo[comTempo.length - 1].kart)} · ${tempo(tempoAtual(comTempo[comTempo.length - 1]))}` : VAZIO}</b><small>${comTempo.length > 1 ? `${segs(tempoAtual(comTempo[comTempo.length - 1]) - maisRapido)} s atrás do mais rápido` : ''}</small></div>
    <div><span>Karts</span><b>${r.karts.length}</b><small>${r.karts.filter((k) => k.status === 'EQUALIZADO').length} equalizado(s) · ${r.karts.filter((k) => k.status === 'REVISAR').length} para revisar</small></div>
  </div>`;
  h += `<h2>Do kart mais rápido para o mais lento</h2><div class="wrap"><table><thead><tr>
    <th class="num">Pos</th><th>Kart</th><th>Mecânico / piloto</th><th class="num">Tempo atual<br><small>melhor do último bloco</small></th><th class="num">Dif. p/ meta</th>
    <th class="num">Dif. p/ o mais rápido</th><th class="num">Melhor volta<br>na equalização</th><th class="num">Voltas</th><th>Redutor</th><th>Status</th>
  </tr></thead><tbody>`;
  for (const [pos, k] of ordem.entries()) {
    const t = tempoAtual(k);
    const cls = k.status === 'SEM VOLTAS' ? 'SEM' : k.status;
    h += `<tr><td class="num">${t ? `${pos + 1}º` : VAZIO}</td><td class="c"><span class="kart">${esc(k.kart)}</span></td><td>${esc(k.piloto)}</td>
      <td class="num"><strong>${tempo(t)}</strong></td><td class="num">${t && r.metaMs ? delta(t - r.metaMs) : VAZIO}</td><td class="num">${t && maisRapido ? (t === maisRapido ? '–' : delta(t - maisRapido)) : VAZIO}</td>
      <td class="num">${tempo(k.melhorMs)}</td><td class="num">${k.voltas}</td><td>${k.referencia ? 'referência' : k.redutorSugerido == null ? VAZIO : esc(k.redutorSugerido)}</td>
      <td><span class="st st-${cls}">${k.confirmadoManualmente ? 'EQUALIZADO MANUAL' : esc(k.status)}</span></td></tr>`;
  }
  if (!ordem.length) h += `<tr><td colspan="10" class="c" style="padding:18px;color:var(--muted)">Nenhum kart nesta equalização ainda.</td></tr>`;
  h += `</tbody></table></div>
    <p class="nota"><strong>Como ler:</strong> o tempo atual é a melhor volta do último bloco completo de cada kart, ou seja, com o redutor que ficou nele (karts referência: a melhor volta). A ordem vai do mais rápido para o mais lento; kart sem volta fica no fim.</p>`;
  el('conteudo').innerHTML = h;
  el('estado').textContent = `Controle · ${r.karts.length} karts`;
}

// ------------------------------------------------------------------ histórico: equalizações por data e metas por traçado
async function historico() {
  el('lnkLista').hidden = true;
  const sel = el('filtroTracado'); sel.hidden = false;
  const q = new URLSearchParams(location.search);
  const tid = q.get('trackId');
  const [lista, metas] = await Promise.all([api('/api/equalizacao' + (tid ? `?trackId=${encodeURIComponent(tid)}` : '')), api('/api/equalizacao/metas' + (tid !== null ? `?trackId=${encodeURIComponent(tid)}` : ''))]);
  sel.innerHTML = `<option value="*">Todos os traçados</option>` + lista.tracks.map((t) => `<option value="${esc(t.id)}">${esc(t.name)} · ${t.lengthMeters} m</option>`).join('');
  sel.value = tid ?? '*';
  sel.onchange = () => { location.search = sel.value === '*' ? '' : `?trackId=${encodeURIComponent(sel.value)}`; };
  document.title = 'Equalização dos karts · histórico';
  window.nomeArquivoRelatorio = 'Equalizacao - historico';
  el('titulo').textContent = 'Histórico das equalizações';
  el('sub2').textContent = tid ? (lista.tracks.find((t) => t.id === tid)?.name || 'Traçado') : 'Todos os traçados';
  el('sub3').textContent = `${lista.equalizacoes.length} equalização(ões) · ${metas.metas.length} meta(s) registrada(s)`;
  el('emitido').textContent = agora();
  let h = `<h2>Equalizações por data</h2>`;
  if (!lista.equalizacoes.length) h += `<div class="vazio">Nenhuma equalização registrada${tid ? ' neste traçado' : ''}.</div>`;
  else {
    h += `<div class="wrap"><table class="lista"><thead><tr><th>Data</th><th>Equalização</th><th>Traçado</th><th class="num">Meta</th><th class="num">Tolerância</th><th>Referências</th><th class="num">Karts</th><th class="num">Equalizados</th><th class="num">Oficina</th><th>Situação</th></tr></thead><tbody>`;
    for (const e of lista.equalizacoes) {
      h += `<tr><td>${dataHora(e.startedAt || e.createdAt)}</td><td><a href="/equalizacao/${encodeURIComponent(e.id)}">${esc(e.name)}</a></td><td>${esc(e.track.name)}</td>
        <td class="num"><strong>${tempo(e.metaMs)}</strong></td><td class="num">± ${(e.toleranciaMs / 1000).toFixed(3)}</td><td>${e.referencias.map((k) => `#${esc(k)}`).join(', ') || VAZIO}</td>
        <td class="num">${e.karts}</td><td class="num">${e.equalizados}</td><td class="num">${e.revisar}</td><td>${e.finalizadaEm ? 'Finalizada' : esc(ESTADOS[e.state] || e.state)}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  h += `<h2>Meta de tempo por traçado (histórico)</h2>`;
  if (!metas.metas.length) h += `<p class="nota">Nenhuma meta registrada ainda. A meta de cada equalização finalizada entra aqui; também dá para definir uma meta fixa do traçado na Cronometragem.</p>`;
  else {
    h += `<div class="wrap"><table><thead><tr><th>Data</th><th>Traçado</th><th class="num">Meta</th><th class="num">Tolerância</th><th>Origem</th><th>Referências</th></tr></thead><tbody>`;
    for (const m of metas.metas) h += `<tr><td>${dataHora(m.quando)}</td><td>${esc(m.track)}</td><td class="num"><strong>${tempo(m.metaMs)}</strong></td><td class="num">± ${(m.toleranciaMs / 1000).toFixed(3)}</td><td>${m.origem === 'manual' ? 'Meta fixa definida' : 'Equalização'}</td><td>${(m.referencias || []).map((k) => `#${esc(k)}`).join(', ') || VAZIO}</td></tr>`;
    h += `</tbody></table></div>`;
  }
  h += `<p class="rodape-tela">Para criar ou editar uma equalização use a aba Equalização do programa da Cronometragem.</p>`;
  el('conteudo').innerHTML = h;
  el('estado').textContent = 'Histórico';
}

async function carregar() {
  try {
    if (id) relatorio(await api('/api/equalizacao/' + encodeURIComponent(id)));
    else await historico();
  } catch (erro) {
    el('titulo').textContent = 'Não foi possível carregar';
    el('conteudo').innerHTML = `<div class="vazio">${esc(erro.message)}</div>`;
    el('estado').textContent = 'Falha ao carregar';
  }
}
carregar();
// equalização aberta: atualiza sozinha a cada 5 s (na tela; a impressão usa o que está na tela)
if (id) setInterval(() => { if (document.visibilityState === 'visible' && !window.matchMedia('print').matches) carregar(); }, 5000);
</script>
</body>
</html>
