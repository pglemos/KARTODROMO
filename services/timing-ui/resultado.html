<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório Oficial de Cronometragem</title>
<style>
  :root {
    --text: #000000;
    --border-dark: #333333;
    --border-light: #cccccc;
    --bg-th: #e6e6e6;
    --bg-cat: #f0f0f0;
    --bg-zebra: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: #525659;
    margin: 0;
    padding: 0;
    font-size: 8pt;
    line-height: 1.25;
  }

  /* Barra de ferramentas na tela */
  .tools {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: #2a2d32;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .tools label { font-size: 12px; font-weight: bold; color: #ccc; }
  .tools select {
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #555;
    font: inherit;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    background: #3b3e44;
    outline: none;
    cursor: pointer;
  }
  .tools button {
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #4a4d53;
    color: #fff;
    font: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tools button:hover { background: #5a5d65; }
  .tools button.primary { background: #0b7a53; border-color: #0b7a53; }
  .tools button.primary:hover { background: #085e40; }
  .tools .right { margin-left: auto; font-size: 12px; color: #aaa; font-weight: bold; }

  /* Folha física A4 do Relatório LapTime (simulação fiel em tela) */
  .sheet-page {
    background: #ffffff;
    margin: 15px auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    position: relative;
    padding: 8mm 10mm;
  }
  .sheet-page.portrait {
    width: 210mm;
    min-height: 297mm;
  }
  .sheet-page.landscape {
    width: 297mm;
    min-height: 210mm;
  }

  /* Cabeçalho Oficial RDLC LapTime */
  .rep-header {
    width: 100%;
    margin-bottom: 2mm;
  }
  .rep-header-table {
    width: 100%;
    border-collapse: collapse;
  }
  .rep-header-table td {
    vertical-align: top;
    padding: 0;
  }
  .rep-logo-td {
    width: 42mm;
    text-align: left;
  }
  .rep-logo {
    max-height: 22mm;
    max-width: 40mm;
    object-fit: contain;
  }
  .rep-titles-td {
    text-align: center;
    padding: 0 2mm;
  }
  .rep-title-1 {
    font-size: 12pt;
    font-weight: bold;
    line-height: 1.15;
    color: #000;
    text-transform: uppercase;
  }
  .rep-subtitle-1 {
    font-size: 9pt;
    font-weight: bold;
    margin-top: 1mm;
    color: #000;
  }
  .rep-subtitle-2 {
    font-size: 9pt;
    font-weight: bold;
    margin-top: 0.5mm;
    color: #000;
  }
  .rep-subtitle-3 {
    font-size: 8.5pt;
    margin-top: 0.5mm;
    color: #333;
  }
  .rep-divider-line {
    width: 100%;
    height: 1px;
    background: #000;
    margin-top: 2mm;
    margin-bottom: 0.8mm;
  }
  .rep-date-time {
    font-size: 6.5pt;
    font-weight: bold;
    text-align: right;
    color: #000;
    margin-bottom: 2mm;
  }

  /* Tabelas de Dados (RDLC Tablix) */
  table.rdlc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 7.5pt;
  }
  table.rdlc-table th, table.rdlc-table td {
    padding: 2px 3px;
    border: 1px solid #b5b5b5;
    font-variant-numeric: tabular-nums;
  }
  table.rdlc-table th {
    background: #e6e6e6;
    font-size: 7.5pt;
    font-weight: bold;
    color: #000;
    text-align: center;
    border-top: 1px solid #666;
    border-bottom: 1.5px solid #444;
  }
  table.rdlc-table tr.category-row td {
    background: #f0f0f0;
    font-weight: bold;
    font-size: 8pt;
    padding: 3px 5px;
    border-top: 1.5px solid #666;
    border-bottom: 1.5px solid #666;
    text-align: left;
  }
  table.rdlc-table tr:nth-child(even) td {
    background: #fcfcfc;
  }
  .c-center { text-align: center !important; }
  .c-left { text-align: left !important; }
  .c-right { text-align: right !important; }
  .c-bold { font-weight: bold !important; }
  .c-best { font-weight: bold; text-decoration: underline; }

  /* Nota de Melhor Volta & Penalidades */
  .rdlc-notes-box {
    margin-top: 3mm;
    font-size: 7.5pt;
    border-top: 1px solid #000;
    padding-top: 1mm;
  }
  .rdlc-bestlap-note {
    font-weight: bold;
    margin-bottom: 1mm;
  }

  /* Tabela de Legenda */
  table.rdlc-legend {
    width: 100%;
    border-collapse: collapse;
    margin-top: 2mm;
    font-size: 6.5pt;
  }
  table.rdlc-legend th {
    background: #e6e6e6;
    font-weight: bold;
    border: 1px solid #b5b5b5;
    padding: 1.5px 3px;
    text-align: left;
  }
  table.rdlc-legend td {
    border: 1px solid #b5b5b5;
    padding: 1.5px 3px;
    background: #fff;
  }

  /* Rodapé Oficial LapTime */
  .rep-footer {
    margin-top: 6mm;
    width: 100%;
  }
  .signatures-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 3mm;
  }
  .signatures-table td {
    width: 33.33%;
    text-align: center;
    vertical-align: top;
    padding: 0 4mm;
  }
  .sign-line {
    border-top: 1px solid #000;
    margin-top: 8mm;
    padding-top: 1mm;
    font-size: 8pt;
    color: #000;
  }
  .sign-org {
    font-weight: bold;
    font-size: 8pt;
    color: #000;
    margin-top: 0.5mm;
  }
  .page-num-line {
    text-align: right;
    font-size: 7.5pt;
    color: #333;
    margin-bottom: 1mm;
  }

  /* Grid de Largada (Tablix LapTime RDLC) */
  .grid-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 5mm 3mm;
    margin-top: 4mm;
  }
  .grid-slot {
    width: 50%;
    vertical-align: top;
  }
  .grid-slot-3col {
    width: 33.33%;
    vertical-align: top;
  }
  .grid-pos-box {
    background: #d4d4d4;
    border: 1px solid #777;
    font-size: 8.5pt;
    font-weight: bold;
    text-align: center;
    padding: 2px 0;
  }
  .grid-name-box {
    background: #ffffff;
    border: 1px solid #777;
    border-top: none;
    font-size: 8pt;
    font-weight: bold;
    text-align: center;
    padding: 5px 2px;
    min-height: 12mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .grid-time-sub {
    font-size: 6.5pt;
    font-weight: normal;
    color: #444;
    margin-top: 1px;
  }

  /* Volta a Volta (LapToLapReport.rdlc) */
  .lap-to-lap-driver {
    margin-bottom: 5mm;
    page-break-inside: avoid;
  }
  .lap-to-lap-header {
    background: #e6e6e6;
    border: 1px solid #777;
    border-bottom: none;
    font-size: 8pt;
    font-weight: bold;
    padding: 2.5px 5px;
  }

  /* Modo Cupom Térmico TM-T20 */
  body.cupom {
    background: #fff;
    padding: 0;
    font-size: 9pt;
  }
  body.cupom .tools { display: none !important; }
  body.cupom .sheet-page {
    width: 72mm !important;
    min-height: auto !important;
    margin: 0 !important;
    padding: 2mm !important;
    box-shadow: none !important;
    border: none !important;
  }
  body.cupom .rep-logo { max-height: 14mm; }
  body.cupom .rep-title-1 { font-size: 9pt; }
  body.cupom .rep-subtitle-1, body.cupom .rep-subtitle-2 { font-size: 8pt; }
  body.cupom .rep-soft-td { display: none; }
  body.cupom .signatures-table { display: none; }
  body.cupom .hide-cupom { display: none !important; }
  body.cupom table.rdlc-table { font-size: 7.5pt; }

  @media print {
    body { background: #fff !important; }
    .tools { display: none !important; }
    .sheet-page {
      box-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      width: 100% !important;
      min-height: auto !important;
    }
  }

  /* Refinamento visual Impeccable: tela operacional clara, papel reservado para impressão. */
  :root {
    --page-bg: #e8eee9;
    --surface: #ffffff;
    --surface-subtle: #f4f7f5;
    --ink: #15201a;
    --muted: #526057;
    --line: #cbd5ce;
    --line-strong: #78867d;
    --accent: #087f48;
    --accent-strong: #065d35;
    --accent-soft: #e5f4eb;
    --warning: #8a5200;
    --warning-soft: #fff5d9;
    --danger: #a62b24;
    --danger-soft: #fff0ee;
    --focus: #00a86b;
  }

  html { min-width: 320px; }
  [hidden] { display: none !important; }
  body {
    background: var(--page-bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  button, select { font: inherit; }
  button:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .tools {
    min-height: 58px;
    padding: 10px clamp(16px, 3vw, 32px);
    gap: 12px;
    flex-wrap: wrap;
    background: #070a08;
    border-bottom: 1px solid #27352c;
    box-shadow: 0 3px 14px rgba(8, 16, 11, 0.22);
  }
  .tool-context {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .tool-context label,
  .tools label {
    color: #d4ded7;
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 0.02em;
  }
  .tools select {
    min-height: 38px;
    min-width: min(360px, 42vw);
    padding: 7px 34px 7px 11px;
    border: 1px solid #526157;
    border-radius: 8px;
    color: #f3faf5;
    background: #151d18;
    font-size: 13px;
    font-weight: 700;
  }
  .tools button {
    min-height: 38px;
    padding: 8px 13px;
    border: 1px solid #526157;
    border-radius: 8px;
    color: #f6fbf7;
    background: #1d2821;
    font-size: 13px;
    font-weight: 750;
    transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
  }
  .tools button:hover { background: #29382e; border-color: #78917f; transform: translateY(-1px); }
  .tools button.primary { background: var(--accent); border-color: var(--accent); }
  .tools button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .tool-icon { width: 17px; height: 17px; flex: 0 0 17px; fill: currentColor; }
  .tools .right {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    color: #b6c5bb;
    font-size: 12px;
    font-weight: 650;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 5px 10px;
    border: 1px solid #526157;
    border-radius: 999px;
    background: #151d18;
    color: #dce8df;
    white-space: nowrap;
  }
  .status-badge--closed { border-color: #3a8f5a; background: #10271a; color: #a8edbc; }
  .status-badge--active { border-color: #a77a25; background: #2a2110; color: #ffe5a1; }
  .status-badge--error { border-color: #a85a51; background: #321614; color: #ffc1bb; }

  .sheet-page {
    width: min(calc(100% - 32px), 1240px);
    min-height: 0;
    margin: 32px auto 48px;
    padding: clamp(24px, 4vw, 48px);
    border: 1px solid #d7e0d9;
    border-radius: 3px;
    background: var(--surface);
    box-shadow: 0 12px 28px rgba(28, 47, 34, 0.14);
  }
  .sheet-page.portrait,
  .sheet-page.landscape { width: min(calc(100% - 32px), 1240px); min-height: 0; }
  .rep-header { margin-bottom: 22px; }
  .rep-header-table { table-layout: fixed; }
  .rep-logo-td { width: 180px; }
  .rep-logo-wrap { min-height: 72px; display: flex; align-items: center; }
  .rep-logo { max-width: 170px; max-height: 72px; }
  .rep-logo-fallback {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    background: var(--surface-subtle);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .rep-titles-td { padding: 0 20px; }
  .rep-title-1 {
    margin: 0;
    color: var(--ink);
    font-size: clamp(20px, 2.2vw, 29px);
    letter-spacing: -0.02em;
    line-height: 1.08;
  }
  .rep-subtitle-1, .rep-subtitle-2 { margin-top: 6px; color: #26372c; font-size: 15px; }
  .rep-subtitle-3 { margin-top: 5px; color: var(--muted); font-size: 13px; }
  .classification-rule {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--accent-strong);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-align: center;
    text-transform: uppercase;
  }
  .classification-rule strong { font-size: 13px; }
  .classification-rule span { color: var(--muted); font-weight: 650; letter-spacing: 0.02em; text-transform: none; }
  .rep-divider-line { height: 2px; margin-top: 18px; margin-bottom: 9px; background: var(--accent); }
  .rep-date-time {
    margin-bottom: 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  #reportContent { min-width: 0; overflow-x: auto; }
  #reportContent > table.rdlc-table,
  #reportContent > div > table.rdlc-table { min-width: 850px; }
  table.rdlc-table {
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-size: 12px;
    overflow: hidden;
  }
  table.rdlc-table th,
  table.rdlc-table td { padding: 8px 9px; border-color: var(--line); }
  table.rdlc-table th {
    background: #e8f0eb;
    border-top-color: var(--line-strong);
    border-bottom: 2px solid var(--line-strong);
    color: #1d3024;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  table.rdlc-table tr:nth-child(even) td { background: #f7faf8; }
  table.rdlc-table tr:hover td { background: #eef8f1; }
  table.rdlc-table td.c-bold { color: #0b5e35; }
  .result-secondary { color: var(--muted); font-weight: 550; }
  .screen-secondary { color: var(--muted); }
  .report-caption { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .criterion-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .criterion-note strong { color: var(--ink); }
  .report-loading,
  .report-empty {
    display: grid;
    place-items: center;
    min-height: 150px;
    padding: 32px;
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
    color: var(--muted);
    background: var(--surface-subtle);
    text-align: center;
  }
  .report-alert {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 16px;
    padding: 14px 16px;
    border: 1px solid #d8b56b;
    border-left: 4px solid var(--warning);
    border-radius: 8px;
    background: var(--warning-soft);
    color: #5d3c00;
  }
  .report-alert--error { border-color: #e4a49e; border-left-color: var(--danger); background: var(--danger-soft); color: #651a15; }
  .report-alert h2 { margin: 0 0 3px; color: inherit; font-size: 15px; }
  .report-alert p { margin: 0; font-size: 13px; }
  .retry-button {
    flex: 0 0 auto;
    min-height: 36px;
    padding: 7px 12px;
    border: 1px solid currentColor;
    border-radius: 7px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 12px;
    font-weight: 750;
  }
  .retry-button:hover { background: rgba(255, 255, 255, 0.55); }

  .rdlc-notes-box { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; }
  .rdlc-bestlap-note { margin-bottom: 12px; color: var(--ink); font-size: 13px; }
  table.rdlc-legend { margin-top: 12px; font-size: 12px; }
  table.rdlc-legend th { background: #e8f0eb; color: #1d3024; }
  table.rdlc-legend td { color: var(--muted); white-space: normal; }
  .legend-details {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-subtle);
  }
  .legend-details summary { padding: 10px 12px; color: var(--ink); cursor: pointer; font-weight: 750; }
  .legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 14px; padding: 0 12px 12px; }
  .legend-grid span { color: var(--muted); font-size: 12px; }
  .legend-grid strong { color: var(--ink); }
  .rep-footer { margin-top: 38px; }
  .signatures-table { margin-bottom: 24px; }
  .sign-line { margin-top: 24px; padding-top: 8px; border-color: var(--line-strong); color: var(--ink); font-size: 12px; }
  .sign-org { color: var(--muted); font-size: 12px; }
  .page-num-line { color: var(--muted); font-size: 12px; }

  @media screen and (max-width: 900px) {
    .tools .right { width: 100%; margin-left: 0; }
    .tools select { min-width: min(100%, 360px); }
    .sheet-page,
    .sheet-page.portrait,
    .sheet-page.landscape { width: calc(100% - 20px); margin-top: 20px; padding: 22px 18px; }
    .rep-logo-td { width: 112px; }
    .rep-logo { max-width: 102px; max-height: 54px; }
    .rep-titles-td { padding: 0 10px; }
    .rep-title-1 { font-size: 20px; }
    .rep-subtitle-1, .rep-subtitle-2 { font-size: 13px; }
    .rep-subtitle-3 { font-size: 12px; }
  }
  @media screen and (max-width: 760px) {
    .tool-context { width: 100%; align-items: flex-start; flex-direction: column; gap: 5px; }
    .tools select { width: 100%; }
    .tools button { flex: 1 1 auto; justify-content: center; }
    .classification-rule { align-items: center; flex-direction: column; gap: 2px; }
    .rep-header-table, .rep-header-table tbody, .rep-header-table tr, .rep-header-table td { display: block; width: 100%; }
    .rep-logo-td { min-height: 0; text-align: center !important; }
    .rep-logo-wrap { justify-content: center; min-height: 0; margin-bottom: 14px; }
    .rep-titles-td { padding: 0; }
    .screen-secondary { display: none !important; }
    #reportContent > table.rdlc-table { min-width: 0; width: 100%; }
    #reportContent > table.rdlc-table .result-secondary { display: none; }
    #reportContent > table.rdlc-table th,
    #reportContent > table.rdlc-table td { padding: 8px 5px; }
    table.rdlc-table { min-width: 650px; }
    .report-alert { flex-direction: column; }
    .retry-button { width: 100%; }
  }

  /* Documento oficial (revisão de 01/10): hierarquia evento > prova > dados, tabela leve, números legíveis.
     Escala de texto: título, rótulo (maiúsculas), corpo e nota. */
  .rep-head {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 24px;
  }
  .rep-head .rep-logo-wrap { min-height: 0; }
  .rep-logo { display: block; max-width: 160px; max-height: 64px; }
  .rep-titles { min-width: 0; text-align: left; }
  .rep-kicker {
    color: var(--accent-strong);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .rep-head .rep-title-1 { margin: 2px 0 4px; font-size: clamp(22px, 2.4vw, 30px); text-transform: none; }
  .rep-head .rep-subtitle-2 { margin: 0; color: var(--ink); font-size: 14px; font-weight: 500; }
  .rep-head .rep-subtitle-3 { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .rep-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; }
  .rep-head .classification-rule {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    margin: 0;
    padding: 4px 10px;
    border: 1px solid #b9dcc6;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 12px;
    letter-spacing: 0;
    text-transform: none;
    white-space: nowrap;
  }
  .rep-head .classification-rule:empty { display: none; }
  .rep-head .classification-rule strong { font-size: 12px; }
  .rep-head .classification-rule span { color: inherit; font-weight: 500; letter-spacing: 0; }
  .rep-head .rep-date-time { margin: 0; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0; text-align: right; }
  .rep-header .rep-divider-line { height: 2px; margin: 16px 0 0; }

  /* Tabela: só linhas horizontais, sem cantos arredondados, cabeçalho numa linha só */
  table.rdlc-table { border: 0; border-radius: 0; overflow: visible; }
  table.rdlc-table th,
  table.rdlc-table td { border: 0; border-bottom: 1px solid var(--line); }
  table.rdlc-table th {
    background: #f1f5f2;
    border-top: 0;
    border-bottom: 1.5px solid var(--ink);
    color: #33433a;
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 0.03em;
    vertical-align: bottom;
    white-space: nowrap;
  }
  table.rdlc-table td.c-bold { color: var(--ink); }
  .screen-secondary { color: inherit; }
  .rdlc-resultado .col-pos { width: 1%; text-align: center; font-weight: 800; }
  .rdlc-resultado .col-kart { width: 1%; text-align: center; }
  .rdlc-resultado .col-nome { text-align: left; font-weight: 550; }
  .rdlc-resultado th.col-nome, .rdlc-resultado th.col-cat { text-align: left; }
  .rdlc-resultado th.col-pos, .rdlc-resultado th.col-nome { font-weight: 750; }
  .rdlc-resultado .col-cat { text-align: left; white-space: nowrap; }
  .rdlc-resultado .col-num { width: 1%; text-align: right; white-space: nowrap; }
  .rdlc-resultado td.col-vazio { padding: 18px; color: var(--muted); text-align: center; }
  .kart-num {
    display: inline-block;
    min-width: 2.7em;
    padding: 0 4px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: #fff;
    color: #33433a;
    font-weight: 650;
    text-align: center;
  }
  .c-best {
    display: inline-block;
    padding: 0 5px;
    border-radius: 3px;
    background: var(--accent);
    color: #fff;
    font-weight: 750;
    text-decoration: none;
  }
  /* nos mapas e no volta a volta o destaque é a própria célula */
  table.rdlc-table td.c-best { display: table-cell; padding: 8px 9px; border-radius: 0; background: var(--accent-soft); color: var(--accent-strong); }
  body.cupom .c-best { padding: 0; background: none; color: inherit; text-decoration: none; }

  /* Resumo e "como ler" */
  .rdlc-notes-box { display: grid; gap: 8px; margin-top: 16px; padding-top: 0; border-top: 0; }
  .rdlc-bestlap-note { margin: 0; color: var(--ink); font-size: 13px; }
  .nota-rotulo {
    margin-right: 8px;
    color: var(--accent-strong);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .legend-details { border: 0; border-radius: 0; background: none; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .legend-details .legend-grid { display: inline; padding: 0; }
  .legend-details .legend-grid span { white-space: nowrap; }
  .legend-details .legend-grid span + span::before { content: " · "; white-space: normal; }
  .legend-details .criterion-note { margin: 4px 0 0; }

  /* Assinaturas iguais, com nome e data */
  .signatures-table td { text-align: left; }
  .sign-line { margin-top: 44px; padding-top: 6px; border-top: 1px solid var(--ink); color: var(--ink); font-size: 12px; font-weight: 650; text-align: center; }
  .sign-field { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; color: var(--muted); font-size: 11px; }
  .sign-field span { flex: 1; border-bottom: 1px solid var(--line-strong); }
  .page-num-line { text-align: left; }

  @media screen and (max-width: 760px) {
    .rep-head { grid-template-columns: 1fr; gap: 12px; text-align: center; }
    .rep-head .rep-logo-wrap { justify-content: center; margin: 0; }
    .rep-titles { text-align: center; }
    .rep-side { align-items: center; text-align: center; }
    .rep-head .rep-date-time { text-align: center; }
    .legend-details .legend-grid span { white-space: normal; }
    .signatures-table td { padding: 0 6px; }
  }

  body.cupom .rep-head { grid-template-columns: 1fr; gap: 1mm; text-align: center; }
  body.cupom .rep-head .rep-logo-wrap { justify-content: center; }
  body.cupom .rep-titles, body.cupom .rep-side { text-align: center; align-items: center; }
  body.cupom .rep-head .classification-rule { border: 0; padding: 0; background: none; }

  /* A4 com margem real; o número da página sai na margem inferior, com o total real de folhas contado pelo navegador */
  @page {
    size: A4 portrait;
    margin: 10mm 12mm 14mm;

  @page portrait {
    size: A4 portrait;
    margin: 10mm 12mm 14mm;
    @bottom-left { content: "Kartódromo Internacional de Betim · cronometragem oficial"; font: 7pt system-ui, "Segoe UI", sans-serif; color: #555; }

  }
  @page landscape {
    size: A4 landscape;
    margin: 10mm 12mm 14mm;

    @bottom-right { content: "Página " counter(page) " de " counter(pages); font: 7pt system-ui, "Segoe UI", sans-serif; color: #555; }
  }
  @page thermal { size: 72mm auto; margin: 0; }
  @media print {
    html, body { background: #fff !important; }
    body { color: #000 !important; font-size: 8.5pt; line-height: 1.3; }
    .tools, .report-alert, #loadStatus { display: none !important; }

    /* relatórios longos (passagens, volta a volta, mapas) ficam compactos; o resultado oficial tem letra maior */
    table.rdlc-table { min-width: 0 !important; font-size: 7.2pt; line-height: 1.15; }
    table.rdlc-table thead { display: table-header-group; }

    .legend-details { font-size: 7.5pt; line-height: 1.45; break-inside: avoid; color: #333; }

  }
</style>

<body>

<div class="tools" id="toolsBar" role="toolbar" aria-label="Ações do relatório">
  <div class="tool-context">
    <label for="tipoSelect">Relatório</label>
    <select id="tipoSelect" aria-label="Tipo de relatório" onchange="mudarTipo(this.value)">

        <option value="resultados_oficiais">Resultados oficiais</option>
        <option value="sem_velocidade">Resultados oficiais · sem velocidade média</option>

        <option value="ordem_chegada">Resultados oficiais · ordem de chegada</option>
        <option value="ordem_chegada_categoria">Resultados oficiais · chegada por categoria</option>

      <optgroup label="Passagens e voltas">
        <option value="passagens">Relatório de passagens</option>
        <option value="volta_a_volta">Volta a volta · todos</option>
        <option value="mapa_voltas">Mapa de voltas · todos</option>

      </optgroup>
      <optgroup label="Grid de largada">
        <option value="grid_2col_esq">Grid · 2 colunas · líder à esquerda</option>
        <option value="grid_2col_dir">Grid · 2 colunas · líder à direita</option>
        <option value="grid_3col_esq">Grid · 3 colunas · líder à esquerda</option>

  <button type="button" class="primary" onclick="window.print()">
    <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9V3h12v6h1a3 3 0 0 1 3 3v5h-4v4H6v-4H2v-5a3 3 0 0 1 3-3h1Zm2-4v4h8V5H8Zm8 14v-5H8v5h8Zm2-5h2v-2a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v2h2v-2h12v2Z"/></svg>

  </button>
  <button type="button" onclick="imprimirCupom()">
    <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2Zm0 3v11.26l1-.67 3 2 3-2 3 2 3-2 1 .67V6H5Zm2 2h10v2H7V8Zm0 4h10v2H7v-2Zm0 4h6v2H7v-2Z"/></svg>

  <div class="right">

<main class="sheet-page portrait" id="sheetContainer">
  <!-- Cabeçalho Oficial -->
  <!-- logo | evento (título) + prova, data e traçado | critério e emissão -->
  <div class="rep-header">
    <div class="rep-head">

          <div class="sign-line">Diretor de Prova</div>

        <td>
          <div class="sign-line">Comissário Desportivo</div>
          <div class="sign-field">Nome<span></span></div>
          <div class="sign-field">Data<span></span></div>
        </td>
        <td>
          <div class="sign-line">Cronometragem</div>
          <div class="sign-field">Nome<span></span></div>
          <div class="sign-field">Data<span></span></div>

    <!-- na impressão o número da página sai na margem (@page), com o total real de páginas -->
    <div class="page-num-line" id="pageNumLine">Kartódromo Internacional de Betim · cronometragem oficial</div>

<script>
const params = new URLSearchParams(location.search);
const rawTipo = params.get('tipo') || params.get('type') || 'resultados_oficiais';
const tipoAlias = {
  'PassingReport': 'passagens',
  'LapToLapReport': 'volta_a_volta',
  'LapMapReport': 'mapa_voltas',
  'RacingMapAllReport': 'mapa_prova',
  'TimingOfficialReport': 'resultados_oficiais',
  'TimingOfficialReportWithoutSpeed': 'sem_velocidade',
  'TimingOfficialReportWithAvgTime': 'com_tempo_medio',
  'TimingOfficialReportArrivalOrder': 'ordem_chegada',
  'TimingOfficialReportArrivalOrderWithCategory': 'ordem_chegada_categoria',
  'GridLeftReport': 'grid_2col_esq',
  'GridRightReport': 'grid_2col_dir',
  'GridLeftReport3': 'grid_3col_esq',
  'GridRightReport3': 'grid_3col_dir'
};
let currentTipo = tipoAlias[rawTipo] || rawTipo;
const sessionId = location.pathname.split('/').filter(Boolean).pop();

if (document.getElementById('tipoSelect')) {
  document.getElementById('tipoSelect').value = currentTipo;
}

// Campo sem dado: um traço só, discreto (antes "---").
const VAZIO = '–';

// Tempos no padrão da cronometragem, sem zeros à esquerda: "53.550", "1:01.166", "1:02:03.456".
const tempoCompacto = (ms) => {
  const total = Math.round(Math.abs(ms));
  const h = Math.floor(total / 3600000);
  const m = Math.floor((total % 3600000) / 60000);
  const s = ((total % 60000) / 1000).toFixed(3);
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${s.padStart(6, '0')}`;
  if (m > 0) return `${m}:${s.padStart(6, '0')}`;
  return s;
};

const fmtMs = (ms) => {
  if (ms == null || isNaN(ms) || ms <= 0) return VAZIO;
  return tempoCompacto(ms);
};

const fmtTotal = fmtMs;

// Diferença sempre com sinal: "+0.002", "+1:02.003".
const fmtDiff = (ms) => {
  if (ms == null || isNaN(ms)) return VAZIO;
  return '+' + tempoCompacto(Math.max(0, ms));
};

// Velocidade em português: "63,38".
const fmtVel = (kmh) => {
  const n = Number(kmh);
  if (!kmh || !Number.isFinite(n) || n <= 0) return VAZIO;
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const cleanText = (s) => String(s ?? '').replace(/[�]/g, '').trim();

const esc = (s) => cleanText(s).replace(/[&<>"]/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;'
}[c]));

let sessionData = null;
let passingsData = [];
let lapsData = [];
const dataState = { session: 'loading', passings: 'loading', laps: 'loading' };
const dataErrors = {};

function getResultadoCriterio(sessionType) {
  if (sessionType === 'corrida') return { label: 'CLASSIFICAÇÃO OFICIAL', detail: 'ordem de chegada' };
  if (sessionType === 'classificacao') return { label: 'TOMADA DE TEMPO', detail: 'melhor volta' };
  return { label: 'TREINO', detail: 'melhor volta' };
}

function calcularPaginasRelatorio(contentHeight, pageHeight) {
  const height = Number(contentHeight);
  const page = Number(pageHeight);
  if (!Number.isFinite(height) || height <= 0 || !Number.isFinite(page) || page <= 0) return 1;
  return Math.max(1, Math.ceil(height / page));
}

function obterUltimaFoto(row) {
  const value = row?.lastPhoto ?? row?.lastPhotoNumber;
  return Number.isFinite(Number(value)) ? Number(value) : null;
}

function formatarDataHora(value) {
  const date = new Date(value);
  if (!value || Number.isNaN(date.getTime())) return VAZIO;
  return new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'medium' }).format(date);
}

function normalizarColecao(payload, label) {
  if (Array.isArray(payload)) return payload;
  if (payload && Array.isArray(payload.value)) return payload.value;
  throw new Error(`Resposta inválida para ${label}.`);
}

function erroTexto(error) {
  return error instanceof Error ? error.message : String(error || 'erro desconhecido');
}

function setLoadStatus(message, state = 'loading') {
  const status = document.getElementById('loadStatus');
  if (!status) return;
  status.textContent = message;
  status.className = `report-loading report-loading--${state}`;
  status.hidden = state === 'ready';
}

function setStatusBadge(text, state = 'active') {
  const badge = document.getElementById('sessionStatusBadge');
  if (!badge) return;
  badge.textContent = text;
  badge.className = `status-badge status-badge--${state}`;
}

function atualizarRegraVisual(sessionType = sessionData?.type) {
  const rule = document.getElementById('classificationRule');
  if (!rule) return;
  if (!sessionType) { rule.innerHTML = ''; return; } // sem sessão carregada não inventa "TREINO · melhor volta"
  // o tipo da prova já está no topo do cabeçalho; aqui fica só o critério de classificação
  const criterio = getResultadoCriterio(sessionType);
  rule.innerHTML = `<span>Classificação por</span> <strong>${esc(criterio.detail)}</strong>`;
}

const NOMES_RELATORIO = {
  resultados_oficiais: 'Resultado oficial',
  sem_velocidade: 'Resultado oficial',
  com_tempo_medio: 'Resultado oficial',
  ordem_chegada: 'Ordem de chegada',
  ordem_chegada_categoria: 'Ordem de chegada por categoria',
  passagens: 'Passagens',
  volta_a_volta: 'Volta a volta',
  mapa_voltas: 'Mapa de voltas',
  mapa_prova: 'Mapa de prova'
};

function nomeRelatorio(tipo = currentTipo) {
  if (String(tipo).startsWith('grid_')) return 'Grid de largada';
  return NOMES_RELATORIO[tipo] || 'Resultado oficial';
}

const cabecalho = { evento: '', prova: '', data: '' };

// Topo do cabeçalho ("RESULTADO OFICIAL · TOMADA DE TEMPO"), título da janela e nome sugerido do arquivo.
function atualizarIdentificacao() {
  if (!sessionData) return;
  const relatorio = nomeRelatorio();
  const kicker = document.getElementById('hdrSub1');
  if (kicker) kicker.textContent = [relatorio, cabecalho.prova].filter(Boolean).join(' · ');
  document.title = [relatorio, cabecalho.evento, cabecalho.prova].filter(Boolean).join(' · ');
  // a Recepção/Cronometragem usam este nome ao exportar o PDF: data da prova, não a de emissão
  window.nomeArquivoRelatorio = [relatorio, cabecalho.evento, cabecalho.prova, cabecalho.data]
    .filter(Boolean).join(' - ').replace(/[\\/:*?"<>|·]+/g, ' ').replace(/\s+/g, ' ').trim();
}

function atualizarOrientacao(tipo) {
  const sheet = document.getElementById('sheetContainer');
  if (!sheet) return;
  const landscape = ['mapa_voltas', 'mapa_prova'].includes(tipo);
  sheet.className = `sheet-page ${landscape ? 'landscape' : 'portrait'}`;
}

function bindRetryButton() {
  const button = document.getElementById('retryReportButton');
  if (button) button.onclick = () => carregarTudo();
}

function renderReportLoadError(error) {
  const content = document.getElementById('reportContent');
  const notes = document.getElementById('notesContainer');
  if (!content) return;
  if (notes) notes.innerHTML = '';
  // sem sessão, o cabeçalho não pode ficar com textos de exemplo ("TOMADA DE TEMPO", "TREINO melhor volta")
  for (const [id, txt] of [['hdrSub1', ''], ['hdrSub2', 'Resultado indisponível'], ['hdrSub3', ''], ['classificationRule', '']]) {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
  }
  content.innerHTML = `<section class="report-alert report-alert--error" role="alert">
    <div><h2>Não foi possível carregar o relatório</h2><p>${esc(erroTexto(error))}</p></div>
    <button type="button" class="retry-button" id="retryReportButton">Tentar novamente</button>
  </section>`;
  bindRetryButton();
}

function renderDataWarnings() {
  const content = document.getElementById('reportContent');
  if (!content) return;
  content.querySelector('#dataWarnings')?.remove();
  const sourceLabels = { passings: 'Passagens', laps: 'Voltas', session: 'Sessão' };
  const failures = Object.entries(dataErrors)
    .filter(([, message]) => message)
    .map(([source, message]) => `${sourceLabels[source] || source}: ${message}`);
  if (!failures.length) return;

  content.insertAdjacentHTML('afterbegin', `<div class="report-alert" id="dataWarnings" role="alert">
    <div><h2>Dados técnicos indisponíveis</h2><p>${esc(failures.join(' '))} Os campos dependentes foram marcados como indisponíveis.</p></div>
    <button type="button" class="retry-button" id="retryReportButton">Tentar novamente</button>
  </div>`);
  bindRetryButton();
}

function aprimorarTabelas() {
  document.querySelectorAll('#reportContent table.rdlc-table').forEach((table, index) => {
    table.querySelectorAll('thead th').forEach(th => th.setAttribute('scope', 'col'));
    if (!table.querySelector('caption')) {
      const caption = document.createElement('caption');
      caption.className = 'sr-only';
      caption.textContent = `Tabela de resultados ${index + 1}`;
      table.prepend(caption);
    }
  });
}

// Na impressão o "Página X de Y" real sai na margem da folha (@page @bottom-right, contado pelo navegador).
// Na tela a linha do rodapé só identifica o documento (a estimativa "Páginas 1–2 (estimadas)" saía errada no PDF).
function atualizarPaginacao() {
  const line = document.getElementById('pageNumLine');
  if (line) line.textContent = 'Kartódromo Internacional de Betim · cronometragem oficial';
}

function finalizarRenderReport() {
  renderDataWarnings();
  aprimorarTabelas();
  atualizarPaginacao();
}

function mudarTipo(novoTipo) {
  currentTipo = novoTipo;
  const newUrl = new URL(location.href);
  newUrl.searchParams.set('tipo', novoTipo);
  history.replaceState(null, '', newUrl.toString());

  atualizarOrientacao(novoTipo);
  atualizarRegraVisual();
  atualizarIdentificacao();
  renderReport();
}

function imprimirCupom() {
  document.body.classList.add('cupom');
  window.print();
  document.body.classList.remove('cupom');
}

async function fetchJson(url, label) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${label} indisponível (HTTP ${response.status}).`);
  return response.json();
}

async function carregarTudo() {
  setLoadStatus('Carregando sessão e dados da cronometragem…');
  setStatusBadge('Carregando sessão…', 'active');
  dataState.session = 'loading';
  dataState.passings = 'loading';
  dataState.laps = 'loading';
  delete dataErrors.session;
  delete dataErrors.passings;
  delete dataErrors.laps;

  try {
    const session = await fetchJson('/api/sessions/' + sessionId, 'Sessão');
    if (!session || !Array.isArray(session.standings)) throw new Error('A sessão não trouxe a classificação oficial.');
    sessionData = session;
    dataState.session = 'ready';

    const auxiliary = await Promise.allSettled([
      fetchJson(`/api/sessions/${sessionId}/passings`, 'Passagens'),
      fetchJson(`/api/sessions/${sessionId}/laps`, 'Voltas')
    ]);
    const [passingsResult, lapsResult] = auxiliary;

    if (passingsResult.status === 'fulfilled') {
      try {
        passingsData = normalizarColecao(passingsResult.value, 'passagens');
        dataState.passings = 'ready';
      } catch (error) {
        passingsData = [];
        dataState.passings = 'error';
        dataErrors.passings = erroTexto(error);
      }
    } else {
      passingsData = [];
      dataState.passings = 'error';
      dataErrors.passings = erroTexto(passingsResult.reason);
    }
    if (lapsResult.status === 'fulfilled') {
      try {
        lapsData = normalizarColecao(lapsResult.value, 'voltas');
        dataState.laps = 'ready';
      } catch (error) {
        lapsData = [];
        dataState.laps = 'error';
        dataErrors.laps = erroTexto(error);
      }
    } else {
      lapsData = [];
      dataState.laps = 'error';
      dataErrors.laps = erroTexto(lapsResult.reason);
    }

    preencherCabecalho();
    mudarTipo(currentTipo);
    setLoadStatus('Dados atualizados.', 'ready');
  } catch (error) {
    sessionData = null;
    dataState.session = 'error';
    dataErrors.session = erroTexto(error);
    setLoadStatus('Falha ao carregar a sessão.', 'error');
    setStatusBadge('Falha ao carregar', 'error');
    renderReportLoadError(error);
  }
}

function preencherCabecalho() {
  const v = sessionData;
  if (!v) return;
  const TYPES = { treino: 'TREINO LIVRE', classificacao: 'TOMADA DE TEMPO', corrida: 'CORRIDA' };

  // "LEGENDS I · Tomada de Tempo": o evento é o título; a prova vai no topo, junto do tipo de relatório
  let grpName = 'Bateria';
  let raceName = TYPES[v.type] || 'Corrida';

  if (v.name) {
    const raw = cleanText(v.name);
    const parts = raw.split(/\s[·\-–]\s|·/).map(p => cleanText(p)).filter(Boolean);
    if (parts.length >= 2) {
      grpName = parts[0];
      raceName = parts.slice(1).join(' · ');
    } else {
      grpName = raw;
    }
  }

  const inicio = dataValida(v.startedAt || v.greenAt || v.createdAt);
  const fim = dataValida(v.finishedAt || v.checkeredAt);
  const fmtData = (d) => new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(d);
  const fmtHora = (d) => new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(d);
  const fmtSemana = (d) => new Intl.DateTimeFormat('pt-BR', { weekday: 'long' }).format(d);
  let quando = 'Data da prova não registrada';
  if (inicio) {
    quando = `${fmtData(inicio)} (${fmtSemana(inicio)})`;
    if (fim && fmtData(fim) !== fmtData(inicio)) quando += ` · das ${fmtHora(inicio)} de ${fmtData(inicio)} às ${fmtHora(fim)} de ${fmtData(fim)}`;
    else if (fim) quando += ` · das ${fmtHora(inicio)} às ${fmtHora(fim)}`;
    else quando += ` · início às ${fmtHora(inicio)}, em andamento`;
  }
  const pilotos = (v.standings || []).length;

  cabecalho.evento = grpName;
  cabecalho.prova = raceName;
  cabecalho.data = inicio ? `${inicio.getFullYear()}-${String(inicio.getMonth() + 1).padStart(2, '0')}-${String(inicio.getDate()).padStart(2, '0')}` : '';

  document.getElementById('hdrTitle').textContent = grpName;
  document.getElementById('hdrSub2').textContent = quando;
  document.getElementById('hdrSub3').textContent = `Traçado principal · 1.110 m · ${pilotos} ${pilotos === 1 ? 'piloto' : 'pilotos'}`;
  const agora = new Date();
  document.getElementById('hdrDateTime').textContent = `Emitido em ${fmtData(agora)} às ${fmtHora(agora)}`;
  atualizarRegraVisual(v.type);
  atualizarIdentificacao();

  const state = v.state === 'encerrada' ? 'closed' : v.state === 'em_andamento' ? 'active' : 'active';
  setStatusBadge(`${v.state?.toUpperCase() || 'SEM ESTADO'} · ${pilotos} competidores`, state);
}

function dataValida(value) {
  if (!value) return null;
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

function ordenarResultadoOficial(rows, tipo, sessionType) {
  const list = [...rows];
  const corrida = sessionType === 'corrida';
  const ordemChegada = tipo.includes('ordem_chegada');

  if (corrida) {
    // O motor já entregou a posição oficial da corrida (voltas + chegada na linha).
    // O relatório não pode recalcular essa posição pela melhor volta nem pelo tempo total.
    list.sort((a, b) => {
      const posA = Number(a.position);
      const posB = Number(b.position);
      if (Number.isFinite(posA) && Number.isFinite(posB) && posA !== posB) return posA - posB;
      if (b.laps !== a.laps) return b.laps - a.laps;
      return (a.lastCrossingWallMs ?? Number.MAX_SAFE_INTEGER) - (b.lastCrossingWallMs ?? Number.MAX_SAFE_INTEGER);
    });
  } else if (ordemChegada) {
    list.sort((a, b) => (b.laps - a.laps) || ((a.totalMs || 0) - (b.totalMs || 0)));
  } else {
    // Tomada de tempo/treino: a melhor volta é o critério oficial.
    list.sort((a, b) => {
      if (!a.bestLapTime) return 1;
      if (!b.bestLapTime) return -1;
      return a.bestLapTime - b.bestLapTime || ((a.bestLapTime2nd || 0) - (b.bestLapTime2nd || 0));
    });
  }

  list.forEach((row, index) => {
    row.pos = corrida && Number.isFinite(Number(row.position)) ? Number(row.position) : index + 1;
  });
  return list;
}

function renderReport() {
  if (!sessionData) return;
  const v = sessionData;
  const standings = v.standings || [];
  const content = document.getElementById('reportContent');
  const notes = document.getElementById('notesContainer');
  notes.innerHTML = '';

  try {

  // Processa estatísticas estendidas com voltas (2ª melhor volta, etc.)
  const driverLapsMap = {};
  lapsData.forEach(d => {
    driverLapsMap[String(d.kart)] = d.laps || [];
  });

  const enriched = standings.map(s => {
    const kLaps = driverLapsMap[String(s.kart)] || [];
    const validLaps = kLaps.filter(l => !l.invalid && l.lapMs > 0).sort((a, b) => a.lapMs - b.lapMs);
    const best1 = validLaps[0];
    const best2 = validLaps[1];

    const totalLaps = s.laps || kLaps.length || 0;
    const avgMs = totalLaps > 0 && s.totalMs ? Math.round(s.totalMs / totalLaps) : null;

    return {
      ...s,
      bestLap: s.bestLapNumber || (best1 ? best1.lap : null),
      bestLapTime: s.bestLapMs || (best1 ? best1.lapMs : null),
      bestLap2nd: best2 ? best2.lap : null,
      bestLapTime2nd: best2 ? best2.lapMs : null,
      lastLapTime: s.lastLapMs || (kLaps.length > 0 ? kLaps[kLaps.length - 1].lapMs : null),
      avgLapTime: avgMs,
      // UF só pode exibir uma foto real fornecida pelo cronômetro; posição não é foto.
      uf: obterUltimaFoto(s) ?? VAZIO,
      status: s.racingStatus || 0
    };
  });

  // Melhores voltas gerais da sessão
  let melhorGeral = null;
  enriched.forEach(r => {
    if (r.bestLapTime && (!melhorGeral || r.bestLapTime < melhorGeral.bestLapTime)) {
      melhorGeral = r;
    }
  });

  // 1 a 5: RELATÓRIOS OFICIAIS DE CLASSIFICAÇÃO
  if (['resultados_oficiais', 'sem_velocidade', 'com_tempo_medio', 'ordem_chegada', 'ordem_chegada_categoria'].includes(currentTipo)) {
    const isArrival = currentTipo.includes('ordem_chegada') || v.type === 'corrida';
    const list = ordenarResultadoOficial(enriched, currentTipo, v.type);

    const leader = list[0];

    // Diferenças para o líder e para o anterior, sempre com sinal ("+0.002", "+1 volta")
    const voltasAtras = (n) => (n === 1 ? '+1 volta' : `+${n} voltas`);
    list.forEach((r, idx) => {
      if (idx === 0) {
        r.diffLeaderStr = VAZIO;
        r.diffPrevStr = VAZIO;
      } else {
        const prev = list[idx - 1];
        if (isArrival) {
          // Diferença medida NA LINHA DE CHEGADA (gapMs do servidor). O tempo total de cada kart conta da largada
          // dele, então totalMs - totalMs do anterior dava valores negativos (ex.: "-1:59.824" em 30/09).
          const gapLider = (x) => (x === leader ? 0 : (x.gapMs ?? null));
          const lapsBehindLeader = (leader.laps || 0) - (r.laps || 0);
          if (lapsBehindLeader >= 1) r.diffLeaderStr = voltasAtras(lapsBehindLeader);
          else if (gapLider(r) !== null) r.diffLeaderStr = fmtDiff(gapLider(r));
          else if (r.totalMs && leader.totalMs) r.diffLeaderStr = fmtDiff(r.totalMs - leader.totalMs);
          else r.diffLeaderStr = VAZIO;

          const lapsBehindPrev = (prev.laps || 0) - (r.laps || 0);
          if (lapsBehindPrev >= 1) r.diffPrevStr = voltasAtras(lapsBehindPrev);
          else if (gapLider(r) !== null && gapLider(prev) !== null) r.diffPrevStr = fmtDiff(gapLider(r) - gapLider(prev));
          else if (r.totalMs && prev.totalMs) r.diffPrevStr = fmtDiff(r.totalMs - prev.totalMs);
          else r.diffPrevStr = VAZIO;
        } else {
          // Tomada de tempo / Melhor volta
          r.diffLeaderStr = (r.bestLapTime && leader.bestLapTime) ? fmtDiff(r.bestLapTime - leader.bestLapTime) : VAZIO;
          r.diffPrevStr = (r.bestLapTime && prev.bestLapTime) ? fmtDiff(r.bestLapTime - prev.bestLapTime) : VAZIO;
        }
      }
    });

    // Colunas com nome por extenso (sem siglas) e só as que fazem sentido para o tipo de prova:
    // tomada/treino não mostra tempo total; "última foto" só aparece quando o cronômetro fornece.
    const showSpeed = currentTipo !== 'sem_velocidade';
    const showCatCol = currentTipo === 'ordem_chegada_categoria';
    const showAvg = currentTipo === 'com_tempo_medio';
    const showFoto = list.some(r => r.uf !== VAZIO);
    const resultSecondary = isArrival ? 'result-secondary' : '';
    const posDisplay = (r) => r.status === 1 ? 'NC' : r.status === 2 ? 'EX' : r.status === 3 ? 'DC' : r.pos;
    const melhorCelula = (r) => {
      const t = fmtMs(r.bestLapTime);
      return melhorGeral && r.kart === melhorGeral.kart && r.bestLapTime
        ? `<span class="c-best" title="Melhor volta da sessão">${t}</span>`
        : t;
    };

    const C = {
      pos: { h: 'Pos.', cls: 'col-pos', td: posDisplay },
      kart: { h: 'Kart', cls: 'col-kart', td: r => `<span class="kart-num">${esc(r.kart)}</span>` },
      nome: { h: 'Piloto', cls: 'col-nome', td: r => esc(r.name) },
      cat: { h: 'Categoria', cls: 'col-cat', td: r => esc(r.category || 'Geral') },
      melhor: { h: 'Melhor<br>volta', cls: `col-num ${resultSecondary}`, td: melhorCelula },
      naVolta: { h: 'Na<br>volta', cls: `col-num col-curta ${resultSecondary}`, td: r => r.bestLap || VAZIO },
      difLider: { h: 'Dif.<br>líder', cls: 'col-num', td: r => r.diffLeaderStr },
      difAnt: { h: 'Dif.<br>anterior', cls: 'col-num hide-cupom screen-secondary', td: r => r.diffPrevStr },
      voltas: { h: 'Voltas', cls: 'col-num col-curta', td: r => r.laps || 0 },
      total: { h: 'Tempo<br>total', cls: 'col-num hide-cupom', td: r => fmtTotal(r.totalMs) },
      ultima: { h: 'Última<br>volta', cls: 'col-num hide-cupom screen-secondary', td: r => fmtMs(r.lastLapTime) },
      segunda: { h: '2ª<br>melhor', cls: 'col-num hide-cupom screen-secondary', td: r => fmtMs(r.bestLapTime2nd) },
      naVolta2: { h: 'Na<br>volta', cls: 'col-num col-curta hide-cupom screen-secondary', td: r => r.bestLap2nd || VAZIO },
      media: { h: 'Tempo<br>médio', cls: 'col-num hide-cupom screen-secondary', td: r => fmtMs(r.avgLapTime) },
      vel: { h: 'Vel.<br>km/h', cls: 'col-num hide-cupom screen-secondary', td: r => fmtVel(r.averageSpeedKmh) },
      foto: { h: 'Última<br>foto', cls: 'col-num hide-cupom screen-secondary', td: r => esc(r.uf) }
    };
    const cols = [C.pos, C.kart, C.nome];
    if (showCatCol) cols.push(C.cat);
    if (isArrival) cols.push(C.voltas, C.total, C.difLider, C.difAnt, C.melhor, C.naVolta, C.ultima);
    else cols.push(C.melhor, C.naVolta, C.difLider, C.difAnt, C.voltas, C.segunda, C.naVolta2, C.ultima);
    if (showAvg) cols.push(C.media);
    if (showSpeed) cols.push(C.vel);
    if (showFoto) cols.push(C.foto);

    let html = `<table class="rdlc-table rdlc-resultado"><thead><tr>`;
    cols.forEach(c => { html += `<th class="${c.cls}">${c.h}</th>`; });
    html += `</tr></thead><tbody>`;
    list.forEach(r => {
      html += `<tr${r.pos === 1 ? ' class="row-lider"' : ''}>`;
      cols.forEach(c => { html += `<td class="${c.cls}${c === C.nome && String(r.name || '').length > 38 ? ' nome-longo' : ''}">${c.td(r)}</td>`; });
      html += `</tr>`;
    });
    if (!list.length) html += `<tr><td class="col-vazio" colspan="${cols.length}">Nenhum piloto registrado nesta sessão.</td></tr>`;
    html += `</tbody></table>`;
    content.innerHTML = html;

    // Resumo: melhor volta com kart e volta (informação que a tabela não mostra de uma vez) e "como ler"
    let notesHtml = `<div class="rdlc-notes-box">`;
    if (melhorGeral && melhorGeral.bestLapTime) {
      const partes = [`<strong>${fmtMs(melhorGeral.bestLapTime)}</strong>`, esc(melhorGeral.name), `kart ${esc(melhorGeral.kart)}`];
      if (melhorGeral.bestLap) partes.push(`na volta ${melhorGeral.bestLap}`);
      notesHtml += `<div class="rdlc-bestlap-note"><span class="nota-rotulo">Melhor volta da sessão</span> ${partes.join(' · ')}</div>`;
    }
    const comoLer = [
      ['Na volta', 'número da volta em que o tempo foi feito'],
      ['Dif. líder', isArrival ? 'distância para o 1º colocado na chegada' : 'diferença de melhor volta para o 1º colocado'],
      ['Dif. anterior', isArrival ? 'distância para o piloto da posição acima' : 'diferença para o piloto da posição acima'],
      ...(isArrival ? [] : [['2ª melhor', 'segundo melhor tempo do piloto']]),
      ...(showAvg ? [['Tempo médio', 'média das voltas do piloto']] : []),
      ...(showSpeed ? [['Vel.', 'velocidade média do piloto na sessão, em km/h']] : []),
      ['NC / EX / DC', 'não classificado / excluído / desclassificado']
    ];
    notesHtml += `
      <div class="legend-details">
        <span class="nota-rotulo">Como ler</span>
        <span class="legend-grid">${comoLer.map(([k, d]) => `<span><strong>${k}</strong> ${d}</span>`).join('')}</span>
        ${isArrival ? '<div class="criterion-note">Critério: ordem de chegada; a melhor volta é apenas informativa.</div>' : ''}
      </div>
    </div>`;
    notes.innerHTML = notesHtml;
  }
  // 6: RELATÓRIO DE PASSAGENS (PassingReport.rdlc)
  else if (currentTipo === 'passagens') {
    if (!passingsData.length) {
      const message = dataState.passings === 'error'
        ? 'Dados de passagens indisponíveis no momento.'
        : 'Nenhuma passagem registrada para esta sessão.';
      content.innerHTML = `<div class="report-empty">${message}</div>`;
      return;
    }
    let html = `<table class="rdlc-table"><thead><tr>
      <th style="width: 40px;">ID</th>
      <th style="width: 35px;">#</th>
      <th class="c-left">Competidor</th>
      <th class="c-left" style="width: 80px;">Categoria</th>
      <th style="width: 35px;">VLT</th>
      <th class="c-right" style="width: 65px;">TV</th>
      <th class="c-right" style="width: 75px;">TT</th>
      <th style="width: 35px;">MV</th>
      <th class="c-right" style="width: 65px;">TMV</th>
      <th class="c-right" style="width: 50px;">Km/h</th>
    </tr></thead><tbody>`;

    // Mantém mapa de melhor volta do competidor até a passagem atual
    const bestByKart = {};

    passingsData.forEach((p, idx) => {
      const k = String(p.kart);
      const lapNum = p.lap && p.lap > 0 ? p.lap : null;
      if (p.lapMs && p.lapMs > 0 && !p.invalid) {
        if (!bestByKart[k] || p.lapMs < bestByKart[k].time) {
          bestByKart[k] = { lap: lapNum || 1, time: p.lapMs };
        }
      }
      const bInfo = bestByKart[k];
      const speed = fmtVel(p.speed || p.averageSpeedKmh);

      const elapsed = (p.wallMs && sessionData.startedAt) ? Math.max(0, p.wallMs - sessionData.startedAt) : (p.elapsedMs || 0);

      html += `<tr>
        <td class="c-center">${p.sequence || (idx + 1)}</td>
        <td class="c-center c-bold">${esc(p.kart)}</td>
        <td class="c-left">${esc(p.name || VAZIO)}</td>
        <td class="c-left">${esc(p.category || 'GERAL')}</td>
        <td class="c-center">${lapNum || VAZIO}</td>
        <td class="c-right c-bold">${fmtMs(p.lapMs)}</td>
        <td class="c-right">${fmtTotal(elapsed)}</td>
        <td class="c-center">${bInfo ? bInfo.lap : VAZIO}</td>
        <td class="c-right">${bInfo ? fmtMs(bInfo.time) : VAZIO}</td>
        <td class="c-right">${speed}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    content.innerHTML = html;

    notes.innerHTML = `
      <div class="rdlc-notes-box">
        <table class="rdlc-legend">
          <tr>
            <th>Legenda:</th>
            <td><strong>ID:</strong> Sequencial Passagem</td>
            <td><strong>#:</strong> Nº Kart</td>
            <td><strong>Competidor:</strong> Nome Piloto</td>
            <td><strong>Categoria:</strong> Categoria</td>
            <td><strong>VLT:</strong> Volta da Passagem</td>
            <td><strong>TV:</strong> Tempo da Volta</td>
            <td><strong>TT:</strong> Tempo Total Decorrido</td>
            <td><strong>MV:</strong> Melhor Volta do Piloto até ali</td>
            <td><strong>TMV:</strong> Tempo da Melhor Volta</td>
            <td><strong>Km/h:</strong> Velocidade Média</td>
          </tr>
        </table>
      </div>`;
  }
  // 7: VOLTA A VOLTA - TODOS (LapToLapReport.rdlc)
  else if (currentTipo === 'volta_a_volta') {
    if (!lapsData.length) {
      const message = dataState.laps === 'error'
        ? 'Dados de voltas indisponíveis no momento.'
        : 'Nenhuma volta registrada para esta sessão.';
      content.innerHTML = `<div class="report-empty">${message}</div>`;
      return;
    }
    let html = `<div>`;
    lapsData.forEach(d => {
      const kLaps = d.laps || [];
      const validLaps = kLaps.filter(l => !l.invalid && l.lapMs > 0);
      const minLap = validLaps.reduce((min, l) => l.lapMs < min ? l.lapMs : min, Infinity);

      html += `<div class="lap-to-lap-driver">
        <div class="lap-to-lap-header">
          Competidor: <strong>${esc(d.name || VAZIO)}</strong> &nbsp;&nbsp;|&nbsp;&nbsp; Kart: <strong>#${esc(d.kart)}</strong> &nbsp;&nbsp;|&nbsp;&nbsp; Categoria: <strong>${esc(d.category || 'GERAL')}</strong>
        </div>
        <table class="rdlc-table"><thead><tr>
          <th style="width: 35px;">#</th>
          <th style="width: 35px;">VLT</th>
          <th class="c-right" style="width: 65px;">TV</th>
          <th class="c-right" style="width: 65px;">DMV</th>
          <th class="c-right" style="width: 65px;">DLCAT</th>
          <th class="c-right" style="width: 75px;">TT</th>
          <th class="c-right" style="width: 65px;">VM (Km/h)</th>
          <th class="c-left">Penalidades:</th>
        </tr></thead><tbody>`;

      let cumMs = 0;
      kLaps.forEach((l, idx) => {
        cumMs += l.lapMs || 0;
        const dmv = (l.lapMs && minLap !== Infinity) ? (l.lapMs === minLap ? '0.000' : fmtDiff(l.lapMs - minLap)) : VAZIO;
        const dlcat = (melhorGeral && l.lapMs) ? (l.lapMs === melhorGeral.bestLapTime ? '0.000' : fmtDiff(l.lapMs - melhorGeral.bestLapTime)) : VAZIO;
        const speed = fmtVel(l.speed || l.averageSpeedKmh);
        const isBest = l.lapMs === minLap;

        html += `<tr>
          <td class="c-center">${esc(d.kart)}</td>
          <td class="c-center">${l.lap || (idx + 1)}</td>
          <td class="c-right ${isBest ? 'c-best' : ''}">${fmtMs(l.lapMs)}</td>
          <td class="c-right">${dmv}</td>
          <td class="c-right">${dlcat}</td>
          <td class="c-right">${fmtTotal(l.elapsedMs || cumMs)}</td>
          <td class="c-right">${speed}</td>
          <td class="c-left">${esc(l.penalty || '')}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    });
    html += `</div>`;
    content.innerHTML = html;
  }
  // 8: MAPA DE VOLTAS - TODOS (LapMapReport.rdlc)
  else if (currentTipo === 'mapa_voltas') {
    if (!lapsData.length) {
      const message = dataState.laps === 'error'
        ? 'Dados de voltas indisponíveis no momento.'
        : 'Nenhuma volta registrada.';
      content.innerHTML = `<div class="report-empty">${message}</div>`;
      return;
    }
    const maxLaps = Math.max(...lapsData.map(d => (d.laps || []).length), 1);
    let html = `<div style="overflow-x: auto;"><table class="rdlc-table"><thead><tr>
      <th style="width: 35px;">#</th>
      <th class="c-left" style="width: 140px;">Competidor</th>
      <th class="c-left" style="width: 60px;">Cat</th>`;
    for (let i = 1; i <= maxLaps; i++) html += `<th style="width: 55px;">V${i}</th>`;
    html += `<th class="c-right" style="width: 60px;">TMV</th></tr></thead><tbody>`;

    lapsData.forEach(d => {
      const map = {};
      (d.laps || []).forEach(l => map[l.lap] = l);
      const minLap = (d.laps || []).filter(l => !l.invalid && l.lapMs > 0).reduce((min, l) => l.lapMs < min ? l.lapMs : min, Infinity);

      html += `<tr>
        <td class="c-center c-bold">${esc(d.kart)}</td>
        <td class="c-left">${esc(d.name)}</td>
        <td class="c-left">${esc(d.category || 'GERAL')}</td>`;
      for (let i = 1; i <= maxLaps; i++) {
        const item = map[i];
        if (!item || !item.lapMs) {
          html += `<td class="c-center">${VAZIO}</td>`;
        } else {
          const isBest = item.lapMs === minLap;
          html += `<td class="c-right ${isBest ? 'c-best' : ''}">${fmtMs(item.lapMs)}</td>`;
        }
      }
      html += `<td class="c-right c-bold">${minLap !== Infinity ? fmtMs(minLap) : VAZIO}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    content.innerHTML = html;
  }
  // 9: MAPA DE PROVA (RacingMapAllReport.rdlc)
  else if (currentTipo === 'mapa_prova') {
    if (!lapsData.length) {
      const message = dataState.laps === 'error'
        ? 'Dados de voltas indisponíveis no momento.'
        : 'Nenhuma volta registrada para montar o mapa de prova.';
      content.innerHTML = `<div class="report-empty">${message}</div>`;
      return;
    }
    const maxLaps = Math.max(...lapsData.map(d => (d.laps || []).length), 1);
    const numDrivers = enriched.length;

    let html = `<div style="font-size: 10pt; font-weight: bold; text-align: center; margin-bottom: 2mm;">MAPA DE PROVA</div>`;
    html += `<div style="overflow-x: auto;"><table class="rdlc-table"><thead><tr>
      <th style="width: 45px;">POS</th>
      <th style="width: 45px;">LARGADA</th>`;
    for (let i = 1; i <= maxLaps; i++) html += `<th style="width: 45px;">Volta ${i}</th>`;
    html += `</tr></thead><tbody>`;

    for (let pos = 1; pos <= numDrivers; pos++) {
      html += `<tr><td class="c-center c-bold" style="background: #e6e6e6;">${pos}°</td>`;

      // Posição no grid / largada
      const atStart = enriched.find(d => (d.startPos || d.pos) === pos);
      html += `<td class="c-center c-bold">${atStart ? esc(atStart.kart) : VAZIO}</td>`;

      // Cada volta
      for (let lap = 1; lap <= maxLaps; lap++) {
        let kartAtPos = VAZIO;
        const atLap = lapsData.find(d => {
          const lp = (d.laps || []).find(l => l.lap === lap);
          return lp && lp.pos === pos;
        });
        if (atLap) kartAtPos = atLap.kart;
        else {
          // fallback se não tiver pos gravada na volta: pega da classificação
          const fb = enriched[pos - 1];
          if (fb && (fb.laps || 0) >= lap) kartAtPos = fb.kart;
        }
        html += `<td class="c-center c-bold">${esc(kartAtPos)}</td>`;
      }
      html += `</tr>`;
    }
    html += `</tbody></table></div>`;
    content.innerHTML = html;
  }
  // 10 a 13: GRIDS DE LARGADA (GridLeftReport, GridRightReport, GridLeftReport3, GridRightReport3)
  else if (currentTipo.startsWith('grid_')) {
    const is3Col = currentTipo.includes('3col');
    const leaderRight = currentTipo.includes('dir');
    const cols = is3Col ? 3 : 2;

    // Ordenação do grid conforme LapTime reorderGrid:
    let sorted = [...enriched];
    if (v.type === 'corrida') {
      // Corrida: Total voltas decrescente, tempo total crescente
      sorted.sort((a, b) => (b.laps - a.laps) || ((a.totalMs || 0) - (b.totalMs || 0)));
    } else {
      // Qualificação/Treino: Melhor volta crescente, depois 2ª MV
      sorted.sort((a, b) => {
        if (!a.bestLapTime) return 1;
        if (!b.bestLapTime) return -1;
        return a.bestLapTime - b.bestLapTime || ((a.bestLapTime2nd || 0) - (b.bestLapTime2nd || 0));
      });
    }

    let html = `<div style="font-size: 11pt; font-weight: bold; text-align: center; margin-bottom: 3mm;">GRID DE LARGADA</div>`;
    html += `<table class="grid-table"><tbody>`;

    for (let rowIdx = 0; rowIdx < sorted.length; rowIdx += cols) {
      html += `<tr>`;
      let rowDrivers = [];

      for (let c = 0; c < cols; c++) {
        const itemIndex = rowIdx + c;
        rowDrivers.push(itemIndex < sorted.length ? { ...sorted[itemIndex], orderPos: itemIndex + 1 } : null);
      }

      // Se líder à direita, inverte as posições nesta linha
      if (leaderRight) {
        rowDrivers.reverse();
      }

      rowDrivers.forEach(r => {
        const cellClass = is3Col ? 'grid-slot-3col' : 'grid-slot';
        if (r) {
          html += `<td class="${cellClass}">
            <div class="grid-pos-box">${r.orderPos}º</div>
            <div class="grid-name-box">
              <div>#${esc(r.kart)} - ${esc(r.name)}</div>
              ${r.bestLapTime ? `<div class="grid-time-sub">TMV: ${fmtMs(r.bestLapTime)}</div>` : ''}
            </div>
          </td>`;
        } else {
          html += `<td class="${cellClass}"></td>`;
        }
      });
      html += `</tr>`;
    }
    html += `</tbody></table>`;
    content.innerHTML = html;
  }
  } finally {
    finalizarRenderReport();
  }
}

const reportLogo = document.getElementById('reportLogo');
if (reportLogo) {
  reportLogo.addEventListener('error', () => {
    const wrap = document.getElementById('reportLogoWrap');
    if (wrap) wrap.innerHTML = '<span class="rep-logo-fallback">Kartódromo Internacional de Betim</span>';
  }, { once: true });
}

atualizarRegraVisual();
carregarTudo();
</script>
</body>
