<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Resultado</title>
<style>
  body { font: 13px/1.3 system-ui, "Segoe UI", sans-serif; color:#000; background:#fff; margin:16px; }
  h1 { font-size:18px; margin:0; } .sub { color:#444; margin:2px 0 12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:4px 6px; border-bottom:1px solid #ccc; text-align:left; font-variant-numeric:tabular-nums; }
  th { font-size:11px; text-transform:uppercase; color:#555; }
  .t { text-align:right; font-family: Consolas, monospace; }
  .tools { margin-bottom:12px; } .tools button { font:inherit; padding:6px 12px; }
  body.cupom { width:72mm; margin:0 2mm; font-size:11px; } body.cupom .wide { display:none; }
  @media print { .tools { display:none; } }
</style>
</head>
<body>
<div class="tools"><button onclick="print()">Imprimir A4</button> <button onclick="document.body.classList.add('cupom');print();document.body.classList.remove('cupom')">Imprimir cupom (térmica)</button></div>
<h1 id="title">Resultado</h1>
<div id="sub" class="sub"></div>
<table><thead><tr><th>Pos</th><th>Kart</th><th>Piloto</th><th class="t">Voltas</th><th class="t">Melhor</th><th class="t wide">V. melhor</th><th class="t">Dif.</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const fmt = (ms) => { if (ms == null) return '--'; const s = ms/1000, m = Math.floor(s/60); const r = (s - m*60).toFixed(3); return m ? `${m}:${r.padStart(6,'0')}` : r; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = location.pathname.split('/').pop();
fetch('/api/sessions/' + id).then(r => r.json()).then(v => {
  const TYPES = { treino:'Treino', classificacao:'Tomada de tempo', corrida:'Corrida' };
  document.title = 'Resultado · ' + v.name;
  document.getElementById('title').textContent = 'Kartódromo Internacional de Betim · ' + v.name;
  const when = v.startedAt ? new Date(v.startedAt).toLocaleString('pt-BR') : '';
  document.getElementById('sub').textContent = `${TYPES[v.type]} · ${when}${v.state !== 'encerrada' ? ' · (parcial: ' + v.state.replace('_',' ') + ')' : ''}`;
  const race = v.type === 'corrida';
  document.getElementById('rows').innerHTML = v.standings.map(r => `<tr><td>${r.position}</td><td><b>${esc(r.kart)}</b></td><td>${esc(r.name)}</td>
    <td class="t">${r.laps}</td><td class="t">${fmt(r.bestLapMs)}</td><td class="t wide">${r.bestLapNumber ?? ''}</td>
    <td class="t">${r.position === 1 ? '' : r.gapLaps ? '+' + r.gapLaps + 'V' : r.gapMs != null ? '+' + fmt(r.gapMs) : ''}</td></tr>`).join('');
});
</script>
</body>
</html>
