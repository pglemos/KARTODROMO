<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio dos karts · TV do briefing</title>
<!-- TV da sala de briefing (áudio de 06/10): assim que o tablet sorteia, cada piloto acha o próprio nome e vai direto
     para o kart. Mostra sempre o último sorteio feito; depois de 90 min sem sorteio novo, volta para a tela de espera. -->
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, "Segoe UI", sans-serif; overflow:hidden; cursor:none; }
  .bar { display:flex; align-items:center; gap:2vw; height:12vh; padding:0 2.4vw; background:#0a3d1f; }
  .bar img { height:8vh; }
  .bar .titulo { display:flex; flex-direction:column; min-width:0; }
  .bar .bateria { font-size:4.6vh; font-weight:900; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .dica { font-size:2.4vh; font-weight:700; color:#bfe8cc; }
  .bar .hora { margin-left:auto; font:900 5vh/1 ui-monospace, Consolas, monospace; color:#bfe8cc; }
  #lista { height:88vh; padding:2vh 2.4vw; display:grid; gap:1.4vh 1.6vw; grid-auto-flow:column; align-content:start; }
  .p { display:flex; align-items:center; gap:1.4vw; background:#101010; border-radius:1.2vh; padding:0 0 0 1.6vw; overflow:hidden; height:var(--h); }
  .p .nome { flex:1; min-width:0; font-size:var(--fs); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p .kart { align-self:stretch; display:flex; align-items:center; justify-content:center; flex:none; width:calc(var(--fs) * 4.6); background:#f5c518; color:#000;
             font:900 calc(var(--fs) * 1.35)/1 ui-monospace, Consolas, monospace; }
  .p .kart small { font:800 calc(var(--fs) * .42)/1 system-ui, sans-serif; margin-right:.5vw; opacity:.7; }
  .novo .p { animation: chega 1.4s ease-out both; }
  @keyframes chega { from { transform:scale(.92); background:#1d5c34; } to { transform:none; background:#101010; } }
  .idle { height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; color:#666; }
  .idle b { font-size:6vh; color:#888; } .idle span { font-size:3vh; }
</style>
</head>
<body>
<div class="bar">
  <img src="/kib-logo.png" alt="" onerror="this.remove()">
  <div class="titulo"><span id="bateria" class="bateria">Sorteio dos karts</span><span id="dica" class="dica">Procure o seu nome e vá direto para o seu kart</span></div>
  <span id="hora" class="hora"></span>
</div>
<div id="lista"></div>
<script>
const MAX_IDADE_MS = 90 * 60_000;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
// nome longo vira primeiro nome + último sobrenome, como no telão
const curto = (n) => { const p = String(n || '').trim().split(/\s+/); return p.join(' ').length <= 16 || p.length < 3 ? p.join(' ') : p[0] + ' ' + p[p.length - 1]; };
let mostrado = '';

function espera() {
  if (mostrado === 'espera') return;
  mostrado = 'espera';
  document.getElementById('bateria').textContent = 'Sorteio dos karts';
  document.getElementById('dica').textContent = 'Kartódromo Internacional de Betim';
  document.getElementById('lista').innerHTML = '<div class="idle"><b>Aguardando o sorteio dos karts</b><span>Assim que o sorteio for feito no tablet, os karts aparecem aqui</span></div>';
  document.getElementById('lista').style.gridTemplateColumns = '1fr';
}

function mostra(s) {
  const chave = s.sessaoId + ':' + s.em;
  if (chave === mostrado) return;
  const novo = mostrado !== '' && mostrado !== 'espera';
  mostrado = chave;
  document.getElementById('bateria').textContent = s.bateria + (s.tipoKart ? ' · ' + (s.tipoKart === 'super' ? 'Super Kart' : 'Light') : '');
  document.getElementById('dica').textContent = 'Procure o seu nome e vá direto para o seu kart';
  const n = s.pilotos.length;
  // colunas e altura das linhas pelo número de pilotos: tudo cabe na tela sem rolar
  const cols = n <= 6 ? 1 : n <= 14 ? 2 : n <= 24 ? 3 : 4;
  const linhas = Math.max(1, Math.ceil(n / cols));
  const h = Math.min(14, (84 - (linhas - 1) * 1.4) / linhas);
  const lista = document.getElementById('lista');
  lista.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  lista.style.gridTemplateRows = `repeat(${linhas}, auto)`;
  lista.style.setProperty('--h', h + 'vh');
  // letra pela altura da linha E pela largura da coluna (cabem ~17 letras do nome + a caixa do kart)
  const colunaVw = (95.2 - (cols - 1) * 1.6) / cols;
  lista.style.setProperty('--fs', `min(${Math.min(6, h * 0.5)}vh, ${(colunaVw / 16).toFixed(2)}vw)`);
  lista.className = novo ? 'novo' : '';
  lista.innerHTML = s.pilotos.map((p) => `<div class="p"><span class="nome">${esc(curto(p.nome))}</span><span class="kart"><small>KART</small>${esc(p.kart)}</span></div>`).join('');
}

async function atualiza() {
  try {
    const r = await fetch('/api/sorteio/ultimo', { cache: 'no-store' });
    const { sorteio } = await r.json();
    if (!sorteio || !sorteio.pilotos.length || Date.now() - sorteio.em > MAX_IDADE_MS) espera(); else mostra(sorteio);
  } catch { /* sem rede: mantém o que está na tela e tenta de novo */ }
}
function relogio() { document.getElementById('hora').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
relogio(); setInterval(relogio, 10_000);
atualiza(); setInterval(atualiza, 3_000);
</script>
</body>
</html>
