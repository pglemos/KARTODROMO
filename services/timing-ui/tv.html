<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronometragem · TV</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, "Segoe UI", sans-serif; overflow:hidden; cursor:none; }
  .bar { display:flex; align-items:center; gap:2vw; padding:1.4vh 2vw; background:#0a3d1f; }
  .bar .name { font-size:4vh; font-weight:900; text-transform:uppercase; }
  .bar .state { font-size:2.4vh; font-weight:800; padding:.4vh 1vw; border-radius:.6vh; background:#1db954; color:#000; }
  .bar .state.fin { background:#fff; }
  .bar .timer { margin-left:auto; font:900 6vh/1 ui-monospace, Consolas, monospace; }
  table { width:100%; border-collapse:collapse; }
  th { font-size:2.2vh; color:#8b978f; text-align:left; padding:.8vh 1.2vw; font-weight:700; text-transform:uppercase; }
  td { font-size:var(--fs, 4.2vh); padding:.35vh 1.2vw; font-weight:800; font-variant-numeric:tabular-nums; border-top:1px solid #1a1a1a; white-space:nowrap; }
  tr:nth-child(even) td { background:#0c0c0c; }
  .pos { width:6vw; color:#f5c518; } .kart { width:8vw; } .kart b { background:#fff; color:#000; border-radius:.5vh; padding:0 .6vw; }
  .nm { overflow:hidden; text-overflow:ellipsis; max-width:40vw; }
  .t { font-family: ui-monospace, Consolas, monospace; text-align:right; }
  .best { color:#c77dff; }
  .flash td { animation: fl 1.2s ease-out; }
  @keyframes fl { from { background:#1d5c34; } to { background:transparent; } }
  .idle { height:80vh; display:flex; align-items:center; justify-content:center; font-size:5vh; color:#555; }
</style>
</head>
<body>
<div class="bar"><span id="name" class="name">Kartódromo Internacional de Betim</span><span id="state" class="state" hidden></span><span id="timer" class="timer"></span></div>
<div id="body"></div>
<script>
const fmt = (ms) => { if (ms == null) return '--'; const s = ms/1000, m = Math.floor(s/60); const r = (s - m*60).toFixed(3); return m ? `${m}:${r.padStart(6,'0')}` : r; };
const clockFmt = (ms) => { const t = Math.max(0, Math.ceil((ms||0)/1000)); return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lastSeen = {};

function render(st) {
  const v = st.focus;
  const show = v && v.state !== 'cancelada' && (v.state !== 'preparando' || v.competitors.length);
  if (!show) { document.getElementById('body').innerHTML = '<div class="idle">Aguardando a próxima bateria</div>'; document.getElementById('state').hidden = true; document.getElementById('timer').textContent = ''; return; }
  document.getElementById('name').textContent = v.name;
  const stEl = document.getElementById('state');
  stEl.hidden = false;
  stEl.className = 'state' + (v.state === 'bandeira_final' || v.state === 'encerrada' ? ' fin' : '');
  stEl.textContent = { preparando:'EM BREVE', em_andamento:'AO VIVO', bandeira_final:'🏁 BANDEIRA FINAL', encerrada:'RESULTADO FINAL' }[v.state] || '';
  document.getElementById('timer').textContent = v.state === 'em_andamento' ? clockFmt(v.remainingMs) : '';
  const race = v.type === 'corrida';
  const rows = v.state === 'preparando' ? v.competitors.map((c, i) => ({ position: i+1, kart: c.kart, name: c.name, laps: 0 })) : v.standings;
  const best = Math.min(...rows.filter(r => r.bestLapMs).map(r => r.bestLapMs));
  const n = Math.max(rows.length, 8);
  document.body.style.setProperty('--fs', Math.min(5.2, 78 / (n + 1)).toFixed(2) + 'vh');
  document.getElementById('body').innerHTML = `<table><thead><tr><th>Pos</th><th>Kart</th><th>Piloto</th>
    <th class="t">Voltas</th><th class="t">Última</th><th class="t">Melhor</th>${race ? '<th class="t">Dif.</th>' : ''}</tr></thead><tbody>` +
    rows.map(r => {
      const flash = r.lastCrossingWallMs && lastSeen[r.kart] !== r.lastCrossingWallMs && lastSeen[r.kart] !== undefined;
      lastSeen[r.kart] = r.lastCrossingWallMs;
      return `<tr class="${flash ? 'flash' : ''}"><td class="pos">${r.position}</td><td class="kart"><b>${esc(r.kart)}</b></td>
      <td class="nm">${esc(r.name || 'Kart ' + r.kart)}${r.finished ? ' 🏁' : ''}</td><td class="t">${r.laps ?? ''}</td>
      <td class="t">${fmt(r.lastLapMs)}</td><td class="t ${r.bestLapMs === best ? 'best' : ''}">${fmt(r.bestLapMs)}</td>
      ${race ? `<td class="t">${r.position === 1 ? '' : r.gapLaps ? '+' + r.gapLaps + 'V' : r.gapMs != null ? '+' + fmt(r.gapMs) : ''}</td>` : ''}</tr>`;
    }).join('') + '</tbody></table>';
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('state', (e) => render(JSON.parse(e.data)));
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}
connect();
</script>
</body>
</html>
