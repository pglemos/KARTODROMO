<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Autoatendimento</title>
<style>
  :root { --bg:#0b0f0d; --card:#141a17; --line:#2a342f; --text:#eef3ef; --muted:#93a198; --accent:#1db954; --red:#e5484d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background: radial-gradient(ellipse at top, #16241c, var(--bg) 60%); color:var(--text); font:20px/1.35 system-ui, "Segoe UI", sans-serif; user-select:none; overflow:hidden; }
  .wrap { height:100%; display:flex; align-items:center; justify-content:center; padding:24px 24px var(--kbh, 24px); transition: padding .15s; }
  .card { width:min(1100px, 100%); max-height:100%; overflow:auto; background:var(--card); border:2px solid #1f6b3e; border-radius:22px; padding:34px 40px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  h1 { margin:0; font-size:38px; font-weight:800; } .sub { color:var(--muted); margin:6px 0 26px; }
  .brand { float:right; text-align:right; color:var(--accent); font-weight:900; font-size:18px; letter-spacing:.04em; }
  label { display:block; color:var(--muted); font-size:16px; margin:0 0 6px; }
  input, select { width:100%; font:inherit; font-size:22px; padding:14px 16px; border-radius:12px; border:2px solid var(--line); background:#0c110e; color:var(--text); }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:16px 18px; } .s2 { grid-column: span 2; }
  .actions { display:flex; justify-content:flex-end; gap:16px; margin-top:28px; }
  button { font:inherit; font-weight:800; font-size:22px; border-radius:40px; padding:16px 40px; border:2px solid var(--accent); background:transparent; color:var(--text); cursor:pointer; }
  button.pri { background:var(--accent); color:#04140a; } button:disabled { opacity:.35; }
  .check { display:flex; align-items:center; gap:14px; font-size:20px; margin-top:18px; cursor:pointer; }
  .check input { width:32px; height:32px; accent-color: var(--accent); }
  .opt { display:flex; align-items:center; gap:18px; padding:18px 20px; border:2px solid var(--line); border-radius:14px; margin-bottom:12px; cursor:pointer; }
  .opt.on { border-color:var(--accent); background:#12301f; }
  .opt .t { font:900 30px ui-monospace, Consolas, monospace; width:110px; } .opt .i { flex:1; } .opt small { color:var(--muted); display:block; font-size:17px; }
  .opt .v { color:var(--muted); font-size:18px; }
  .err { background:#3b1618; color:#ffb0b3; padding:14px 18px; border-radius:12px; margin-top:18px; }
  .big { font-size:28px; } .hl { color:#ffd84d; font-weight:800; }
  a { color:#ffd84d; }
  #kb { position:fixed; left:0; right:0; bottom:0; background:#0d1210; border-top:2px solid var(--line); padding:10px; display:none; z-index:20; }
  #kb .r { display:flex; justify-content:center; gap:8px; margin-bottom:8px; }
  #kb button { border-radius:10px; padding:0; width:76px; height:66px; font-size:24px; border:1px solid #33413a; background:#1b2420; }
  #kb button.w { width:170px; } #kb button.ww { width:420px; } #kb button.pri { background:var(--accent); color:#04140a; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:30; }
  .modal .card { width:min(900px, 94%); max-height:80vh; }
  .modal p { font-size:18px; color:#cfd8d2; }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="screen"></div></div>
<div id="kb"></div>
<iframe id="printer" style="position:absolute;width:0;height:0;border:0;visibility:hidden"></iframe>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = (s) => String(s || '').replace(/\D/g, '');
let EMPRESA = 'Kartódromo Internacional de Betim';
fetch('/api/config').then(r => r.json()).then(c => { EMPRESA = c.empresa; }).catch(() => {});

// ---------- estado da sessao do cliente
let S;
function reset() { S = { ident: '', menor: false, cliente: null, token: null, dependentes: [], selecionados: [], bateria: null, erro: '' }; screenIdent(); }

async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Não foi possível concluir. Procure a recepção.');
  return data;
}

function head(title, sub) { return `<div class="brand">🏁 ${esc(EMPRESA).toUpperCase()}</div><h1>${title}</h1><div class="sub">${sub}</div>`; }
function show(html) { hideKb(); $('screen').innerHTML = html + (S.erro ? `<div class="err">${esc(S.erro)}</div>` : ''); S.erro = ''; bindKb(); $('screen').scrollTop = 0; }
function fail(e, again) { S.erro = e.message || String(e); again(); }

// ---------- 1. identificacao
function screenIdent() {
  show(head('Autoatendimento', `Seja bem-vindo(a) ao ${esc(EMPRESA)}!`) + `
    <label>CPF, RG, passaporte ou e-mail</label>
    <input id="ident" data-kb="ident" value="${esc(S.ident)}" autocomplete="off">
    <label class="check"><input type="checkbox" id="menor" ${S.menor ? 'checked' : ''}> Sou responsável por menor de idade que vai correr</label>
    <div class="actions"><button class="pri" onclick="doIdent()">Próximo</button></div>`);
  setTimeout(() => $('ident').focus(), 50);
}
async function doIdent() {
  S.ident = $('ident').value.trim(); S.menor = $('menor').checked;
  if (S.ident.length < 5) return fail(new Error('Digite seu CPF (só números), documento ou e-mail.'), screenIdent);
  try {
    const r = await api('/api/totem/identificar', { identificador: S.ident });
    if (!r.cliente) return screenCadastro(null);
    if (r.cliente.bloqueado) return fail(new Error('Seu cadastro precisa de atenção. Por favor, procure a recepção.'), screenIdent);
    S.cliente = r.cliente; S.token = r.token; S.dependentes = r.dependentes;
    screenOla();
  } catch (e) { fail(e, screenIdent); }
}

// ---------- 2a. cliente encontrado
function screenOla() {
  const c = S.cliente;
  show(head(`Olá, ${esc(c.nome.split(' ')[0])}!`, 'Encontramos seu cadastro.') + `
    <p class="big"><b>${esc(c.nome)}</b></p>
    <p style="color:var(--muted)">${c.email ? 'E-mail: ' + esc(c.email) + '<br>' : ''}${c.telefone ? 'Telefone: ' + esc(c.telefone) : ''}</p>
    ${!c.lgpd || !c.temNascimento ? `<p class="hl">Precisamos completar seu cadastro antes de continuar.</p>` : ''}
    <div class="actions">
      <button onclick="reset()">Não sou eu</button>
      <button onclick="screenCadastro(S.cliente)">Atualizar meus dados</button>
      <button class="pri" onclick="${!c.lgpd || !c.temNascimento ? 'screenCadastro(S.cliente)' : 'afterCliente()'}">Continuar</button>
    </div>`);
}

// ---------- 2b. cadastro (novo ou atualizacao) / menor
const CAMPOS = [
  ['tipoDocumento', 'Tipo de documento', 'select', ''], ['documento', 'Documento', 'num', ''], ['nome', 'Nome completo', 'text', 's2'],
  ['email', 'E-mail', 'email', 's2'], ['telefone', 'Telefone com DDD', 'num', ''], ['nascimento', 'Nascimento (DD/MM/AAAA)', 'date', ''],
  ['peso', 'Peso (kg)', 'num', ''], ['cep', 'CEP', 'num', ''], ['endereco', 'Endereço', 'text', 's2'], ['bairro', 'Bairro', 'text', ''], ['cidade', 'Cidade', 'text', ''],
];
let cadastroModo = null; // 'novo' | 'atualizar' | 'menor'
function screenCadastro(cliente, menor) {
  cadastroModo = menor ? 'menor' : cliente ? 'atualizar' : 'novo';
  const campos = menor ? CAMPOS.filter(c => ['nome', 'nascimento', 'tipoDocumento', 'documento', 'peso'].includes(c[0])) : CAMPOS;
  const pre = cadastroModo === 'novo' ? { documento: /@/.test(S.ident) ? '' : digits(S.ident), email: /@/.test(S.ident) ? S.ident : '' } : {};
  show(head(menor ? 'Cadastro do menor' : cliente ? 'Atualizar cadastro' : 'Cadastro', menor ? 'Dados de quem vai correr (menor de idade).' : cliente ? 'Preencha só o que mudou. Campos em branco continuam como estão.' : 'Registre-se para continuar.') + `
    <div class="grid">${campos.map(([k, l, t, cls]) => `<div class="${cls}"><label>${l}</label>${
      t === 'select' ? `<select id="f_${k}"><option>CPF</option><option>RG</option><option>PASSAPORTE</option></select>`
      : `<input id="f_${k}" data-kb="${t}" value="${esc(pre[k] || '')}" autocomplete="off">`}</div>`).join('')}</div>
    ${menor ? '' : `<label class="check"><input type="checkbox" id="lgpd"> Li e concordo com o&nbsp;<a href="#" onclick="lgpdText();return false">Termo de Consentimento para Tratamento de Dados Pessoais</a></label>`}
    <div class="actions"><button onclick="${menor ? 'screenQuem()' : cliente ? 'screenOla()' : 'screenIdent()'}">Voltar</button><button class="pri" onclick="saveCadastro()">Próximo</button></div>`);
}
function readForm() {
  const o = {};
  for (const [k] of CAMPOS) { const el = $('f_' + k); if (el) o[k] = el.value.trim(); }
  if (o.nascimento) { const m = o.nascimento.match(/^(\d{2})\/?(\d{2})\/?(\d{4})$/); o.nascimento = m ? `${m[3]}-${m[2]}-${m[1]}` : 'x'; }
  return o;
}
async function saveCadastro() {
  const dados = readForm();
  if (dados.nascimento === 'x') return fail(new Error('Data de nascimento inválida. Use DD/MM/AAAA.'), () => screenCadastro(S.cliente, cadastroModo === 'menor'));
  try {
    if (cadastroModo === 'menor') {
      const r = await api('/api/totem/cadastro', { dados, lgpd: true, responsavelId: S.cliente.id, responsavelToken: S.token });
      S.dependentes.push({ id: r.id, nome: dados.nome, token: r.token, novo: true });
      S.selecionados.push(r.id);
      return screenQuem();
    }
    if (!$('lgpd').checked) throw new Error('Para continuar, aceite o termo de consentimento (LGPD).');
    if (cadastroModo === 'atualizar') {
      await api('/api/totem/cadastro', { id: S.cliente.id, token: S.token, dados, lgpd: true });
      S.cliente.lgpd = true; if (dados.nascimento) S.cliente.temNascimento = true;
      if (!S.cliente.temNascimento) throw new Error('Informe sua data de nascimento.');
    } else {
      const r = await api('/api/totem/cadastro', { dados, lgpd: true });
      S.cliente = { id: r.id, nome: dados.nome, lgpd: true, temNascimento: true }; S.token = r.token; S.dependentes = [];
    }
    afterCliente();
  } catch (e) { fail(e, () => screenCadastro(cadastroModo === 'atualizar' ? S.cliente : null, false)); }
}
function lgpdText() {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><h1 style="font-size:28px">Consentimento para tratamento de dados</h1>
    <p>Ao se cadastrar, você autoriza o ${esc(EMPRESA)} a tratar seus dados pessoais (nome, documento, contato, data de nascimento, peso e endereço) para: identificar você nas baterias e corridas, emitir o termo de responsabilidade, registrar tempos e resultados, cumprir obrigações legais e entrar em contato sobre suas reservas.</p>
    <p>Os dados ficam armazenados nos sistemas do kartódromo e não são vendidos a terceiros. Você pode pedir a qualquer momento, na recepção, acesso, correção ou exclusão dos seus dados, nos termos da Lei 13.709/2018 (LGPD).</p>
    <div class="actions"><button class="pri" onclick="this.closest('.modal').remove()">Fechar</button></div></div>`;
  document.body.appendChild(m);
}

// ---------- 3. quem vai correr
function afterCliente() {
  if (!S.selecionados.length && !S.menor) S.selecionados = [S.cliente.id];
  if (S.menor || S.dependentes.length) return screenQuem();
  screenBaterias();
}
function screenQuem() {
  const pessoas = [{ id: S.cliente.id, nome: S.cliente.nome + ' (você)' }, ...S.dependentes];
  show(head('Quem vai correr?', 'Toque para marcar cada pessoa que vai participar.') +
    pessoas.map(p => `<div class="opt ${S.selecionados.includes(p.id) ? 'on' : ''}" onclick="toggleQuem(${p.id})"><span class="i"><b>${esc(p.nome)}</b></span><span class="v">${S.selecionados.includes(p.id) ? '✔' : ''}</span></div>`).join('') + `
    <div class="actions"><button onclick="screenCadastro(null, true)">+ Cadastrar menor</button><button class="pri" ${S.selecionados.length ? '' : 'disabled'} onclick="screenBaterias()">Próximo</button></div>`);
}
function toggleQuem(id) { S.selecionados = S.selecionados.includes(id) ? S.selecionados.filter(x => x !== id) : [...S.selecionados, id]; screenQuem(); }

// ---------- 4. baterias
async function screenBaterias() {
  let list = [];
  try { list = await api('/api/totem/baterias'); } catch (e) { S.erro = e.message; }
  const n = S.selecionados.length;
  show(head('Escolha a bateria', `Selecione o horário${n > 1 ? ` (${n} pilotos)` : ''}.`) +
    (list.filter(b => b.livres >= n).map(b => `<div class="opt ${S.bateria === b.id ? 'on' : ''}" onclick="S.bateria=${b.id};screenBaterias()">
      <span class="t">${b.inicio.slice(11, 16)}</span><span class="i"><b>${esc(b.nome)}</b><small>${b.tipoKart === 'super' ? 'Super kart' : 'Kart light'} · inicia às ${b.inicio.slice(11, 16)}</small></span>
      <span class="v">Vagas: ${b.livres}</span></div>`).join('') || '<p class="big">Não há baterias com vagas disponíveis hoje. Procure a recepção.</p>') + `
    <div class="actions"><button onclick="${S.menor || S.dependentes.length ? 'screenQuem()' : 'reset()'}">Voltar</button><button class="pri" ${S.bateria ? '' : 'disabled'} onclick="confirmar()">Confirmar</button></div>`);
}
async function confirmar() {
  const participantes = S.selecionados.map(id => ({ id, token: id === S.cliente.id ? S.token : S.dependentes.find(d => d.id === id)?.token }));
  try {
    const r = await api('/api/totem/inscrever', { bateriaId: S.bateria, participantes });
    $('printer').src = r.termoUrl; // imprime o(s) termo(s) direto na impressora do totem
    screenSucesso(r.bateria.inicio.slice(11, 16), participantes.length);
  } catch (e) { fail(e, screenBaterias); }
}

// ---------- 5. sucesso
function screenSucesso(hora, n) {
  show(head('Reserva realizada com sucesso!', '') + `
    <p class="big">Dirija-se à recepção para concluir a reserva e assinar ${n > 1 ? 'os termos' : 'seu termo'} de responsabilidade${n > 1 ? ` (${n} termos impressos)` : ''}.</p>
    <p class="big">Sua bateria começa às <span class="hl">${hora}</span>.</p>
    <p class="big">Atenção às informações passadas no briefing e divirta-se!</p>
    <div class="actions"><button class="pri" onclick="reset()">Concluir</button></div>`);
  clearTimeout(S.fim); S.fim = setTimeout(reset, 25000);
}

// ---------- teclado na tela
const LAY = {
  num: [['1','2','3'],['4','5','6'],['7','8','9'],['⌫','0','OK']],
  date: [['1','2','3'],['4','5','6'],['7','8','9'],['⌫','0','/'],['OK']],
  text: [['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L','Ç'],['Z','X','C','V','B','N','M','-',"'",'⌫'],['ESPAÇO','OK']],
  email: [['1','2','3','4','5','6','7','8','9','0'],['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','@'],['z','x','c','v','b','n','m','.','_','⌫'],['.com','.com.br','@gmail.com','OK']],
};
LAY.ident = [['1','2','3','4','5','6','7','8','9','0'],...LAY.email.slice(1)];
let kbTarget = null;
function bindKb() { document.querySelectorAll('[data-kb]').forEach(el => { el.addEventListener('focus', () => showKb(el)); el.addEventListener('click', () => { if (kbTarget !== el) showKb(el); }); }); }
function showKb(el) {
  kbTarget = el; const lay = LAY[el.dataset.kb] || LAY.text; const kb = $('kb');
  kb.innerHTML = lay.map(r => `<div class="r">${r.map(k => `<button class="${k === 'OK' ? 'pri w' : k === 'ESPAÇO' ? 'ww' : k.length > 2 ? 'w' : ''}" data-k="${k}">${k}</button>`).join('')}</div>`).join('');
  kb.style.display = 'block'; document.body.style.setProperty('--kbh', kb.offsetHeight + 16 + 'px');
  kb.querySelectorAll('button').forEach(b => b.onpointerdown = (e) => { e.preventDefault(); press(b.dataset.k); });
  setTimeout(() => el.scrollIntoView({ block:'center', behavior:'smooth' }), 60);
}
function hideKb() { $('kb').style.display = 'none'; document.body.style.setProperty('--kbh', '24px'); kbTarget = null; }
function press(k) {
  const el = kbTarget; if (!el) return;
  if (k === 'OK') { const all = [...document.querySelectorAll('[data-kb]')]; const nx = all[all.indexOf(el) + 1]; if (nx) { nx.focus(); showKb(nx); } else { el.blur(); hideKb(); } return; }
  if (k === '⌫') el.value = el.value.slice(0, -1);
  else if (k === 'ESPAÇO') el.value += ' ';
  else el.value += k;
  if (el.dataset.kb === 'date') { const d = digits(el.value).slice(0, 8); el.value = d.length > 4 ? `${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0,2)}/${d.slice(2)}` : d; }
  poke();
}
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#kb') && !e.target.closest('[data-kb]')) hideKb(); });

// ---------- volta pro inicio se ninguem mexer
let idle; function poke() { clearTimeout(idle); idle = setTimeout(() => { if (S.ident || S.cliente) reset(); }, 90000); }
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, poke));
document.addEventListener('contextmenu', e => e.preventDefault());
reset(); poke();
</script>
</body>
</html>
